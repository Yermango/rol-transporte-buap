        <select id="modalU" class="input-field" style="appearance:auto; padding: 12px; margin-bottom:8px;">${uOptions}</select>
        <label style="font-size:13px; font-weight:bold;">Estatus de Unidad:</label>
        <select id="modalEstU" class="input-field" style="appearance:auto; padding: 12px;" onchange="if(this.value!=='Activa') document.getElementById('modalOp').value='VACIO'">
          ${selectUStatus}
        </select>

        <label style="font-size:13px; font-weight:bold;">2. Operador Asignado:</label>
        <input type="text" id="modalOp" list="opList" class="input-field" value="${n||''}" placeholder="Buscar o vaciar..." autocomplete="off" style="margin-bottom:8px;">
        <datalist id="opList">${opOptions}</datalist>
        <label style="font-size:13px; font-weight:bold;">Estatus de Operador:</label>
        <select id="modalEstOp" class="input-field" style="appearance:auto; padding: 12px;" onchange="if(this.value!=='Activo') document.getElementById('modalU').value='VACIO'">
          ${selectOpStatus}
        </select>

        <button type="button" class="btn-primary" onclick="guardarFlotaDedicado()">Guardar y Separar Automáticamente</button>
        <button type="button" class="btn-outline" onclick="closeSheet()">Cancelar</button>
    `);
};

window.guardarFlotaDedicado = function() {
    let ctx = window._flotaCtx || {};
    let origU = ctx.origU || "";
    let origOp = ctx.origOp || "";
    let origK = ctx.origK || "";

    let finalU = document.getElementById("modalU").value;
    let finalOp = document.getElementById("modalOp").value.trim();
    let stU = document.getElementById("modalEstU").value;
    let stOp = document.getElementById("modalEstOp").value;
    let ds = getDayState();
    store.unassignedReasons = store.unassignedReasons || {};
    store.operadoresDB = store.operadoresDB || {};
    ds.opOverride = ds.opOverride || {}; ds.unitOverride = ds.unitOverride || {};

    if(origU) ds.opOverride[origU] = "VACIO";
    if(origOp) {
        ds.unitOverride[origOp] = "VACIO";
        let oldCode = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === origOp);
        if(oldCode) ds.unitOverride[oldCode] = "VACIO";
    }
    if(origK) ds.unitOverride[origK] = "VACIO";

    if(finalU && finalU !== "VACIO") ds.opOverride[finalU] = "VACIO";
    if(finalOp && finalOp !== "VACIO") {
        ds.unitOverride[finalOp] = "VACIO";
        let opCode = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === finalOp);
        if(opCode) ds.unitOverride[opCode] = "VACIO";
    }

    if(finalU && finalU !== "VACIO") {
        if(stU === "Activa") delete store.unassignedReasons[finalU];
        else store.unassignedReasons[finalU] = stU;
    }
    if(finalOp && finalOp !== "VACIO") {
        let opCode = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === finalOp);
        if(stOp === "Activo") {
            delete store.unassignedReasons[finalOp];
            if(opCode) delete store.unassignedReasons[opCode];
        } else {
            store.unassignedReasons[finalOp] = stOp;
            if(opCode) store.unassignedReasons[opCode] = stOp;
        }
    }

    if(finalU !== "VACIO" && finalOp !== "" && finalOp !== "VACIO") {
        ds.opOverride[finalU] = finalOp;
        ds.unitOverride[finalOp] = finalU;
        let opC = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === finalOp);
        if (opC) ds.unitOverride[opC] = finalU;
    }

    store.globalFleet = store.globalFleet || [];
    let fleetRow = store.globalFleet.find(x => String(x.u) === String(origU) || (origK && String(x.k) === String(origK)) || (origOp && x.n === origOp));
    if(!fleetRow) { fleetRow = {}; store.globalFleet.push(fleetRow); }
    if(finalU === "VACIO") { delete fleetRow.u; } else if(finalU) fleetRow.u = finalU;
    if(finalOp === "VACIO") { delete fleetRow.n; } else if(finalOp) fleetRow.n = finalOp;
    if(origK && !fleetRow.k) fleetRow.k = origK;

    let motivosFlota = [];
    if (stU && stU !== "Activa") motivosFlota.push(stU);
    if (stOp && stOp !== "Activo") motivosFlota.push(stOp);
    let reasonText = motivosFlota.length ? motivosFlota.join(" / ") : "Cambio de asignación en Flota";

    registrarEnHistorial({
        tripTime: "Todo el día",
        clave: origK || "—",
        route: "Edición de Flota",
        scope: "Impacta a todas las vueltas planeadas",
        oldUnit: origU || "S/U",
        newUnit: (!finalU || finalU === "VACIO") ? "S/U" : finalU,
        oldOp: origOp || "Sin Asignar",
        newOp: (!finalOp || finalOp === "VACIO") ? "Sin Asignar" : finalOp,
        reason: reasonText,
        type: "Flota"
    });

    closeSheet();
    render();
    savePatch({
        [`state/${store.currentDay}/opOverride`]: ds.opOverride,
        [`state/${store.currentDay}/unitOverride`]: ds.unitOverride,
        [`state/${store.currentDay}/unitChanges`]: ds.unitChanges,
        unassignedReasons: store.unassignedReasons,
        globalFleet: store.globalFleet,
        globalHistory: store.globalHistory
    });
};

window.procesarCambio = function() {
    let ctx = window._changeModalCtx || {};
    let fleetKey = ctx.fleetKey || "";
    let tripId = ctx.tripId || "";
    let oldU = ctx.oldU || "";
    let oldOp = ctx.oldOp || "";

    let newU = document.getElementById("newUInput").value;
    let newOp = document.getElementById("newOpInput").value.trim();
    if(newOp === "") newOp = "VACIO";
    let reason = window._selectedReason || "Reasignación manual";
    let ds = getDayState();
    let scopeEl = document.getElementById("scopeSelect");
    let scope = (tripId && tripId !== 'null' && scopeEl) ? scopeEl.value : 'all';
    
    if(scope === 'all' && fleetKey) {
        ds.unitOverride[fleetKey] = newU === "" ? "VACIO" : newU;
        ds.opOverride[fleetKey] = newOp === "" ? "VACIO" : newOp;
        if (tripId) {
            delete ds.tripUnitOverride[tripId];
            delete ds.tripOpOverride[tripId];
        }
    } else if (tripId) {
        ds.tripUnitOverride[tripId] = newU === "" ? "VACIO" : newU;
        ds.tripOpOverride[tripId] = newOp === "" ? "VACIO" : newOp;
    }

    let changedTrip = (tripId && tripId !== 'null') ? (store.days[store.currentDay].trips || []).find(x => String(x.id) === String(tripId)) : null;
    registrarEnHistorial({
        tripTime: changedTrip ? changedTrip.h : "N/A",
        clave: changedTrip ? (changedTrip.k || fleetKey || "—") : (fleetKey || "—"),
        route: changedTrip ? formatRouteName(changedTrip.o, changedTrip.d) : "Ruta General",
        scope: scope === "all" ? "Todas las vueltas de este operador" : "Solo este horario",
        tripId: tripId,
        oldUnit: oldU || "S/U",
        newUnit: (!newU || newU === "VACIO") ? "S/U" : newU,
        oldOp: oldOp || "Sin Asignar",
        newOp: (!newOp || newOp === "VACIO") ? "Sin Asignar" : newOp,
        reason: reason,
        type: "Viaje"
    });

    closeSheet();
    render();
    savePatch({
        [`state/${store.currentDay}/unitOverride`]: ds.unitOverride,
        [`state/${store.currentDay}/opOverride`]: ds.opOverride,
        [`state/${store.currentDay}/tripUnitOverride`]: ds.tripUnitOverride,
        [`state/${store.currentDay}/tripOpOverride`]: ds.tripOpOverride,
        [`state/${store.currentDay}/unitChanges`]: ds.unitChanges,
        globalHistory: store.globalHistory
    });
};

// MODAL DE DISPONIBILIDAD MEJORADO CON VENTANAS EXACTAS (DE HH:MM A HH:MM) Y SIMULADOR DE HORA
window.verDisponibilidad = function(customTimeStr) {
    let nowMin = new Date().getHours()*60 + new Date().getMinutes();
    let refMin = customTimeStr ? hhmmToMins(customTimeStr) : nowMin;
    let timeVal = minsToHhmm(refMin);

    let { opWindows } = calcularEstadoFlotaYVentanas(refMin);
    opWindows.sort((a, b) => {
        if (a.freeNow !== b.freeNow) return a.freeNow ? -1 : 1;
        if (a.isGuardia !== b.isGuardia) return a.isGuardia ? -1 : 1;
        return b.freeMins - a.freeMins;
    });

    let html = opWindows.map(r => `
        <div class="avail-row">
            <div class="avail-top">
                <span class="avail-name">${r.nombre}</span>
                <span class="avail-unit">${r.unidad ? 'U-'+r.unidad : 'S/U'}</span>
            </div>
            <span class="avail-status ${r.badge}">${r.statusLabel}</span>
            <div class="avail-detail" style="margin-bottom: 5px; font-size:13px;">
                <b>Ventana exacta:</b> De <b>${r.winFrom}</b> a <b>${r.winTo}</b> · ${r.detail}
            </div>
            <div class="avail-next" style="font-size:12px; color:var(--ink-soft);">Siguiente salida: ${r.proxima}</div>
        </div>`).join('');

    openSheet(`
        <h2>⏱ Disponibilidad por Ventana Horaria</h2>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;background:var(--surface-2);padding:8px 10px;border-radius:10px;">
            <label style="font-size:12.5px;font-weight:700;">Consultar a las:</label>
            <input type="time" value="${timeVal}" class="input-field" style="margin:0;padding:6px 10px;width:auto;min-height:36px;font-size:14px;" onchange="verDisponibilidad(this.value)">
            <button type="button" class="hour-toggle restore-btn-block" onclick="verDisponibilidad('06:30')">Ver 06:30</button>
            <button type="button" class="hour-toggle" onclick="verDisponibilidad()">Ahora</button>
        </div>
        <div style="max-height:58vh;overflow-y:auto;">${html || '<p style="text-align:center;color:gray;padding:20px;">No hay operadores registrados.</p>'}</div>
        <button type="button" class="btn-outline" onclick="closeSheet()">Cerrar</button>
    `);
};

window.verVacios = function() {
    let trips = store.days[store.currentDay] ? store.days[store.currentDay].trips : [];
    let ds = getDayState(); var groups = {};
    let baselineOp = {}; if(store.globalFleet) { store.globalFleet.forEach(g => { if(g.u && g.n) baselineOp[String(g.u)] = g.n; }); }

    trips.forEach(t => {
      let asg = resolveTripAssignment(t, ds, baselineOp);
      if(asg.op) { if (!groups[asg.op]) groups[asg.op] = { nombre: asg.op, unidad: asg.unit, trips: [] }; groups[asg.op].trips.push(t); }
    });
    
    var results = [];
    Object.keys(groups).forEach(g => {
      var list = groups[g].trips.slice().sort((a,b) => a.h.localeCompare(b.h));
      for (var i=0; i<list.length-1; i++){
        var cur = list[i], nxt = list[i+1];
        let curDest = normLoc(cur.d), nxtOrig = normLoc(nxt.o);
        if (curDest !== nxtOrig) {
          if(curDest.includes("CU2") || nxtOrig.includes("CU2")) {
              results.push({ nombre: groups[g].nombre, unidad: groups[g].unidad, viajeActual: `${cur.o} a ${cur.d}`, horaActual: cur.h, viajeProximo: `${nxt.o} a ${nxt.d}`, horaProximo: nxt.h, vacioFrom: curDest, vacioTo: nxtOrig });
          }
        }
      }
    });

    var nowMin = new Date().getHours()*60 + new Date().getMinutes();
    var upcoming = results.filter(r => hhmmToMins(r.horaProximo) > nowMin).sort((a,b) => hhmmToMins(a.horaProximo) - hhmmToMins(b.horaProximo));
    
    var upcomingHtml = upcoming.length ? upcoming.map(r => `<div class="avail-row"><div class="avail-top"><span class="avail-name" style="color:var(--pend)">🚎 Vacío: ${r.vacioFrom} ➔ ${r.vacioTo}</span><span class="avail-unit">${r.unidad ? 'U-'+r.unidad : 'S/U'}</span></div><div class="avail-detail" style="font-size:13px;"><b>Operador:</b> ${r.nombre}</div><div class="avail-detail" style="margin-top:6px;font-size:13px;"><b>Viaje Actual:</b> ${formatRouteName(r.viajeActual.split(' a ')[0], r.viajeActual.split(' a ')[1])} (${r.horaActual})</div><div class="avail-next" style="color:var(--bad);font-size:13px;margin-top:3px;"><b>Próximo Viaje:</b> ${formatRouteName(r.viajeProximo.split(' a ')[0], r.viajeProximo.split(' a ')[1])} (${r.horaProximo})</div></div>`).join("") : '<div class="empty"><div class="big" style="padding: 20px; text-align: center; color: gray;">No hay vacíos pendientes para CU2</div></div>';
    openSheet(`<h2>🚎 Traslados en Vacío (Solo CU2)</h2><div class="desc" style="font-size:13px; color:gray; margin-bottom:10px;">Vueltas donde el operador termina y debe trasladarse hacia o desde CU2.</div><div style="max-height:60vh;overflow-y:auto;">${upcomingHtml}</div><button type="button" class="btn-outline" onclick="closeSheet()">Cerrar</button>`);
};

function obtenerHistorialFiltrado() {
    const hist = getGlobalHistory();
    return [...hist].reverse().filter(c => {
        if (historyFilterDay !== "ALL" && (c.day || "Hoy") !== historyFilterDay) return false;
        if (historySearchTerm) {
            let texto = `${c.day||''} ${c.route||''} ${c.tripTime||''} ${c.clave||''} ${c.oldUnit||''} ${c.newUnit||''} ${c.oldOp||''} ${c.newOp||''} ${c.reason||''}`.toLowerCase();
            if (!texto.includes(historySearchTerm)) return false;
        }
        return true;
    });
}

async function handleExcel(file, type, inputEl) {
    if(!file) return;
    let msgBox = document.getElementById("uploadMsg");
    if(msgBox) msgBox.innerHTML = `<span style="color:var(--pend)">Cargando lector y procesando ${file.name}...</span>`;
    try {
        await ensureXLSXLoaded();
    } catch (err) {
        if(msgBox) msgBox.innerHTML = `<span style="color:var(--bad)">${err.message}</span>`;
        inputEl.value = "";
        return;
    }

    let reader = new FileReader();
    reader.onload = e => {
      try {
        const backupHistory = [...getGlobalHistory()];
        let wb = XLSX.read(e.target.result, {type: 'array'});

        if(type === 'seguimiento') {
            store.operadoresDB = {}; 
            store.globalFleet = [];
            store.unassignedReasons = {};
            
            if(store.state) {
                Object.keys(store.state).forEach(day => {
                    store.state[day].unitOverride = {};
                    store.state[day].opOverride = {};
                    store.state[day].tripUnitOverride = {};
                    store.state[day].tripOpOverride = {};
                });
            }

            let opSheetName = wb.SheetNames.find(n => n.toUpperCase().includes("OP") || n.toUpperCase().includes("DATOS")) || wb.SheetNames[0];
            if(opSheetName) {
                let rawData = XLSX.utils.sheet_to_json(wb.Sheets[opSheetName], {header:1, defval: null});
                let hRow = -1;
                for(let r=0; r<rawData.length; r++) {
                    if((rawData[r]||[]).some(c => String(c).toUpperCase().includes("NOMBRE OPERADOR") || String(c).toUpperCase().includes("NOMBRE") || String(c).toUpperCase().includes("OPERADOR"))) { hRow = r; break; }
                }

                if(hRow !== -1) {
                    let headers = rawData[hRow].map(h => String(h||"").trim());
                    let colNombre = headers.findIndex(h => h.toUpperCase().includes("NOMBRE OPERADOR") || h.toUpperCase() === "NOMBRE" || h.toUpperCase().includes("OPERADOR"));
                    let colClave = headers.findIndex(h => h.toUpperCase().includes("CLAVE") || h.toUpperCase() === "ID");
                    let colUnidad = headers.findIndex(h => h.toUpperCase().includes("UNIDAD") || h.toUpperCase() === "ECON");
                    
                    if(colNombre !== -1) {
                        for(let i=hRow+1; i<rawData.length; i++) {
                            let row = rawData[i];
                            let opName = row[colNombre];
                            if(!opName || String(opName).trim() === "") continue;
                            
                            let opClave = colClave !== -1 ? row[colClave] : null;
                            let opUnit = colUnidad !== -1 ? row[colUnidad] : null;
                            
                            opName = String(opName).trim();
                            if(opClave) {
                                opClave = String(opClave).trim();
                                store.operadoresDB[opClave] = opName;
                            } else {
                                store.operadoresDB[opName] = opName; 
                            }
                            
                            if(opUnit || opName) store.globalFleet.push({ u: opUnit, k: opClave || opName, n: opName, estatus: "Activa", rutaFija: "", motivo: null });
                        }
                    }
                }
            }
            let fleetSheetName = wb.SheetNames.find(n => n.toUpperCase().includes("PARQUE") || n.toUpperCase().includes("FLOTA") || n.toUpperCase().includes("UNIDAD"));
            if(fleetSheetName) {
                let fData = XLSX.utils.sheet_to_json(wb.Sheets[fleetSheetName], {header:1});
                let hRow = fData.findIndex(row => (row||[]).some(c => String(c).toUpperCase().includes("UNIDAD") || String(c).toUpperCase().includes("ECON")));
                if(hRow !== -1) {
                    let headers = fData[hRow].map(h => String(h||"").toUpperCase());
                    let colUnidad = headers.findIndex(h => h.includes("UNIDAD") || h.includes("ECON") || h.includes("NUM"));
                    let colMotivo = headers.findIndex(h => h.includes("MOTIVO") || h.includes("ESTADO") || h.includes("OBSERV"));
                    if(colUnidad !== -1 && colMotivo !== -1) {
                        for(let i=hRow+1; i<fData.length; i++) {
                            if(fData[i][colUnidad]) {
                                let unit = String(fData[i][colUnidad]).trim();
                                let mot = fData[i][colMotivo];
                                store.unassignedReasons[unit] = (mot !== undefined && mot !== null) ? mot : "Taller / Detenida";
                            }
                        }
                    }
                }
            }
            store.globalHistory = backupHistory;
            if(msgBox) msgBox.innerHTML = `<span style="color:var(--done)">¡Archivo "datos" guardado en la nube! Historial Histórico conservado.</span>`;
            saveStore();
            render();
        } else {
            let result = parseWorkbook(e.target.result);
            if (!result.days.length) throw new Error("No se encontraron horarios en el archivo.");
            
            store.days = {};
            result.days.forEach(function(d){ 
                store.days[d.key] = { label: d.key, trips: d.trips, fleet: [] }; 
                let oldUnitChanges = (store.state && store.state[d.key] && store.state[d.key].unitChanges) ? store.state[d.key].unitChanges : [];
                store.state[d.key] = { trips: {}, unitOverride: {}, tripUnitOverride: {}, unitChanges: oldUnitChanges, opOverride: {}, tripOpOverride: {}, resolvedOverlaps: [], resolvedMissing: [] }; 
            });
            store.currentDay = result.days[0].key;
            store.globalHistory = backupHistory;
            saveStore();
            render();
            if(msgBox) msgBox.innerHTML = `<span style="color:var(--done)">¡Archivo "rol" cargado con éxito! Historial Histórico conservado.</span>`;
        }
        setTimeout(closeSheet, 1200);
      } catch (err) {
          if(msgBox) msgBox.innerHTML = `<span style="color:var(--bad)">Error: ${err.message}</span>`;
      }
      inputEl.value = ""; 
    };
    reader.readAsArrayBuffer(file);
}

function parseWorkbook(arrayBuffer){
    var wb = XLSX.read(new Uint8Array(arrayBuffer), {type:'array'});
    var grids = {}, hrCounts = {}, opSheetName = null;
    wb.SheetNames.forEach(function(name){
        var grid = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
        grids[name] = grid;
        var cnt = 0;
        grid.forEach(function(row){ (row||[]).forEach(function(v){ if (v === 'HR') cnt++; }); });
        hrCounts[name] = cnt;
        if (!opSheetName && /operador/i.test(name)) opSheetName = name;
    });
    
    var claveToName = {}, unidadToName = {};
    if (opSheetName && Object.keys(store.operadoresDB || {}).length === 0){
      var opGrid = grids[opSheetName];
      for (var i=1;i<opGrid.length;i++){
        var row = opGrid[i] || [];
        var unidad = row[0], clave = row[1], nombre = row[2];
        var nm = nombre ? String(nombre).replace(/\s+/g,' ').trim() : null;
        var unidadNum = (unidad != null && !isNaN(Number(unidad))) ? Math.round(Number(unidad)) : null;
        var claveNum = (clave != null && !isNaN(Number(clave))) ? Math.round(Number(clave)) : null;
        let finalName = nm || (store.operadoresDB && store.operadoresDB[claveNum] ? store.operadoresDB[claveNum] : null);
        if (claveNum != null) claveToName[claveNum] = finalName;
        if (unidadNum != null) unidadToName[unidadNum] = finalName; 
      }
    }

    var days = [];
    wb.SheetNames.forEach(function(name){
      if (hrCounts[name] < 3) return;
      var grid = grids[name];
      var hrCells = [];
      for (var r=0;r<grid.length;r++) for (var c=0;c<(grid[r]||[]).length;c++) if (grid[r][c] === 'HR') hrCells.push([r,c]);
      var records = [];
      hrCells.forEach(function(hc){
        var r = hc[0], c = hc[1];
        function getVal(ro,co) {
            for(let i=ro-1; i>=Math.max(ro-8,0); i--) {
                for(let j=co-3; j<co+7; j++) {
                    if(grid[i] && typeof grid[i][j] === 'string' && grid[i][j].includes('/')) return grid[i][j];
                }
            }
            return null;
        }
        var label = getVal(r, c);
        var od = label ? label.split('/') : ['Bloque '+c, ''];
        var rr = r+1;
        while (rr < grid.length){
          var hrVal = grid[rr] ? grid[rr][c] : null, busVal = grid[rr] ? grid[rr][c+1] : null, claveVal = grid[rr] ? grid[rr][c+2] : null;
          if (hrVal == null && busVal == null) break;
          
          var hStr = null;
          if (typeof hrVal === 'number' && hrVal >= 0){
            var min = Math.round((hrVal - Math.floor(hrVal))*24*60); 
            hStr = String(Math.floor(min/60)).padStart(2,'0') + ':' + String(min%60).padStart(2,'0'); 
          } else if (typeof hrVal === 'string' && hrVal.trim().includes(':')) {
            var parts = hrVal.trim().split(':');
            if (parts.length >= 2 && !isNaN(parseInt(parts[0])) && !isNaN(parseInt(parts[1]))) {
                hStr = String(parseInt(parts[0])).padStart(2,'0') + ':' + String(parseInt(parts[1])).padStart(2,'0');
            }
          }

          if (hStr != null){
            var busNum = (typeof busVal === 'number') ? Math.round(busVal) : (busVal ? String(busVal).trim() : null); 
            var claveNum2 = (typeof claveVal === 'number') ? Math.round(claveVal) : (claveVal ? String(claveVal).trim() : null);
            
            var nameOp = null; 
            if (claveNum2 != null && store.operadoresDB && store.operadoresDB[claveNum2]) nameOp = store.operadoresDB[claveNum2]; 
            else if (claveNum2 != null && claveToName[claveNum2] !== undefined) nameOp = claveToName[claveNum2]; 
            else if (busNum != null && unidadToName[busNum] !== undefined) nameOp = unidadToName[busNum];
            
            if (!nameOp && claveNum2 != null) {
                let possibleName = String(claveNum2).trim();
                let foundKey = Object.keys(store.operadoresDB || {}).find(k => store.operadoresDB[k] === possibleName);
                if (foundKey) nameOp = possibleName;
                else nameOp = possibleName; 
            }

            records.push({
                id: 'u'+r+'_'+c+'_'+rr,
                o: (od[0]||'').trim() || "Desconocido",
                d: (od[1]||'').trim() || "Desconocido",
                h: hStr || "00:00",
                u: busNum != null ? busNum : null,
                k: claveNum2 != null ? claveNum2 : null,
                n: nameOp || null
            });
          }
          rr++;
        }
      });
      if (records.length) {
          records.sort((a,b)=>a.h.localeCompare(b.h));
          days.push({ key: name, trips: records });
      }
    });
    return { days: days, fleet: [] }; 
}
