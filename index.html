// =========================================================================
// 6. AVISOS ROJOS PERSISTENTES DE CAMBIOS (SE QUITAN A MANO, UNO POR UNO)
//    - Cada cambio de ruta / horario / operador / unidad aparece como tarjeta roja.
//    - No desaparece sola: hay que tocar "Entendido" en cada una.
//    - Cada celular/computadora lleva su propia lista de avisos leídos.
//    - Los cambios que haces tú en ESTE equipo ya se consideran leídos.
// =========================================================================
const ALERTAS_HORAS_VIGENCIA = 12;   // Solo se muestran cambios de las últimas 12 horas
const ALERTAS_MAX_VISIBLES = 30;     // Máximo de tarjetas mostradas a la vez
const ALERTAS_STORAGE_KEY = "stu_alertas_vistas_v1";

let alertasVistasSet = null;

function cargarAlertasVistas() {
    if (alertasVistasSet) return alertasVistasSet;
    let arr = [];
    try {
        const raw = JSON.parse(localStorage.getItem(ALERTAS_STORAGE_KEY) || "[]");
        if (Array.isArray(raw)) arr = raw;
    } catch (e) {
        arr = [];
    }
    alertasVistasSet = new Set(arr);
    return alertasVistasSet;
}

function guardarAlertasVistas() {
    try {
        const arr = Array.from(cargarAlertasVistas()).slice(-500);
        localStorage.setItem(ALERTAS_STORAGE_KEY, JSON.stringify(arr));
    } catch (e) {}
}

function marcarAlertaVista(id) {
    if (!id) return;
    cargarAlertasVistas().add(String(id));
    guardarAlertasVistas();
}

function escHtml(v) {
    return String(v === null || v === undefined ? "" : v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function nombreOperadorAviso(v) {
    const s = String(v || "").trim();
    if (!s || s === "VACIO" || s === "—") return "Sin asignar";
    return s;
}

function nombreUnidadAviso(v) {
    const s = String(v || "").trim();
    if (!s || s === "VACIO" || s === "S/U" || s === "—") return "S/U";
    return /^U-/i.test(s) ? s : "U-" + s;
}

function horaDelAviso(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function obtenerAlertasPendientes() {
    const hist = Array.isArray(store.globalHistory) ? store.globalHistory : [];
    const vistas = cargarAlertasVistas();
    const limite = Date.now() - ALERTAS_HORAS_VIGENCIA * 3600 * 1000;
    const out = [];
    (hist || []).forEach(h => {
        if (!h || !h.id) return;
        if (vistas.has(String(h.id))) return;
        const ts = Number(h.changeAt) || Date.parse(h.time) || 0;
        if (!ts || ts < limite) return;
        out.push({ h: h, ts: ts });
    });
    out.sort((a, b) => b.ts - a.ts);
    return out;
}


// =========================================================================
// 6A. CAMPANA: CAMBIOS · AVISOS · PENDIENTES
//     - Cambios: lo que cambiaron los demás (ruta en azul, "Se cambió" en rojo claro, "Cubre" en verde claro).
//     - Avisos: estados del personal (falta, incapacidad, préstamo…) y unidades en taller.
//     - Pendientes: empalmes y corridas sin operador o unidad (se quitan al resolverlas).
//     - Cambios y Avisos se quitan uno por uno con "Enterado" (cada teléfono lleva su lista).
//     - En la computadora la campana está fija a la derecha.
// =========================================================================
var campanaTab = 0;
const CAMPANA_PESTANAS = [
    // 4.0: dos pestañas. Cambios = lo que hicieron otros + estados del personal. Por resolver = lo que hay que arreglar.
    { id: "cambios", nombre: "Cambios", color: "#0B3558", ico: '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>' },
    { id: "resolver", nombre: "Por resolver", color: "#B45309", ico: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>' },
    { id: "folios", nombre: "Folios", color: "#A3122A", ico: '<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 13h6M9 17h4"/>' },
    // 4.4: vueltas extra
    { id: "extras", nombre: "Extras", color: "#0E7C86", ico: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>' }
];

function esCambioDeEstado(h) {
    return !!h && (h.type === "Estado" || h.route === "Estado de operador");
}

// 4.0: la campana solo muestra lo del día elegido arriba (los registros sin día se ven siempre)
function esDelDiaElegido(h) {
    const d = h && h.day;
    if (!d || d === "Hoy") return true;
    return fbKey(d) === fbKey(store.currentDay || "");
}

function campanaCambios() {
    // 4.4: las vueltas extra tienen su propia pestaña
    return obtenerAlertasPendientes().filter(p => !esCambioDeEstado(p.h) && esDelDiaElegido(p.h) && p.h.type !== "Extra");
}

// Avisos: estados de operadores registrados (historial) + unidades que están en taller hoy
function campanaAvisos() {
    const vistas = cargarAlertasVistas();
    const out = [];
    obtenerAlertasPendientes()
        .filter(p => esCambioDeEstado(p.h) && esDelDiaElegido(p.h))
        .forEach(p => {
            const h = p.h;
            out.push({ id: String(h.id), ts: p.ts, tipo: "estado", nombre: String(h.oldOp || "").trim(), estado: h.reason || "", detalle: h.scope || "" });
        });
    // 4.0: las unidades en taller ya no salen aquí; si tienen corrida ese día van a "Por resolver"
    if (window.STU_TALLER_EN_CAMPANA) FLOTA_FIJA.forEach(f => {
        const u = String(f.u);
        if (!isUnidadEnTallerOInhabil(u)) return;
        const motivo = getMotivoUnidad(u) || "Taller";
        const id = `taller|${store.currentDay}|${u}|${motivo}`;
        if (vistas.has(id)) return;
        out.push({ id: id, ts: 0, tipo: "taller", unidad: u, estado: motivo, detalle: stuDiasTaller(u) || "" });
    });
    out.sort((a, b) => b.ts - a.ts);
    return out;
}

function campanaConteos() {
    return [campanaCambios().length + campanaAvisos().length, (globalAlertsData || []).length, typeof stuFoliosSinVer === "function" ? stuFoliosSinVer().length : 0, typeof vxSinVer === "function" ? vxSinVer().length : 0];
}

function actualizarContadorCampana() {
    const n = campanaConteos();
    const total = n[0] + n[1] + (n[2] || 0) + (n[3] || 0);
    const badge = document.getElementById("badgeAlerts");
    if (badge) {
        badge.innerText = total > 99 ? "99+" : total;
        badge.classList.toggle("has-items", total > 0);
    }
    return n;
}

// Abre la campana en la pestaña indicada (0 cambios, 1 avisos, 2 pendientes)
function abrirCampana(tab) {
    // 0 = Cambios; cualquier otro número (antes Avisos/Pendientes) = Por resolver
    campanaTab = tab === "extras" ? 3 : tab === "folios" ? 2 : Number(tab) ? 1 : 0;
    closeSheet();
    if (document.body.classList.contains("pc-view")) {
        refrescarCampanas(true);
        const panel = document.getElementById("panelCampana");
        if (panel) {
            panel.classList.remove("resalta");
            void panel.offsetWidth;
            panel.classList.add("resalta");
        }
        return;
    }
    if (activeView === "avisos") {
        campanaElegirTab(campanaTab);
        return;
    }
    cambiarVista("avisos");
}

// Cambia de pestaña sin redibujar la barra: así la curva y el círculo se deslizan
function campanaElegirTab(i) {
    i = Math.max(0, Math.min(CAMPANA_PESTANAS.length - 1, Number(i) || 0));
    campanaTab = i;
    const n = campanaConteos();
    document.querySelectorAll(".camp").forEach(c => {
        c.style.setProperty("--i", i);
        c.style.setProperty("--camp-color", CAMPANA_PESTANAS[i].color);
        const lista = c.querySelector(".camp-lista");
        if (lista) lista.innerHTML = campanaHtmlLista(i);
        const circ = c.querySelector(".camp-circulo");
        if (circ) circ.innerHTML = campanaHtmlCirculo(i, n);
        const cab = c.querySelector(".camp-cab b");
        if (cab) cab.textContent = CAMPANA_PESTANAS[i].nombre;
        const dia = c.querySelector(".camp-dia");
        if (dia) dia.textContent = i === 2 ? "Sin ver y los de hoy" : campanaDiaTexto();
        c.querySelectorAll(".camp-btn").forEach((b, k) => {
            b.classList.toggle("on", k === i);
            b.setAttribute("aria-pressed", k === i ? "true" : "false");
        });
    });
}

function campanaHtmlCirculo(i, n) {
    const p = CAMPANA_PESTANAS[i];
    return `<svg class="sube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p.ico}</svg><span class="camp-num">${n[i]}</span>`;
}

function campanaEnterado(id) {
    marcarAlertaVista(id);
    document.querySelectorAll("[data-camp-id]").forEach(t => {
        if (t.getAttribute("data-camp-id") === String(id)) t.classList.add("se-va");
    });
    setTimeout(() => {
        actualizarAvisosRojos();
        refrescarCampanas(true);
    }, 230);
}

// 4.2: lista de viajes (hora y ruta) que abarca un cambio
function campanaListaViajes(h) {
    if (Array.isArray(h.viajes) && h.viajes.length) {
        return h.viajes.map(v => { const i = String(v).indexOf("|"); return { h: String(v).slice(0, i), r: String(v).slice(i + 1) }; });
    }
    const dia = store.days && store.days[fbKey(h.day || store.currentDay || "")];
    const trips = dia && Array.isArray(dia.trips) ? dia.trips : [];
    const nuevaU = String(h.newUnit || "").replace(/^U-/, "");
    const ds = store.state && store.state[fbKey(h.day || store.currentDay || "")];
    const base = tabBaseline();
    const asgDe = t => { try { return resolveTripAssignment(t, ds || getDayState(), base); } catch (e) { return { unit: t.u, op: t.n }; } };
    const m = String(h.scope || "").match(/\(\d+ viaje\(s\): ([^)]+)\)/);
    if (m) {
        // Registros anteriores: se buscan las rutas por hora en el rol de ese día
        const usados = new Set();
        return m[1].split(",").map(x => x.trim()).filter(Boolean).map(hora => {
            const cand = trips.filter(t => t.h === hora && !usados.has(t.id));
            const t = cand.find(t => asgDe(t).unit === nuevaU || asgDe(t).op === h.newOp) || cand[0];
            if (t) usados.add(t.id);
            return { h: hora, r: t ? formatRouteName(t.o, t.d) : "" };
        });
    }
    if (/Impacta a todas/.test(h.scope || "") && nuevaU && nuevaU !== "S/U") {
        // Cambio en Flota: todos los viajes de esa unidad en el día
        return trips.filter(t => asgDe(t).unit === nuevaU).sort((a, b) => a.h.localeCompare(b.h)).map(t => ({ h: t.h, r: formatRouteName(t.o, t.d) }));
    }
    return [];
}

function campanaTarjetaCambio(p) {
    const h = p.h;
    const hora = h.tripTime && h.tripTime !== "—" && h.tripTime !== "N/A" ? h.tripTime : "";
    const viajes = campanaListaViajes(h);
    const varios = viajes.length > 1;
    const ruta = varios
        ? `${viajes.length} viajes`
        : (viajes.length === 1 && viajes[0].r ? viajes[0].r : String(h.route || "Cambio").replace(/\s*(➜|→)\s*/g, " - "));
    const listaHtml = varios
        ? `<ul class="camp-viajes">${viajes.map(v => `<li><span class="mono">${escHtml(v.h)}</span>${escHtml(v.r || "Ruta no encontrada en el rol")}</li>`).join("")}</ul>`
        : "";
    const opAntes = nombreBonito(nombreOperadorAviso(h.oldOp));
    const opNuevo = nombreBonito(nombreOperadorAviso(h.newOp || h.nombre));
    const uAntes = nombreUnidadAviso(h.oldUnit);
    const uNueva = nombreUnidadAviso(h.newUnit);
    const alcance = h.scope && !/^Horario individual$/.test(h.scope) && !varios ? " · " + escHtml(h.scope) : "";
    return `<div class="camp-cambio" data-camp-id="${escHtml(h.id)}">
        <div class="camp-ruta">${hora ? `<span class="camp-hora mono">${escHtml(hora)}</span>` : ""}<b>${escHtml(ruta)}</b></div>
        <div class="camp-bloques">
          <div class="camp-bloque sale"><small>Se cambió</small><b>${escHtml(opAntes)}</b><span>${escHtml(uAntes)}</span></div>
          <div class="camp-bloque cubre"><small>Cubre</small><b>${escHtml(opNuevo)}</b><span>${escHtml(uNueva)}</span></div>
        </div>
        ${listaHtml}
        <div class="camp-pie">
          <span class="camp-motivo">${escHtml(h.reason || "Cambio operativo")}</span>
          <span class="camp-cuando">${escHtml(horaDelAviso(p.ts))}${h.por ? " · " + escHtml(h.por) : ""}${alcance}</span>
          <button type="button" class="camp-enterado" onclick="campanaEnterado(decodeURIComponent('${tabAttr(h.id)}'))">${ICO.check}Enterado</button>
        </div>
      </div>`;
}

function campanaTarjetaAviso(a) {
    const c = STU_ESTADOS_COLOR[a.estado] || null;
    const titulo = a.tipo === "taller" ? `Taller · U-${escHtml(a.unidad)}` : `${stuPillEstado(a.estado || "Estado")} ${escHtml(nombreBonito(a.nombre))}`;
    const detalle = a.tipo === "taller"
        ? `${escHtml(a.estado)}${a.detalle ? " · " + escHtml(a.detalle) : ""}`
        : escHtml(String(a.detalle || "").replace(/\s*(➜|→)\s*/g, " a "));
    const accion = a.tipo === "estado" && a.nombre ? ` role="button" tabindex="0" onclick="stuAbrirFichaOperador(decodeURIComponent('${tabAttr(a.nombre)}'))"` : "";
    return `<div class="camp-aviso" data-camp-id="${escHtml(a.id)}">
        <span class="camp-punto" style="background:${c ? c.fg : "#B45309"}"></span>
        <div class="camp-aviso-txt"${accion}><b>${titulo}</b><small>${detalle}${a.ts ? " · " + escHtml(horaDelAviso(a.ts)) : ""}</small></div>
        <button type="button" class="camp-enterado" onclick="campanaEnterado(decodeURIComponent('${tabAttr(a.id)}'))">${ICO.check}Enterado</button>
      </div>`;
}

function campanaHtmlLista(i) {
    if (i === 0) {
        // Cambios y estados del personal juntos, el más nuevo arriba
        const lista = campanaCambios().map(p => ({ ts: p.ts, html: () => campanaTarjetaCambio(p) }))
            .concat(campanaAvisos().map(a => ({ ts: a.ts, html: () => campanaTarjetaAviso(a) })))
            .sort((x, y) => y.ts - x.ts);
        if (!lista.length) return `<div class="camp-vacio">Sin cambios nuevos en este día. Todo lo anterior está en el Historial.</div>`;
        return lista.slice(0, ALERTAS_MAX_VISIBLES).map(x => x.html()).join("") +
            (lista.length > ALERTAS_MAX_VISIBLES ? `<div class="camp-vacio">Hay ${lista.length - ALERTAS_MAX_VISIBLES} más. Aparecerán al dar Enterado a estos.</div>` : "");
    }
    if (i === 2) return stuHtmlListaFolios();
    if (i === 3) return vxHtmlLista();
    const pend = globalAlertsData || [];
    if (!pend.length) return `<div class="camp-vacio">Todo en orden. No hay empalmes ni corridas sin asignar en este día.</div>`;
    return `<div class="camp-nota">Empalmes, corridas sin operador o unidad y diferencias con el seguimiento, en orden de hora. Se quitan al resolverlas.</div>${pend.join("")}`;
}

function campanaDiaTexto() {
    const d = store.days && store.days[store.currentDay];
    return d ? "Solo " + (d.label || store.currentDay) : "";
}

function renderCampana(destino) {
    if (!destino) return;
    const n = actualizarContadorCampana();
    const i = campanaTab;
    const botones = CAMPANA_PESTANAS.map((p, k) => `<button type="button" class="camp-btn ${k === i ? "on" : ""}" aria-pressed="${k === i}" onclick="campanaElegirTab(${k})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p.ico}</svg>
        <span>${p.nombre}</span><em>${n[k]}</em></button>`).join("");
    destino.innerHTML = `<div class="camp" style="--i:${i};--camp-color:${CAMPANA_PESTANAS[i].color};">
        <div class="camp-tabs">
          <div class="camp-curva" aria-hidden="true"><svg viewBox="0 0 9600 60" preserveAspectRatio="none"><path d="M0 0 H9600 V60 H4860 C4844 60 4840 58 4835 47 C4826 27 4814 21 4800 21 C4786 21 4774 27 4765 47 C4760 58 4756 60 4740 60 H0 Z"/></svg></div>
          <div class="camp-botones">${botones}</div>
          <div class="camp-circulo" aria-hidden="true">${campanaHtmlCirculo(i, n)}</div>
        </div>
        <div class="camp-cab"><b>${CAMPANA_PESTANAS[i].nombre}</b><span class="camp-dia">${escHtml(i === 2 ? "Sin ver y los de hoy" : campanaDiaTexto())}</span>
          <button type="button" class="camp-historial" onclick="verCambios()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Historial</button></div>
        <div class="camp-lista">${campanaHtmlLista(i)}</div>
      </div>`;
}

function renderPanelCampana() {
    const panel = document.getElementById("panelCampana");
    if (!panel) return;
    if (!document.body.classList.contains("pc-view")) {
        if (panel.innerHTML) panel.innerHTML = "";
        return;
    }
    renderCampana(panel);
}

// Vuelve a pintar las campanas abiertas (solo si algo cambió) sin perder la pestaña elegida
let campanaFirma = "";
function refrescarCampanas(forzar) {
    const n = actualizarContadorCampana();
    const firma = [n.join("|"), campanaTab, activeView, document.body.classList.contains("pc-view"),
        (globalAlertsData || []).join("").length, campanaCambios().map(p => p.h.id).join(","), campanaAvisos().map(a => a.id).join(","),
        typeof stuFoliosSinVer === "function" ? stuFoliosSinVer().map(f => f.id).join(",") : "",
        typeof vxSinVer === "function" ? stuExtrasVer + ":" + vxSinVer().map(x => x.id).join(",") : ""].join("#");
    if (!forzar && firma === campanaFirma) return;
    campanaFirma = firma;
    renderPanelCampana();
    if (activeView === "avisos") renderCampana(document.getElementById("list"));
}

// Tira discreta debajo de la cabecera: "N cambios sin ver" (toca para abrir la campana)
function actualizarAvisosRojos() {
    const n = actualizarContadorCampana();
    const tira = document.getElementById("tiraAvisos");
    if (tira) {
        const mostrar = n[0] > 0 && activeView !== "avisos" && !document.body.classList.contains("pc-view");
        tira.hidden = !mostrar;
        if (mostrar) tira.innerHTML = `<span class="tira-punto"></span><b>${n[0]} cambio${n[0] === 1 ? "" : "s"} sin ver</b><span class="tira-ver">Ver</span>`;
    }
    refrescarCampanas();
}

    { e: "Activa", bg: "#DDF2E3", fg: "#1F6B3A" },
    { e: "Taller", bg: "#FDF0DC", fg: "#8A4B08" },
    { e: "Siniestro", bg: "#FBE5E8", fg: "#A3122A" },
    { e: "Falla mecánica", bg: "#FDE7D6", fg: "#9A3412" },
    { e: "Sin diésel", bg: "#E6EEF9", fg: "#1F4E8C" }
];

function stuEstadoUnidadActual(u) {
    const ev = stuEventoUnidad(u);
    if (ev) return { estado: ev.estado, motivo: ev.motivo || "", desde: ev.desde, manual: true };
    if (!isUnidadEnTallerOInhabil(u)) return { estado: "Activa", motivo: "", desde: "", manual: false };
    const mot = getMotivoUnidad(u) || "Taller";
    const fijo = STU_ESTADOS_UNIDAD.find(x => x.e !== "Activa" && x.e.toLowerCase() === String(mot).toLowerCase());
    return { estado: fijo ? fijo.e : "Taller", motivo: fijo ? "" : mot, desde: "", manual: false };
}

function stuAgregarEventoUnidad(u, estado, motivo) {
    store.unidadEstados = store.unidadEstados || {};
    const k = fbKey(u);
    const lista = stuEventosUnidad(u).filter(ev => ev.desde !== fbKey(store.currentDay)); // uno por día
    lista.push({ desde: fbKey(store.currentDay), estado: estado, motivo: motivo || "", ts: Date.now(), por: stuQuienSoy() });
    store.unidadEstados[k] = { lista: lista };
}

        .filter(x => String(x.a.unit) === String(u))

    const filas = corridas.length
        ? corridas.map((x, k) => {
              const st = getTripState(x.t.id);

              const sig = k === sigIdx;

    let detalle = "";

    } else if (est.manual) {

    openSheet(`<div class="ficha">
        <div class="ficha-cab">

          <div class="ficha-quien">
            <h2>Unidad ${escHtml(u)}</h2>

          </div>

        <button type="button" class="btn-outline" onclick="closeSheet()">Cerrar</button>
