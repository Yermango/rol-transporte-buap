function stuGuardarParesRedondos(lista, mensaje) {
    store.lugaresRedondos = { editado: true, lista: lista };
    savePatch({ lugaresRedondos: store.lugaresRedondos });
    window.render();
    window.stuVerTiempos(mensaje);
}

function stuAgregarParRedondo() {
    const a = (document.getElementById("stuRedA") || {}).value || "";
    const b = (document.getElementById("stuRedB") || {}).value || "";
    if (!a || !b || a === b) {
        showAggressiveToast("Elige dos lugares distintos.");
        return;
    }
    if (stuParRedondoExtra(a, b)) {
        showAggressiveToast("Ese par ya está en la lista.");
        return;
    }
    const lista = stuParesRedondosExtra().map(p => p.join("|"));
    lista.push(a + "|" + b);
    stuGuardarParesRedondos(lista, `✅ ${tituloBonito(a)} y ${tituloBonito(b)} ya cuentan como vuelta redonda.`);
}

function stuQuitarParRedondo(i) {
    const lista = stuParesRedondosExtra().map(p => p.join("|"));
    lista.splice(i, 1);
    stuGuardarParesRedondos(lista, "✅ Par quitado de las vueltas redondas.");
}

function stuPreferenciaTiempo(pref) {
    store.tiemposPreferencia = pref === "smart" ? "smart" : "real";
    stuTiemposVer++;
    savePatch({ tiemposPreferencia: store.tiemposPreferencia });
    window.render();
    window.stuVerTiempos(`✅ Ahora se usa el tiempo ${pref === "smart" ? "de Smart" : "Real"} cuando la ruta lo tiene.`);
}

function stuGuardarTiemposManual() {
    const lista = window._stuTiemposLista || [];
    const manual = Object.assign({}, store.tiemposManual || {});
    let cambios = 0;
    lista.forEach((x, i) => {
        const el = document.getElementById("stuTmin_" + i);
        if (!el) return;
        const v = Number(el.value);
        const k = fbKey(x.k);
        if (el.value === "" || !v) {
            if (manual[k] !== undefined) {
                delete manual[k];
                cambios++;
            }
        } else if (v > 0 && v <= 300 && Number(manual[k]) !== v) {
            manual[k] = Math.round(v);
            cambios++;
        }
    });
    store.tiemposManual = manual;
    stuTiemposVer++;
    savePatch({ tiemposManual: manual });
    window.render();
    window.stuVerTiempos(cambios ? `✅ ${cambios} tiempo(s) guardado(s) para todos.` : "No hubo cambios.");
}

async function stuSubirSoloTiempos(input) {
    const archivo = input && input.files && input.files[0];
    if (!archivo) return;
    const msg = document.getElementById("stuTiemposMsg");
    if (msg) msg.textContent = "Leyendo archivo...";
    try {
        const X = (await ensureXLSXLoaded()) || window.XLSX;
        const wb = X.read(new Uint8Array(await archivo.arrayBuffer()), { type: "array" });
        const t = window.stuLeerTiemposRutas(wb, X);
        if (!stuAplicarTiempos(t)) {
            if (msg) {
                msg.style.color = "var(--bad)";
                msg.textContent = t.aviso || "No se pudieron leer los tiempos.";
            }
            return;
        }
        savePatch({ tiemposRutas: store.tiemposRutas, tiemposVel: store.tiemposVel });
        window.render();
        window.stuVerTiempos(`✅ Se leyeron ${t.n} rutas de la hoja ${escHtml(t.hoja)}.`);
    } catch (e) {
        if (msg) {
            msg.style.color = "var(--bad)";
            msg.textContent = "No pude leer el archivo: " + (e && e.message ? e.message : e);
        }
    }
    input.value = "";
}

// =========================================================================
// 6J. CAMBIOS "TIPO BUSUP": BUSCAR ➜ MARCAR VIAJES ➜ ELEGIR UNIDAD Y OPERADOR ➜ ASIGNAR
//     1) Buscas una unidad, un operador o una ruta.
//     2) Marcas con casillas los viajes que cambian (o "Seleccionar todos").
//     3) Eliges el vehículo y/o el conductor nuevos en listas con buscador.
//     4) Eliges el motivo y tocas "Asignar". Sale "Asignación exitosa".
//     Se abre al tocar un viaje, desde Pendientes/Tablero ("Cubrir") y con el botón 🔁 Cambio.
//     En computadora se ve como tabla ancha; en celular como lista con casillas grandes.
// =========================================================================
const ASG = { sel: new Set(), u: null, op: null, opManual: false, opAuto: false, motivo: "", motivoOtros: "", filtro: "", baseId: "", ref: 0, ocupacion: null };
const ASG_MOTIVOS = ["Falta", "Permiso", "Siniestro", "Falla mecánica", "Sin diésel", "Apoyo", "Operación", "Movimiento para cubrir", "Otros"];

// Cada cuántos minutos sale esa misma ruta: salida anterior y siguiente
function asgFrecuenciaRuta(base) {
    if (!base) return "";
    const misma = asgTrips()
        .filter(t => normLoc(t.o) === normLoc(base.o) && normLoc(t.d) === normLoc(base.d))
        .sort((a, b) => a.h.localeCompare(b.h));
    const i = misma.findIndex(t => String(t.id) === String(base.id));
    if (i === -1) return "";
    const ant = misma[i - 1];
    const sig = misma[i + 1];
    if (!ant && !sig) return `<div class="asg-frecuencia">${ICO_RELOJ}<span>Es la única salida de esta ruta hoy</span></div>`;
    const dif = (a, b) => hhmmToMins(b.h) - hhmmToMins(a.h);
    const partes = [];
    if (ant) partes.push(`anterior <b class="mono">${escHtml(ant.h)}</b> (${dif(ant, base)} min antes)`);
    if (sig) partes.push(`siguiente <b class="mono">${escHtml(sig.h)}</b> (${dif(base, sig)} min después)`);
    return `<div class="asg-frecuencia">${ICO_RELOJ}<span>Esta ruta: ${partes.join(" · ")}</span></div>`;
}
const ICO_RELOJ = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';



function asgTrips() {
    const dia = store.days && store.days[store.currentDay];
    return dia && Array.isArray(dia.trips) ? dia.trips : [];
}

function asgAsignacion(t) {
    return resolveTripAssignment(t, getDayState(), tabBaseline());
}

function asgAhora() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
}

// ----- Abrir la pantalla -----
function stuAbrirAsignador(opciones) {
    const o = opciones || {};
    const trips = asgTrips();
    ASG.sel = new Set();
    ASG.u = null;
    ASG.op = null;
    ASG.opManual = false;
    ASG.opAuto = false;
    ASG.motivo = "";
    ASG.motivoOtros = "";
    ASG.baseId = o.tripId || "";
    const base = ASG.baseId ? trips.find(t => String(t.id) === String(ASG.baseId)) : null;
    ASG.ref = base ? hhmmToMins(base.h) : asgAhora();
    try {
        ASG.ocupacion = calcularEstadoFlotaYVentanas(ASG.ref);
    } catch (e) {
        ASG.ocupacion = { opWindows: [], unitToOp: {} };
    }

    if (base) {
        const a = asgAsignacion(base);
        ASG.filtro = a.op || a.unit || "";
        ASG.sel.add(String(base.id)); // solo el viaje tocado; con un toque se agregan sus siguientes
    } else {
        ASG.filtro = o.filtro || "";
    }

    const motivos = ASG_MOTIVOS.map(m => `<button type="button" class="reason-chip" data-mot="${escHtml(m)}" onclick="stuAsgMotivo(this)">${escHtml(m)}</button>`).join("");
    const titulo = base ? `${escHtml(base.h)} · ${escHtml(formatRouteName(base.o, base.d))}` : "Busca una unidad, un operador o una ruta";

    openSheet(`<h2 style="margin-bottom:4px;">Hacer un cambio</h2>
      <div style="font-size:13px;color:var(--ink-soft);">${titulo}</div>
      ${asgFrecuenciaRuta(base)}

      <div class="asg-paso"><span class="num">1</span> Busca unidad, operador o ruta</div>
      <input id="asgBuscar" class="asg-buscar" type="text" inputmode="search" autocomplete="off" placeholder="Ej. 8095, Erick, CU a CU2" value="${escHtml(ASG.filtro)}" oninput="stuAsgFiltrar(this.value)">

      <div class="asg-paso"><span class="num">2</span> Marca los viajes que cambian <span id="asgCuenta" style="margin-left:auto;color:var(--ink-soft);font-weight:700;"></span></div>
      <div id="asgLista"></div>

      <div class="asg-paso"><span class="num">3</span> Elige la unidad y/o el operador nuevos</div>
      <div class="asg-sel-grid">
        <div>
          <span class="asg-label">Vehículo</span>
          <button type="button" class="asg-combo" id="asgComboU" onclick="stuAsgAbrirLista('U')"></button>
          <div class="asg-panel" id="asgPanelU" style="display:none;">
            <input id="asgBuscarU" type="text" inputmode="search" autocomplete="off" placeholder="Escribe el número, ej. 809" oninput="stuAsgListaU()">
            <div class="asg-opciones" id="asgOpcionesU"></div>
          </div>
        </div>
        <div>
          <span class="asg-label">Conductor</span>
          <button type="button" class="asg-combo" id="asgComboOp" onclick="stuAsgAbrirLista('Op')"></button>
          <div class="asg-panel" id="asgPanelOp" style="display:none;">
            <input id="asgBuscarOp" type="text" autocomplete="off" placeholder="Escribe el nombre o la clave" oninput="stuAsgListaOp()">
            <div class="asg-opciones" id="asgOpcionesOp"></div>
          </div>
        </div>
      </div>
      <div id="asgTitular" class="asg-titular"></div>

      <div class="asg-paso"><span class="num">4</span> Motivo</div>
      <div class="reason-grid" style="margin-top:0;">${motivos}</div>
      <label class="asg-otros" id="asgOtrosCaja" hidden><span>Escribe el motivo</span>
        <textarea id="asgOtros" rows="2" maxlength="160" placeholder="Ej. la unidad se queda en CU por revisión de llanta" oninput="ASG.motivoOtros = this.value"></textarea></label>

      <div id="asgAviso"></div>
      <button type="button" class="btn-primary" id="asgBtnAsignar" style="background:var(--done);" onclick="stuAsgAsignar(false)">Asignar</button>
      <button type="button" class="btn-outline" onclick="closeSheet()">Cancelar</button>
      <div id="asgSugerencias"></div>`);
    const sh = document.getElementById("sheet");
    if (sh) sh.classList.add("stu-ancho");
    stuAsgPintarTodo();
}

function stuAsgPintarTodo() {
    stuAsgLista();
    stuAsgCombos();
    stuAsgSugerencias();
    stuAsgRevisar();
}

function stuAsgFiltrar(v) {
    ASG.filtro = String(v || "");
    stuAsgLista();
}

function asgCoincide(t, a, q) {
    if (!q) return false;
    const qn = smartNorm(q);
    if (/^\d+$/.test(qn)) {
        return String(a.unit || "").indexOf(qn) === 0 || String(t.u || "").indexOf(qn) === 0 || String(t.k || "") === qn;
    }
    const texto = smartNorm(`${a.op} ${t.o} A ${t.d} ${t.h}`);
    return qn.split(" ").every(p => texto.indexOf(p) !== -1);
}

function stuAsgLista() {
    const cont = document.getElementById("asgLista");
    if (!cont) return;
    const trips = asgTrips();
    const q = ASG.filtro.trim();
    const ahora = asgAhora();
    const filas = [];
    trips.forEach(t => {
        const a = asgAsignacion(t);
        const sel = ASG.sel.has(String(t.id));
        if (sel || asgCoincide(t, a, q)) filas.push({ t: t, a: a, sel: sel });
    });
    filas.sort((x, y) => x.t.h.localeCompare(y.t.h));
    const visibles = filas.slice(0, 250);
    const todos = visibles.length > 0 && visibles.every(f => f.sel);

    let html;
    if (!visibles.length) {
        html = `<div class="tb-vacio">${q ? "No encontré viajes con esa búsqueda." : "Escribe arriba una unidad, un operador o una ruta para ver sus viajes."}</div>`;
    } else {
        html = `<div class="asg-tabla">
            <label class="asg-cab"><input type="checkbox" ${todos ? "checked" : ""} onchange="stuAsgTodos(this.checked)">
              <span>Hora</span><span>Ruta <span style="font-weight:600;">(${visibles.length})</span></span>
              <span class="col-extra">Unidad</span><span class="col-extra">Operador</span><span class="col-extra">Llega</span><span class="col-extra">Estado</span></label>
            <div class="asg-lista-scroll">` +
            visibles
                .map(f => {
                    const t = f.t;
                    const st = getTripState(t.id);
                    const estado = st.status === "formado" ? "✅ Formado" : st.status === "en_terminal" ? "👁️ En terminal" : "⏳ Por salir";
                    const llega = minsToHhmm(hhmmToMins(t.h) + getTripDuration(t));
                    const pasado = hhmmToMins(t.h) < ahora - 5;
                    return `<label class="asg-row ${f.sel ? "sel" : ""} ${pasado ? "pasado" : ""}">
                        <input type="checkbox" ${f.sel ? "checked" : ""} onchange="stuAsgMarcar(decodeURIComponent('${tabAttr(t.id)}'), this.checked)">
                        <span class="asg-h">${escHtml(t.h)}</span>
                        <span class="asg-info"><b>${escHtml(formatRouteName(t.o, t.d))}</b><small>${f.a.unit ? "U-" + escHtml(f.a.unit) : "S/U"} · ${escHtml(f.a.op ? nombreBonito(f.a.op) : f.a.pendiente ? "Pendiente" : "Sin operador")} · llega ${llega}</small></span>
                        <span class="col-extra asg-h">${f.a.unit ? "U-" + escHtml(f.a.unit) : "S/U"}</span>
                        <span class="col-extra">${escHtml(f.a.op ? nombreBonito(f.a.op) : f.a.pendiente ? "Pendiente" : "Sin operador")}</span>
                        <span class="col-extra asg-h">${llega}</span>
                        <span class="col-extra" style="font-size:12px;">${estado}</span>
                      </label>`;
                })
                .join("") +
            `</div></div>`;
    }
    // Atajo: marcar también los siguientes viajes del mismo operador
    const base = ASG.baseId ? trips.find(t => String(t.id) === String(ASG.baseId)) : null;
    if (base) {
        const ab = asgAsignacion(base);
        const quien = ab.op || ab.unit;
        const siguientes = trips.filter(t => {
            if (ASG.sel.has(String(t.id)) || hhmmToMins(t.h) <= hhmmToMins(base.h)) return false;
            const at = asgAsignacion(t);
            return ab.op ? at.op === ab.op : ab.unit && at.unit === ab.unit;
        });
        if (quien && siguientes.length) {
            html += `<button type="button" class="btn-outline" style="margin-top:8px;padding:10px;font-size:13.5px;" onclick="stuAsgSiguientes()">➕ Marcar también sus ${siguientes.length} viaje(s) siguientes (${escHtml(quien)})</button>`;
        }
    }
    cont.innerHTML = html;
    const cuenta = document.getElementById("asgCuenta");
    if (cuenta) cuenta.textContent = ASG.sel.size ? `${ASG.sel.size} marcado(s)` : "";
    stuAsgRevisar();
}

function stuAsgMarcar(id, valor) {
    if (valor) ASG.sel.add(String(id));
    else ASG.sel.delete(String(id));
    stuAsgLista();
}

function stuAsgSiguientes() {
    const trips = asgTrips();
    const base = trips.find(t => String(t.id) === String(ASG.baseId));
    if (!base) return;
    const ab = asgAsignacion(base);
    trips.forEach(t => {
        if (hhmmToMins(t.h) < hhmmToMins(base.h)) return;
        const at = asgAsignacion(t);
        if (ab.op ? at.op === ab.op : ab.unit && at.unit === ab.unit) ASG.sel.add(String(t.id));
    });
    stuAsgLista();
}

function stuAsgTodos(valor) {
    const trips = asgTrips();
    const q = ASG.filtro.trim();
    trips.forEach(t => {
        const a = asgAsignacion(t);
        if (ASG.sel.has(String(t.id)) || asgCoincide(t, a, q)) {
            if (valor) ASG.sel.add(String(t.id));
            else ASG.sel.delete(String(t.id));
        }
    });
    stuAsgLista();
}

// ----- Listas con buscador (Vehículo y Conductor) -----
function stuAsgCombos() {
    const cu = document.getElementById("asgComboU");
    const co = document.getElementById("asgComboOp");
    if (cu) {
        const txt = ASG.u === null ? "Sin cambio" : ASG.u === "VACIO" ? "Quitar unidad (S/U)" : "U-" + ASG.u;
        cu.className = "asg-combo" + (ASG.u !== null ? " elegido" : "");
        cu.innerHTML = `<span>${escHtml(txt)}</span><span>▾</span>`;
    }
    if (co) {
        const txt = ASG.op === null ? "Sin cambio" : ASG.op === "VACIO" ? "Quitar operador" : ASG.op === OP_PENDIENTE ? "Pendiente (aún no se sabe)" : nombreBonito(ASG.op);
        co.className = "asg-combo" + (ASG.op !== null ? " elegido" : "");
        co.innerHTML = `<span>${escHtml(txt)}</span><span>▾</span>`;
    }
}

function stuAsgAbrirLista(cual) {
    ["U", "Op"].forEach(c => {
        const p = document.getElementById("asgPanel" + c);
        if (p) p.style.display = c === cual && p.style.display === "none" ? "block" : "none";
    });
    const panel = document.getElementById("asgPanel" + cual);
    if (panel && panel.style.display === "block") {
        if (cual === "U") stuAsgListaU();
        else stuAsgListaOp();
        const inp = document.getElementById("asgBuscar" + cual);
        if (inp) {
            inp.value = "";
            setTimeout(() => inp.focus(), 30);
            if (cual === "U") stuAsgListaU();
            else stuAsgListaOp();
        }
    }
}

function stuAsgListaU() {
    const cont = document.getElementById("asgOpcionesU");
    if (!cont) return;
    const q = String((document.getElementById("asgBuscarU") || {}).value || "").replace(/\D/g, "");
    const enUso = (ASG.ocupacion && ASG.ocupacion.unitToOp) || {};
    let html = `<div class="asg-op" onclick="stuAsgElegir('U', null)"><b>Sin cambio</b></div>
                <div class="asg-op" onclick="stuAsgElegir('U', 'VACIO')"><span>Quitar unidad (S/U)</span></div>`;
    FLOTA_FIJA.filter(f => !q || String(f.u).indexOf(q) !== -1)
        .slice(0, 120)
        .forEach(f => {
            const u = String(f.u);
            const taller = isUnidadEnTallerOInhabil(u);
            const quien = enUso[u];
            const tags = (taller ? `<span class="asg-tag taller">🔧 Taller${stuDiasTaller(u) ? " · " + escHtml(stuDiasTaller(u)) : ""}</span>` : "") +
                (!taller && quien ? `<span class="asg-tag uso">La trae ${escHtml(quien)}</span>` : "") +
                (!taller && !quien ? `<span class="asg-tag libre">Libre</span>` : "");
            html += `<div class="asg-op" onclick="stuAsgElegir('U', '${u}')"><span><b class="mono">U-${u}</b> <small>${escHtml(f.p)}</small></span><span>${tags}</span></div>`;
        });
    cont.innerHTML = html;
}

function stuAsgListaOp() {
    const cont = document.getElementById("asgOpcionesOp");
    if (!cont) return;
    const q = smartNorm((document.getElementById("asgBuscarOp") || {}).value || "");
    const ventanas = {};
    ((ASG.ocupacion && ASG.ocupacion.opWindows) || []).forEach(w => (ventanas[w.nombre] = w));
    const claves = {};
    Object.keys(store.operadoresDB || {}).forEach(k => (claves[store.operadoresDB[k]] = k));
    const nombres = Array.from(new Set(Object.values(store.operadoresDB || {}).filter(Boolean)))
        .filter(n => isOperadorActivo(n))
        .filter(n => !q || smartNorm(n + " " + (claves[n] || "")).indexOf(q) !== -1 || q.split(" ").every(p => smartNorm(n).indexOf(p) !== -1));
    const peso = n => {
        const w = ventanas[n];
        if (!w) return 3;
        if (w.freeNow && (!w.trips || !w.trips.length)) return 0;
        if (w.freeNow) return 1;
        return 2;
    };
    nombres.sort((a, b) => peso(a) - peso(b) || a.localeCompare(b));
    let html = `<div class="asg-op" onclick="stuAsgElegir('Op', null)"><b>Sin cambio</b></div>
                <div class="asg-op asg-op-pendiente" onclick="stuAsgElegir('Op', OP_PENDIENTE)"><span><b>Pendiente</b> <small>todavía no se sabe quién cubre</small></span><span class="asg-tag taller">Sigue como hueco</span></div>
                <div class="asg-op" onclick="stuAsgElegir('Op', 'VACIO')"><span>Quitar operador</span></div>`;
    nombres.slice(0, 150).forEach(n => {
        const w = ventanas[n];
        let tag = "";
        if (w && w.freeNow && (!w.trips || !w.trips.length)) tag = `<span class="asg-tag guardia">Guardia</span>`;
        else if (w && w.freeNow) tag = `<span class="asg-tag libre">Libre hasta ${escHtml(w.winTo)}</span>`;
        else if (w) tag = `<span class="asg-tag uso">En ruta</span>`;
        html += `<div class="asg-op" onclick="stuAsgElegir('Op', decodeURIComponent('${tabAttr(n)}'))"><span><b>${escHtml(nombreBonito(n))}</b>${claves[n] ? ` <small>${escHtml(claves[n])}</small>` : ""}</span><span>${tag}</span></div>`;
    });
    if (!nombres.length) html += `<div class="asg-op"><small>No encontré operadores disponibles con ese nombre.</small></div>`;
    cont.innerHTML = html;
}

function stuAsgElegir(cual, valor) {
    if (cual === "U") {
        ASG.u = valor;
        // Autollenado: al elegir la unidad se pone su operador titular (hoja DATOS OP); se puede cambiar
        if (!ASG.opManual) {
            const titular = valor && valor !== "VACIO" ? tabBaseline()[String(valor)] || "" : "";
            if (titular) {
                ASG.op = titular;
                ASG.opAuto = true;
            } else if (ASG.opAuto) {
                ASG.op = null;
                ASG.opAuto = false;
            }
        }
    } else {
        ASG.op = valor;
        ASG.opManual = valor !== null;
        ASG.opAuto = false;
    }
    const p = document.getElementById("asgPanel" + cual);
    if (p) p.style.display = "none";
    stuAsgCombos();
    stuAsgPintarTitular();
    stuAsgRevisar();
}

function stuAsgPintarTitular() {
    const caja = document.getElementById("asgTitular");
    if (!caja) return;
    if (ASG.opAuto && ASG.op && ASG.u) {
        const estado = getReasonForEntity(ASG.op);
        caja.innerHTML = `Llenado solo: titular de la U-${escHtml(ASG.u)}${estado ? ` <b>(hoy: ${escHtml(estado)})</b>` : ""} · puedes cambiarlo en Conductor`;
    } else {
        caja.innerHTML = "";
    }
}

function stuAsgMotivo(btn) {
    document.querySelectorAll("#sheetContent .reason-chip").forEach(b => b.classList.remove("sel"));
    btn.classList.add("sel");
    ASG.motivo = btn.getAttribute("data-mot") || "";
    const caja = document.getElementById("asgOtrosCaja");
    if (caja) {
        caja.hidden = ASG.motivo !== "Otros";
        if (!caja.hidden) setTimeout(() => { const t = document.getElementById("asgOtros"); if (t) t.focus(); }, 30);
    }
    stuAsgRevisar();
}

// Motivo final: "Otros" lleva lo que escribiste
function asgMotivoTexto() {
    if (ASG.motivo === "Otros") {
        const txt = String(ASG.motivoOtros || "").trim();
        return txt ? "Otros: " + txt : "Otros";
    }
    return ASG.motivo || "Reasignación manual";
}

// ----- Sugerencias de quién puede cubrir (del viaje que tocaste) -----
function stuAsgSugerencias() {
    const cont = document.getElementById("asgSugerencias");
    if (!cont) return;
    const base = ASG.baseId ? asgTrips().find(t => String(t.id) === String(ASG.baseId)) : null;
    if (!base) {
        cont.innerHTML = "";
        return;
    }
    let cands = [];
    try {
        cands = recomendarCandidatosParaViaje(base).slice(0, 4);
    } catch (e) {}
    if (!cands.length) {
        cont.innerHTML = "";
        return;
    }
    cont.innerHTML = `<details class="asg-quien-llega"><summary>Quién llega a tiempo para las ${escHtml(base.h)} y quién no (toca para ver)</summary>` +
        cands
            .map(c => `<div class="asg-sug" onclick="stuAsgUsarSugerencia(decodeURIComponent('${tabAttr(c.op)}'), decodeURIComponent('${tabAttr(c.unit || "")}'))">
                <span><b>${escHtml(nombreBonito(c.op))}</b>${c.unit ? ` · <span class="mono">U-${escHtml(c.unit)}</span>` : ""}<br><small style="color:var(--ink-soft);">${escHtml(c.windowText)}</small></span>
                <span class="asg-tag libre">Elegir</span></div>`)
            .join("") +
        `</details>`;
}

function stuAsgUsarSugerencia(op, unidad) {
    ASG.op = op || null;
    ASG.opManual = !!op;
    ASG.opAuto = false;
    if (unidad) ASG.u = unidad;
    stuAsgPintarTitular();
    stuAsgCombos();
    stuAsgRevisar();
}

// ----- Revisión antes de asignar: choques, taller y unidad ocupada -----
function stuAsgProblemas() {
    const trips = asgTrips();
    const marcados = trips.filter(t => ASG.sel.has(String(t.id)));
    const avisos = [];
    if (ASG.u && ASG.u !== "VACIO" && isUnidadEnTallerOInhabil(ASG.u)) avisos.push({ s: "mal", t: `La U-${ASG.u} está en taller (${getMotivoUnidad(ASG.u) || "no disponible"}).` });
    const choca = (quien, esUnidad) => {
        const otros = trips.filter(t => {
            if (ASG.sel.has(String(t.id))) return false;
            const a = asgAsignacion(t);
            return esUnidad ? a.unit === quien : a.op === quien;
        });
        const horas = [];
        marcados.forEach(m => {
            const i1 = hhmmToMins(m.h);
            const f1 = i1 + getTripDuration(m);
            otros.forEach(o => {
                const i2 = hhmmToMins(o.h);
                const f2 = i2 + getTripDuration(o);
                if (Math.min(f1, f2) - Math.max(i1, i2) > 5) horas.push(`${m.h} con su viaje de ${o.h} (${formatRouteName(o.o, o.d)})`);
            });
        });
        return Array.from(new Set(horas));
    };
    if (ASG.op && ASG.op !== "VACIO" && ASG.op !== OP_PENDIENTE) {
        const h = choca(ASG.op, false);
        if (h.length) avisos.push({ s: "ojo", t: `${ASG.op} ya tiene viajes a esa hora: ${h.slice(0, 4).join("; ")}${h.length > 4 ? "…" : ""}` });
    }
    if (ASG.u && ASG.u !== "VACIO") {
        const h = choca(ASG.u, true);
        if (h.length) avisos.push({ s: "ojo", t: `La U-${ASG.u} ya va en otro viaje a esa hora: ${h.slice(0, 4).join("; ")}${h.length > 4 ? "…" : ""}` });
    }
    return avisos;
}

function stuAsgRevisar() {
    const btn = document.getElementById("asgBtnAsignar");
    const cont = document.getElementById("asgAviso");
    if (!btn || !cont) return;
    const n = ASG.sel.size;
    const hayCambio = ASG.u !== null || ASG.op !== null;
    let html = "";
    if (!n) html = `<div class="asg-aviso ojo">Marca al menos un viaje (paso 2).</div>`;
    else if (!hayCambio) html = `<div class="asg-aviso ojo">Elige una unidad o un operador nuevo (paso 3).</div>`;
    else {
        const probs = stuAsgProblemas();
        html = probs.map(p => `<div class="asg-aviso ${p.s}">${p.s === "mal" ? "⛔" : "⚠️"} ${escHtml(p.t)}</div>`).join("");
        if (!probs.length) html = `<div class="asg-aviso ok">✅ Sin choques: se puede asignar.</div>`;
    }
    cont.innerHTML = html;
    btn.disabled = !n || !hayCambio;
    btn.style.opacity = btn.disabled ? "0.5" : "1";
    const partes = [];
    if (ASG.u !== null) partes.push(ASG.u === "VACIO" ? "sin unidad" : "U-" + ASG.u);
    if (ASG.op !== null) partes.push(ASG.op === "VACIO" ? "sin operador" : ASG.op === OP_PENDIENTE ? "Pendiente" : nombreBonito(ASG.op));
    btn.textContent = n && hayCambio ? `Asignar ${partes.join(" · ")} a ${n} viaje(s)` : "Asignar";
}

// ----- Asignar -----
function stuAsgAsignar() {
    const trips = asgTrips().filter(t => ASG.sel.has(String(t.id))).sort((a, b) => a.h.localeCompare(b.h));
    if (!trips.length || (ASG.u === null && ASG.op === null)) return;
    const ds = getDayState();
    const dKey = fbKey(store.currentDay);
    const antes = trips.map(t => asgAsignacion(t));
    trips.forEach(t => {
        if (ASG.u !== null) ds.tripUnitOverride[t.id] = ASG.u;
        if (ASG.op !== null) ds.tripOpOverride[t.id] = ASG.op;
    });
    const unicos = arr => Array.from(new Set(arr.filter(Boolean)));
    const unidadesAntes = unicos(antes.map(a => a.unit));
    const opsAntes = unicos(antes.map(a => a.op));
    const horas = trips.map(t => t.h);
    const rutaTxt = trips.length === 1 ? formatRouteName(trips[0].o, trips[0].d) : `${trips.length} viajes: ${trips.slice(0, 3).map(t => t.h + " " + formatRouteName(t.o, t.d)).join(", ")}${trips.length > 3 ? "…" : ""}`;
    const motivoFinal = asgMotivoTexto();
    registrarEnHistorial({
        tripTime: horas.length > 1 ? `${horas[0]} a ${horas[horas.length - 1]}` : horas[0],
        clave: trips[0].k || "—",
        route: rutaTxt,
        scope: `Asignación por selección (${trips.length} viaje(s): ${horas.join(", ")})`,
        viajes: trips.map(t => t.h + "|" + formatRouteName(t.o, t.d)),
        tripId: trips.length === 1 ? trips[0].id : "",
        oldUnit: unidadesAntes.length > 1 ? unidadesAntes.join("/") : unidadesAntes[0] || "S/U",
        newUnit: ASG.u === null ? (unidadesAntes[0] || "S/U") : ASG.u === "VACIO" ? "S/U" : ASG.u,
        oldOp: opsAntes.length > 1 ? opsAntes.join(" / ") : opsAntes[0] || "Sin Asignar",

// Aviso de un cambio que llegó de otro equipo: un sonido, vibración, globo del sistema y la campana.
// En la computadora el globo se queda fijo (requireInteraction) hasta que lo cierres.
function avisarCambioRecibido(ult) {
    try {
        if (ult && ult.type === "Extra") return; // 4.4: la vuelta extra avisa con su propio sonido
        const isCritical = ESTADOS_CRITICOS.some(est =>
            String(ult.reason || "").toLowerCase().includes(est.toLowerCase())
        );
        playAlertSound(isCritical);
        if (navigator.vibrate) navigator.vibrate(isCritical ? [400, 200, 400, 200, 600] : [200, 100, 200]);

        const aviso = textoAvisoCorto(ult);
        mostrarGloboSistema(aviso.titulo, aviso.cuerpo, ult.id || String(Date.now()));
        if (isCritical && !document.hidden && typeof showAggressiveToast === "function") {
            showAggressiveToast(`Cambio urgente en ruta ${String(ult.route || "").replace(/\s*(➜|→)\s*/g, " - ")}.`);
        }
        actualizarAvisosRojos();
    } catch (e) {}
}

// 4.2: texto corto de la notificación. El título dice qué cambió; el cuerpo, una sola línea.
//  Estado:  "Juan Carlos Vargas Gonzales: Préstamo"  /  "Antes: Disponible"
//  Viaje:   "07:20 CU - Amalucan"  /  "Ahora: Marcos Meza Torres · U-8052"
function textoAvisoCorto(h) {
    const limpio = t => String(t || "").replace(/\s*(➜|→)\s*/g, " - ").trim();
    if (h.type === "Estado" || /^Estado de (operador|unidad)$/.test(h.route || "")) {
        const quien = /^U-/.test(String(h.oldOp || "")) ? h.oldOp : nombreBonito(nombreOperadorAviso(h.oldOp));
        const antes = (String(h.scope || "").match(/Antes:\s*([^·]+)/) || [])[1];
        return { titulo: `${quien}: ${h.reason || "Cambio de estado"}`, cuerpo: antes ? `Antes: ${antes.trim()}` : "" };
    }
    const viajes = campanaListaViajes(h);
    let titulo;
    if (viajes.length > 1) titulo = `${viajes.length} viajes · ${viajes[0].h} a ${viajes[viajes.length - 1].h}`;
    else if (viajes.length === 1) titulo = `${viajes[0].h} ${viajes[0].r}`.trim();
    else titulo = `${h.tripTime && h.tripTime !== "—" ? h.tripTime + " " : ""}${limpio(h.route)}`.trim();
    const op = nombreBonito(nombreOperadorAviso(h.newOp || h.nombre));
    const u = nombreUnidadAviso(h.newUnit);
    return { titulo: titulo || "Cambio en el rol", cuerpo: `Ahora: ${op}${u && u !== "S/U" ? " · " + u : ""}` };
}

// Globo del sistema (Windows / Mac / Android). Gratis: funciona mientras la app esté abierta,
// aunque estés en otra pestaña o en otro programa. No suena (el sonido ya lo dio la app).
function mostrarGloboSistema(titulo, cuerpo, etiqueta) {
    const opciones = {
        body: cuerpo,
        tag: "stu-" + etiqueta,
        requireInteraction: true,
        silent: true,
        icon: "icon-192.png",
        badge: "icon-192.png",
        data: { url: location.href }
    };
    if (esApk()) {
        const LN = pluginNativo("LocalNotifications");
        if (LN && typeof LN.schedule === "function") {
            LN.schedule({ notifications: [{ id: Math.floor(Date.now() % 2147483000), title: titulo, body: cuerpo, channelId: "cambios" }] }).catch(() => {});
        }
        return;
    }
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const conNotificacionNormal = () => {
        try {
            const n = new Notification(titulo, opciones);
            n.onclick = () => { window.focus(); abrirCampana(0); n.close(); };
        } catch (e) {}
    };
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(reg => {
            if (reg && reg.showNotification) reg.showNotification(titulo, opciones).catch(conNotificacionNormal);
            else conNotificacionNormal();
        }).catch(conNotificacionNormal);
    } else {
        conNotificacionNormal();
    }
}

function procesarDatosDeNube(snap, esPrimeraCarga) {
    const cloudVal = snap.val();
    if (cloudVal) {
        const prevHistLen = Array.isArray(store.globalHistory) ? store.globalHistory.length : 0;
        const localHistoryBackup = Array.isArray(store.globalHistory) ? [...store.globalHistory] : [];

        normalizeStoreStructure(cloudVal);

        if (localHistoryBackup.length > 0) {
            const ids = new Set(store.globalHistory.map(h => h && h.id).filter(Boolean));
            localHistoryBackup.forEach(item => {
                if (item && item.id && !ids.has(item.id)) {
                    store.globalHistory.push(item);
                    ids.add(item.id);
                }
            });
        }
        getGlobalHistory();
        saveLocalCacheDebounced();

        if (!esPrimeraCarga && store.globalHistory.length > prevHistLen && prevHistLen > 0) {
            const ult = store.globalHistory[store.globalHistory.length - 1];
            if (ult) avisarCambioRecibido(ult);
        }
    }
    setSyncStatus(false, "En línea", false);
    window.render();
}

function initFirebaseConnection() {
    if (fbYaConectado) return;
    if (typeof db !== "undefined" && db) {
        fbYaConectado = true;
        return;
    }

    // Esperar a que carguen las librerías de Firebase, con pausas cada vez más largas
    if (typeof firebase === "undefined" || !firebase.database) {
        fbIntentosSDK++;
        if (fbIntentosSDK > 30) {
            setSyncStatus(false, "Sin red (Caché)", true);
            if (!fbEsperandoRed) {
                fbEsperandoRed = true;
                window.addEventListener("online", function () {
                    fbEsperandoRed = false;
                    fbIntentosSDK = 0;
                    window.initFirebaseConnection();
                }, { once: true });
            }
            return;
        }
        setTimeout(window.initFirebaseConnection, Math.min(250 * fbIntentosSDK, 3000));
        return;
    }

    fbYaConectado = true;
    try {
        const firebaseConfig = {
            apiKey: "AIzaSyCgRzOFk8XaCHZZV3brW9AtuJCVBP0cJhA",
            authDomain: "rutas-operaciones.firebaseapp.com",
            databaseURL: "https://rutas-operaciones-default-rtdb.firebaseio.com",
            projectId: "rutas-operaciones"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database().ref("operaciones_v6");

        stuIniciarNubeExtra(); // 4.3: acceso por área y folios (nodos aparte)

        firebase.database().ref(".info/connected").on("value", snap => {
            isConnectedToFirebase = !!snap.val();
            if (isConnectedToFirebase) setSyncStatus(false, "En línea", false);
            else setSyncStatus(false, "Sin red (Caché)", true);
        });

        let primera = true;
        let snapPendiente = null;
        let temporizador = null;
        db.on(
            "value",
            snap => {
                snapPendiente = snap;
                if (temporizador) return; // ya hay una actualización en camino: solo se usa la más reciente
                temporizador = setTimeout(function () {
                    temporizador = null;
                    const s = snapPendiente;
                    snapPendiente = null;
                    const esPrimera = primera;
                    primera = false;
                    try {
                        procesarDatosDeNube(s, esPrimera);
                    } catch (e) {
                        console.error("Error procesando datos de la nube:", e);
                        setSyncStatus(false, "En línea", false);
                    }
                }, primera ? 0 : 400);
            },
            () => setSyncStatus(false, "Caché local", true)
        );
    } catch (e) {
        fbYaConectado = false;
        setSyncStatus(false, "Modo caché", true);
    }
}


// ----- Diagnóstico: ¿qué parte de los datos pesa más? -----
function pesoKB(obj) {
    try {
        const txt = JSON.stringify(obj === undefined ? null : obj);
        return new Blob([txt]).size / 1024;
    } catch (e) {
        return 0;
    }
}

function formatoPeso(kb) {
    return kb >= 1024 ? (kb / 1024).toFixed(2) + " MB" : Math.round(kb) + " KB";
}

async function verConsumoDatos() {
    const secciones = [
        ["days", "Rol (todas las corridas)"],
        ["state", "Cambios y estados por día"],
        ["operadoresMeta", "Datos de operadores (teléfonos, etc.)"],
        ["operadoresDB", "Lista de operadores"],
        ["globalHistory", "Historial de cambios"],
        ["globalFleet", "Flota"],
        ["knownRoutes", "Rutas que conoce cada operador"],
        ["unassignedReasons", "Motivos (taller, baja, etc.)"],
        ["tallerDB", "Unidades en taller"]
    ];
    let total = 0;
    const filas = secciones
        .map(function (s) {
            const kb = pesoKB(store[s[0]]);
            total += kb;
            return { nombre: s[1], kb: kb };
        })
        .sort((a, b) => b.kb - a.kb);

    let cacheLocalKB = 0;
    try {
        cacheLocalKB = ((localStorage.getItem(CACHE_KEY) || "").length * 2) / 1024;
    } catch (e) {}

    let usoNavegador = "";
    try {
        if (navigator.storage && navigator.storage.estimate) {
            const est = await navigator.storage.estimate();
            if (est && est.usage) usoNavegador = formatoPeso(est.usage / 1024);
        }
    } catch (e) {}

    const nHist = Array.isArray(store.globalHistory) ? store.globalHistory.length : 0;
    const nDias = Object.keys(store.days || {}).length;
    const nEstados = Object.keys(store.state || {}).length;

    let barras = "";
    filas.forEach(function (f) {
        const pct = total > 0 ? Math.max(1, Math.round((f.kb / total) * 100)) : 0;
        barras += `<div style="margin-bottom:9px;">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;">
              <span>${f.nombre}</span><span>${formatoPeso(f.kb)} (${pct}%)</span>
            </div>
            <div style="height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:3px;">
              <div style="height:100%;width:${pct}%;background:var(--accent);"></div>
            </div>
          </div>`;
    });

    openSheet(`<h2>📊 ¿Qué gasta mis datos?</h2>
      <div style="background:var(--surface-2);padding:12px;border-radius:12px;font-size:13px;line-height:1.7;margin-bottom:12px">
        <b>Total que se baja de la nube al conectar:</b> hasta ${formatoPeso(total)}<br>
        <b>Copia guardada en este teléfono:</b> ${formatoPeso(cacheLocalKB)}<br>
        ${usoNavegador ? `<b>Espacio usado por la app en el teléfono:</b> ${usoNavegador}<br>` : ""}
        <b>Días del rol:</b> ${nDias} · <b>Días con cambios guardados:</b> ${nEstados} · <b>Registros de historial:</b> ${nHist}
      </div>
      ${barras}
      <div style="font-size:12px;color:var(--ink-soft);margin:10px 0;">
        Mándame una captura de esta pantalla y te digo exactamente qué parte conviene aligerar, sin borrar nada importante.
      </div>
      <button type="button" class="btn-outline" onclick="closeSheet()">Cerrar</button>`);
}

// =========================================================================
// NOTIFICACIONES PUSH (llegan aunque el teléfono esté bloqueado o la app cerrada)
//   · Cada cambio guardado se manda a una "cola" en Firebase.
//   · La Firebase Function "enviarAvisoDeCambio" la lee y avisa a todos los equipos
//     registrados, menos al que hizo el cambio.
//   · APK: usa las notificaciones nativas de Android (Capacitor).
//   · Navegador (PC, iPhone agregado a inicio): necesita la clave web PUSH_VAPID_KEY.
// =========================================================================
const PUSH_RAIZ = "operaciones_v6_push";
// SOLO para notificaciones en navegador (PC o iPhone con la app agregada a inicio). La APK no los necesita.
// Se copian de Firebase ➜ ⚙️ Configuración del proyecto:
//   · PUSH_VAPID_KEY: pestaña Cloud Messaging ➜ Certificados push web ➜ "Par de claves"
//   · PUSH_SENDER_ID: pestaña Cloud Messaging ➜ "ID del remitente"
//   · PUSH_WEB_APP_ID: pestaña General ➜ Tus apps ➜ app web ➜ "ID de la app" (empieza con 1:)
const PUSH_VAPID_KEY = "";
const PUSH_SENDER_ID = "";
const PUSH_WEB_APP_ID = "";

function esApk() {
    return !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform());
}

function pluginNativo(nombre) {
    return esApk() && window.Capacitor.Plugins ? window.Capacitor.Plugins[nombre] : null;
}

function estadoNotificacionesPush() {
    const token = localStorage.getItem("stu_push_token");
    if (token) return { activas: true, texto: "✅ Activas en este equipo" };
    if (esApk()) {
        if (!pluginNativo("PushNotifications") && pluginNativo("LocalNotifications")) {
            return localStorage.getItem("stu_avisos_locales") === "1"
                ? { activas: true, texto: "✅ Avisos activos mientras la app esté abierta" }
                : { activas: false, texto: "Toca para permitir los avisos" };
        }
        return { activas: false, texto: "Toca para activarlas" };
    }
    if (!("Notification" in window)) return { activas: false, texto: "Este navegador no las permite" };
    if (Notification.permission === "denied") return { activas: false, texto: "Bloqueadas en el navegador" };
    if (!PUSH_VAPID_KEY || !PUSH_SENDER_ID || !PUSH_WEB_APP_ID) {
        return Notification.permission === "granted"
            ? { activas: true, texto: "✅ Globos fijos activos (con la app abierta en una pestaña)" }
            : { activas: false, texto: "Toca para permitir los globos de aviso" };
    }
    return { activas: false, texto: "Toca para activarlas" };
}

// Avisos gratis en la APK (sin Firebase de pago): salen mientras la app esté abierta o en segundo plano reciente
async function iniciarAvisosLocalesApk(preguntar) {
    const LN = pluginNativo("LocalNotifications");
    if (!LN) return false;
    let permiso = await LN.checkPermissions();
    if (permiso.display !== "granted" && preguntar) permiso = await LN.requestPermissions();
    if (permiso.display !== "granted") return false;
    try {
        await LN.createChannel({ id: "cambios", name: "Cambios del rol", description: "Cambios de unidad, operador y estados", importance: 5, visibility: 1, vibration: true });
    } catch (e) {}
    if (!iniciarAvisosLocalesApk._escuchando) {
        iniciarAvisosLocalesApk._escuchando = true;
        LN.addListener("localNotificationActionPerformed", () => {
            try { abrirCampana(0); } catch (e) {}
        });
    }
    localStorage.setItem("stu_avisos_locales", "1");
    return true;
}

function firebaseListoParaPush() {
    return typeof firebase !== "undefined" && firebase.apps && firebase.apps.length && typeof firebase.database === "function";
}

function guardarTokenPush(token, plataforma) {
    if (!token) return;
    localStorage.setItem("stu_push_token", token);
    const guardar = () => {
        if (!firebaseListoParaPush()) return setTimeout(guardar, 1500);
        const llave = fbKey(token).slice(-140);
        firebase.database().ref(PUSH_RAIZ + "/tokens/" + llave).set({
            token: token,
            plataforma: plataforma,
            equipo: String(navigator.userAgent || "").slice(0, 90),
            actualizado: Date.now()
        }).catch(() => {});
    };
    guardar();
}

// Se llama cada vez que alguien registra un cambio (Flota, estado de operador o cambio tipo BusUp)
function encolarAvisoPush(rec) {
    try {
        if (!rec || !firebaseListoParaPush()) return;
        const critico = ESTADOS_CRITICOS.some(est => String(rec.reason || "").toLowerCase().includes(est.toLowerCase()));
        const aviso = textoAvisoCorto(rec);
        const enlace = !esApk() && /^https:/.test(location.href) ? location.origin + location.pathname : "";
        firebase.database().ref(PUSH_RAIZ + "/cola").push({
            titulo: aviso.titulo.slice(0, 80),
            cuerpo: aviso.cuerpo.slice(0, 160),
            critico: critico,
            tokenOrigen: localStorage.getItem("stu_push_token") || "",
            enlace: enlace,
            creado: Date.now()
        }).catch(() => {});
    } catch (e) {}
}

async function iniciarPushApk(preguntar) {
    const PN = pluginNativo("PushNotifications");
    if (!PN) return false;
    let permiso = await PN.checkPermissions();
    if (permiso.receive !== "granted" && preguntar) permiso = await PN.requestPermissions();
    if (permiso.receive !== "granted") return false;
    try {
        await PN.createChannel({ id: "cambios", name: "Cambios del rol", description: "Cambios de unidad, operador y estados", importance: 5, visibility: 1, vibration: true });
    } catch (e) {}
    if (!iniciarPushApk._escuchando) {
        iniciarPushApk._escuchando = true;
        PN.addListener("registration", t => guardarTokenPush(t.value, "android"));
        PN.addListener("registrationError", e => console.error("Push:", e));
        // Al tocar la notificación se abre la app en Activas con los avisos rojos visibles
        PN.addListener("pushNotificationActionPerformed", () => {
            try {
                abrirCampana(0);
            } catch (e) {}
        });
    }
    await PN.register();
    return true;
}

async function iniciarPushWeb(preguntar) {
    if (!PUSH_VAPID_KEY || !PUSH_SENDER_ID || !PUSH_WEB_APP_ID || !("serviceWorker" in navigator) || !("Notification" in window)) return false;
    if (Notification.permission !== "granted") {
        if (!preguntar) return false;
        if ((await Notification.requestPermission()) !== "granted") return false;
    }
    if (!firebaseListoParaPush()) return false;
    if (typeof firebase.messaging !== "function") {
        await new Promise((ok, mal) => {
            const s = document.createElement("script");
            s.src = "https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js";
            s.onload = ok;
            s.onerror = mal;
            document.head.appendChild(s);
        });
    }
    // App de Firebase aparte solo para avisos (la principal no trae ID de remitente)
    const base = firebase.app().options;
    const appPush = firebase.apps.find(a => a.name === "push") ||
        firebase.initializeApp({ apiKey: base.apiKey, projectId: base.projectId, messagingSenderId: PUSH_SENDER_ID, appId: PUSH_WEB_APP_ID }, "push");
    const reg = await navigator.serviceWorker.ready;
    const token = await appPush.messaging().getToken({ vapidKey: PUSH_VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) guardarTokenPush(token, "web");
    return !!token;
}

// Al abrir la app: en la APK se piden y registran solas; en navegador solo si ya se habían permitido
function iniciarNotificacionesPush() {
    const intentar = () => {
        if (esApk()) {
            iniciarAvisosLocalesApk(true).catch(() => {});
            return iniciarPushApk(true).catch(e => console.error("Push:", e));
        }
        if (!firebaseListoParaPush()) return setTimeout(intentar, 2000);
        iniciarPushWeb(false).catch(() => {});
    };
    setTimeout(intentar, 1500);
}

        if ("Notification" in window && Notification.permission !== "granted") {

        abrirConfiguracion();
        return;
    }
    try {
        const ok = esApk() ? ((await iniciarAvisosLocalesApk(true)) || (await iniciarPushApk(true))) : await iniciarPushWeb(true);

const STU_AREAS_PIN = ["Jefatura", "Desarrollo", "Supervisión", "Torre de Control", "Despacho"];
const STU_AREAS_SUGERIDAS = ["Jefatura", "Desarrollo", "Supervisión", "Torre de Control", "Despacho", "Consulta"];
const STU_AREA_COLOR = { "Jefatura": "#0B3558", "Desarrollo": "#1F6B3A", "Supervisión": "#2F6DB5", "Torre de Control": "#A3122A", "Despacho": "#6B7A1F", "Consulta": "#5B6B80" };
let stuAcceso = { pins: {}, equipos: {} };
let stuAccesoListo = false;
let stuNubeAcceso = null;
let stuNubeFolios = null;
let stuNubeFotos = null;

function stuDeviceId() {
    let id = "";
    try {
        id = localStorage.getItem("stu_device_id") || "";
        if (!id) {
            id = "eq_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            localStorage.setItem("stu_device_id", id);
        }
    } catch (e) {
        id = id || "eq_temporal";
    }
    return id;
}

function stuEquipo() {
    try {
        const e = JSON.parse(localStorage.getItem("stu_equipo") || "null");
        return e && typeof e === "object" ? e : null;
    } catch (e) {
        return null;
    }
}

function stuGuardarEquipoLocal(e) {
    try {
        localStorage.setItem("stu_equipo", JSON.stringify(e));
    } catch (err) {}
}

function stuPinDeArea(area) {
    return (stuAcceso.pins || {})[fbKey(area)] || null;
}

// Área con permisos reales: solo si dio el PIN correcto y el PIN no ha cambiado desde entonces
function stuAreaVerificada() {
    const e = stuEquipo();
    if (!e || !e.verificado || !STU_AREAS_PIN.includes(e.area)) return "";
    const p = stuPinDeArea(e.area);
    if (stuAccesoListo) {
        if (!p || Number(p.ver || 0) !== Number(e.pinVer || 0)) return "";
        const reg = (stuAcceso.equipos || {})[stuDeviceId()];
        if (reg && reg.retirado) return "";
    }
    return e.area;
}

function stuPuede(accion) {
    const a = stuAreaVerificada();
    if (accion === "folios") return a === "Torre de Control";
    if (accion === "duplicar") return a === "Supervisión" || a === "Jefatura" || a === "Desarrollo";
    if (accion === "pins") return a === "Jefatura" || a === "Desarrollo";
    if (accion === "extras") return !!a; // 4.4: cualquier área con PIN
    return false;
}

// Texto "Área · Nombre" que se guarda en cada cambio y folio
function stuQuienSoy() {
    const e = stuEquipo();
    if (!e || (!e.area && !e.nombre)) return "Sin registrar";
    let area = stuAreaVerificada();
    if (!area) area = STU_AREAS_PIN.includes(e.area) ? "Consulta" : (e.area || "Consulta");
    return area + (e.nombre ? " · " + e.nombre : "");
}

async function stuHashPin(area, pin) {
    const txt = "stu-buap|" + area + "|" + String(pin || "").trim();
    try {
        if (window.crypto && crypto.subtle && window.TextEncoder) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        }
    } catch (e) {}
    let h = 5381;
    for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) >>> 0;
    return "d" + h.toString(16);
}

function stuAccesoGuardarCache() {
    try {
        localStorage.setItem("stu_acceso_cache", JSON.stringify(stuAcceso));
    } catch (e) {}
}

function stuAccesoCargarCache() {
    try {
        const c = JSON.parse(localStorage.getItem("stu_acceso_cache") || "null");
        if (c && typeof c === "object") stuAcceso = { pins: c.pins || {}, equipos: c.equipos || {} };
    } catch (e) {}
}

// Escribe en el nodo de acceso (nube si hay; si no, solo en este equipo)
function stuAccesoSet(ruta, valor) {
    const partes = ruta.split("/");
    let obj = stuAcceso;
    for (let i = 0; i < partes.length - 1; i++) {
        obj[partes[i]] = obj[partes[i]] || {};
        obj = obj[partes[i]];
    }
    if (valor === null) delete obj[partes[partes.length - 1]];
    else obj[partes[partes.length - 1]] = valor;
    stuAccesoGuardarCache();
    if (stuNubeAcceso) {
        return stuNubeAcceso.child(ruta).set(valor === null ? null : JSON.parse(JSON.stringify(valor)));
    }
    return Promise.resolve();
}

function stuEqPintarPin() {
    const caja = document.getElementById("eqPinCaja");

async function stuGuardarRegistro() {
    const area = ((document.getElementById("eqArea") || {}).value || "").trim().slice(0, 40);
    const nombre = ((document.getElementById("eqNombre") || {}).value || "").trim().slice(0, 40);
    const msg = document.getElementById("eqMsg");
    const decir = t => { if (msg) msg.innerHTML = t; };
    if (!area) return decir("Elige o escribe tu área.");
    if (!nombre) return decir("Escribe tu nombre.");
    const equipo = { area: area, nombre: nombre, verificado: false, pinVer: 0, ts: Date.now() };

    if (STU_AREAS_PIN.includes(area)) {
        const pin = ((document.getElementById("eqPin") || {}).value || "").trim();
        const p = stuPinDeArea(area);
        if (!p && area === "Desarrollo") {
            const pin2 = ((document.getElementById("eqPin2") || {}).value || "").trim();
            if (!/^\d{4,12}$/.test(pin)) return decir("El PIN debe tener de 4 a 12 números.");
            if (pin !== pin2) return decir("Los dos PIN no coinciden.");
            const nuevo = { hash: await stuHashPin(area, pin), ver: 1, ts: Date.now(), por: nombre };
            await stuAccesoSet("pins/" + fbKey(area), nuevo);
            equipo.verificado = true;
            equipo.pinVer = 1;
        } else if (!p) {
            equipo.area = "Consulta";
        } else {
            if (!pin) return decir(`Escribe el PIN de ${escHtml(area)}.`);
            const h = await stuHashPin(area, pin);
            if (h !== p.hash) return decir("PIN incorrecto. Revisa con Jefatura o Desarrollo.");
            equipo.verificado = true;
            equipo.pinVer = Number(p.ver || 0);
        }
    }
    stuGuardarEquipoLocal(equipo);
    stuAccesoSet("equipos/" + stuDeviceId(), { area: equipo.area, nombre: nombre, verificado: equipo.verificado, ts: Date.now(), retirado: false });
    stuAreaAntes = stuAreaVerificada();
    closeSheet();
    stuPintarAutoria();
    showAggressiveToast(`Este equipo quedó como ${stuQuienSoy()}.`);
    window.render();
}

        <div class="eq-sec">Equipos registrados</div>
        <div class="pin-equipos">${lista || '<p class="eq-nota">Todavía no hay equipos registrados.</p>'}</div>
        <p class="eq-nota">Al cambiar un PIN, los equipos de esa área quedan como Consulta hasta que pongan el PIN nuevo.</p>

function stuCambiarPin(area) {
    if (!stuPuede("pins")) return;
    openSheet(`<div class="eq">
        <h2>${stuPinDeArea(area) ? "Cambiar" : "Crear"} PIN de ${escHtml(area)}</h2>
        <input type="password" inputmode="numeric" id="pinNuevo" class="input-field eq-pin" placeholder="PIN nuevo (4 a 12 números)" maxlength="12">
        <input type="password" inputmode="numeric" id="pinNuevo2" class="input-field eq-pin" placeholder="Repite el PIN" maxlength="12">
        <div id="pinMsg" class="eq-msg"></div>
        <button type="button" class="btn-primary" style="background:var(--navy);" onclick="stuGuardarPin('${area}')">Guardar PIN</button>
        <button type="button" class="btn-outline" onclick="stuAbrirPins()">Regresar</button>
      </div>`);
}

async function stuGuardarPin(area) {
    if (!stuPuede("pins")) return;
    const a = ((document.getElementById("pinNuevo") || {}).value || "").trim();
    const b = ((document.getElementById("pinNuevo2") || {}).value || "").trim();
    const msg = document.getElementById("pinMsg");
    if (!/^\d{4,12}$/.test(a)) {
        if (msg) msg.textContent = "El PIN debe tener de 4 a 12 números.";
        return;
    }
    if (a !== b) {
        if (msg) msg.textContent = "Los dos PIN no coinciden.";
        return;
    }
    const antes = stuPinDeArea(area);
    const ver = Number((antes && antes.ver) || 0) + 1;
    await stuAccesoSet("pins/" + fbKey(area), { hash: await stuHashPin(area, a), ver: ver, ts: Date.now(), por: stuQuienSoy() });
    // Si cambié el PIN de mi propia área, este equipo sigue con permiso
    const e = stuEquipo();
    if (e && e.area === area && e.verificado) {
        e.pinVer = ver;
        stuGuardarEquipoLocal(e);
    }
    showAggressiveToast(`PIN de ${area} guardado.`);
    stuAbrirPins();
}

function stuSacarEquipo(id) {
    if (!stuPuede("pins")) return;
    const e = (stuAcceso.equipos || {})[id];
    if (!e) return;
    stuAccesoSet("equipos/" + id + "/retirado", true);
    showAggressiveToast(`${e.area || ""} · ${e.nombre || ""} quedó como Consulta.`);
    stuAbrirPins();
}

// ----- 7B. FOLIOS DE TORRE DE CONTROL -----
const FOLIO_TIPOS = {
    siniestro: { nombre: "Siniestro", cat: "Siniestro / Alcance Vial", color: "#A3122A", bg: "#FBE5E8", alta: true },
    falla: { nombre: "Falla mecánica", cat: "Falla Mecánica / Taller", color: "#9A3412", bg: "#FDE7D6", alta: true },
    fuera: { nombre: "Fuera de rol", cat: "Fuera de Rol", color: "#5B2C8A", bg: "#F1E8FA", alta: true },
    informativo: { nombre: "Informativo", cat: "Folio Informativo", color: "#2F6DB5", bg: "#E6EEF9", alta: false }
};
const FOLIOS_DIAS_VIGENCIA = 45;
let stuFolios = {};
let stuFoliosConocidos = null;
let stuFotosCache = {};
let stuFolioBorrador = null;

function stuFoliosVistos() {
    if (window._stuFoliosVistos) return window._stuFoliosVistos;
    let arr = [];
    try {
        arr = JSON.parse(localStorage.getItem("stu_folios_vistos") || "[]");
    } catch (e) {}
    window._stuFoliosVistos = new Set(Array.isArray(arr) ? arr : []);
    return window._stuFoliosVistos;
}

function stuMarcarFolioVisto(id) {
    const s = stuFoliosVistos();
    s.add(String(id));
    try {
        localStorage.setItem("stu_folios_vistos", JSON.stringify(Array.from(s).slice(-600)));
    } catch (e) {}
}

function stuListaFolios() {
    const limite = Date.now() - FOLIOS_DIAS_VIGENCIA * 864e5;
    return Object.values(stuFolios || {}).filter(f => f && f.id && (f.ts || 0) >= limite).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

function stuFoliosSinVer() {
    const vistos = stuFoliosVistos();
    return stuListaFolios().filter(f => !vistos.has(String(f.id)));
}

// Fecha real (día) de un folio y de un día del rol, para filtrar "los del día"
function stuMismaFecha(a, b) {
    return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function stuFoliosDelDia(dia) {
    const fecha = stuFechaDeDia(dia || store.currentDay);
    return stuListaFolios().filter(f => (f.dia && f.dia === (dia || store.currentDay)) || stuMismaFecha(new Date(f.ts || 0), fecha));
}

// Unidades con folio de alta prioridad hoy (para marcarlas en Activas)
function stuUnidadesConFolio() {
    const hoy = new Date();
    const mapa = {};
    stuListaFolios().forEach(f => {
        const t = FOLIO_TIPOS[f.tipo];
        if (!t || !t.alta || !f.unidad || !stuMismaFecha(new Date(f.ts || 0), hoy)) return;
        if (!mapa[f.unidad]) mapa[f.unidad] = f;
    });
    return mapa;
}

function stuFoliosGuardarCache() {
    try {
        localStorage.setItem("stu_folios_cache", JSON.stringify(stuFolios));
    } catch (e) {}
}

function stuFoliosCargarCache() {
    try {
        const c = JSON.parse(localStorage.getItem("stu_folios_cache") || "null");
        if (c && typeof c === "object") stuFolios = c;
    } catch (e) {}
}

// Llegaron folios (de la nube): avisar los nuevos de otros equipos
function stuFoliosLlegaron(val) {
    stuFolios = val && typeof val === "object" ? val : {};
    stuFoliosGuardarCache();
    const ids = Object.keys(stuFolios);
    if (stuFoliosConocidos === null) {
        stuFoliosConocidos = new Set(ids);
    } else {
        const vistos = stuFoliosVistos();
        ids.forEach(id => {
            if (stuFoliosConocidos.has(id)) return;
            stuFoliosConocidos.add(id);
            const f = stuFolios[id];
            if (f && !vistos.has(String(id))) stuAvisarFolio(f);
        });
    }
    stuPintarFranjaFolio();
    actualizarAvisosRojos();
    refrescarCampanas(true);
    if (activeView === "indicadores" || activeView === "activas") window.render();
}

function stuTextoFolioCorto(f) {
    const t = FOLIO_TIPOS[f.tipo] || FOLIO_TIPOS.informativo;
    return {
        titulo: `${t.nombre}${f.unidad ? " · U-" + f.unidad : ""}`,
        cuerpo: String(f.motivo || (f.fuera && f.fuera.motivo) || "").slice(0, 120)
    };
}

function stuAvisarFolio(f) {
    try {
        const t = FOLIO_TIPOS[f.tipo] || FOLIO_TIPOS.informativo;
        playAlertSound(!!t.alta);
        if (t.alta) setTimeout(() => playAlertSound(true), 900);
        if (navigator.vibrate) navigator.vibrate(t.alta ? [600, 200, 600, 200, 900] : [200, 100, 200]);
        const a = stuTextoFolioCorto(f);
        mostrarGloboSistema(a.titulo, a.cuerpo, "folio_" + f.id);
    } catch (e) {}
}

// Franja roja arriba en todas las pantallas (solo siniestro, falla y fuera de rol sin Enterado)
function stuPintarFranjaFolio() {
    const el = document.getElementById("franjaFolio");
    if (!el) return;
    const altos = stuFoliosSinVer().filter(f => (FOLIO_TIPOS[f.tipo] || {}).alta);
    if (!altos.length) {
        el.hidden = true;
        el.innerHTML = "";
        return;
    }
    const f = altos[0];
    const t = FOLIO_TIPOS[f.tipo];

// --- Lector del mensaje de texto ---
function stuSinAcentos(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
}

function stuLimpiarLineaFolio(l) {
    return String(l || "")
        .replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{23FF}\u{2460}-\u{27BF}\u{2900}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{E0020}-\u{E007F}]/gu, "")
        .replace(/^[\s#*•·\-–>]+/, "")
        .trim();
}

const FOLIO_LLAVES = [
    ["unidad", /^(unidad|unid|eco|economico|no\.? ?economico|camion)\b/],
    ["clave", /^(clave|nomina|no\.? ?de ?nomina)\b/],
    ["nombre", /^(nombre|operador|conductor|chofer)\b/],
    ["tel", /^(telefono|tel|celular|cel|movil)\b/],
    ["ubicacion", /^(ubicacion|lugar|direccion|donde|ubic)\b/],
    ["motivo", /^(motivo|descripcion|falla|reporte|detalle|observaciones?)\b/],
    ["px", /^(px|pasajeros|pax)\b/],
    ["folio", /^(folio|no\.? ?folio)\b/],
    ["cat", /^(categoria|tipo)\b/],
    ["estatus", /^(estatus|status|estado)\b/]
];

function stuLeerFolioTexto(txt) {
    const datos = { unidad: "", clave: "", nombre: "", tel: "", ubicacion: "", motivo: "", px: "", folio: "", cat: "", estatus: "" };
    let ultima = "";
    String(txt || "").split(/\r?\n/).forEach(linea => {
        const l = stuLimpiarLineaFolio(linea);
        if (!l) return;
        const m = l.match(/^([^:：]{1,30})[:：]\s*(.*)$/);
        if (m) {
            const llave = stuSinAcentos(m[1]).toLowerCase().replace(/[^a-z0-9. ]/g, "").trim();
            const hit = FOLIO_LLAVES.find(k => k[1].test(llave));
            if (hit) {
                datos[hit[0]] = (datos[hit[0]] ? datos[hit[0]] + " " : "") + m[2].trim();
                ultima = hit[0];
                return;
            }
        }
        if (ultima === "motivo" || ultima === "ubicacion") datos[ultima] += (datos[ultima] ? " " : "") + l;
    });
    datos.unidad = (String(datos.unidad).match(/\d{3,5}/) || [""])[0];
    datos.clave = (String(datos.clave).match(/\d{3,8}/) || [String(datos.clave).trim()])[0];
    datos.px = (String(datos.px).match(/\d+/) || [""])[0];
    datos.folio = String(datos.folio).replace(/\s+/g, "").trim();
    datos.tel = String(datos.tel).replace(/[^\d ]/g, "").replace(/\s+/g, " ").trim();
    if (datos.ubicacion) datos.ubicacion = datos.ubicacion.replace(/\bstu\b/gi, "STU").replace(/^./, c => c.toUpperCase());
    if (datos.motivo) datos.motivo = datos.motivo.replace(/^./, c => c.toUpperCase());
    // Si no venía "Unidad:" se intenta sacar del folio (fecha-unidad-consecutivo)
    if (!datos.unidad) {
        const f = datos.folio.match(/^\d{8}-(\d{3,5})-/);
        if (f) datos.unidad = f[1];
    }
    return datos;
}

const FOLIO_PALABRAS_SINIESTRO = /(siniestro|choque|chocó|choco|golpe|golpeo|golpeó|alcance|roz[oóa]|rozon|percance|impact|colisi|espejo|atropell|lesionad|accidente|se llevo|se llevó|pasamanos|cristal|parabrisas)/i;
const FOLIO_PALABRAS_FALLA = /(falla|llanta|ponch|motor|freno|no enciende|no arranca|bateria|batería|aceite|clutch|embrague|temperatura|calienta|fuga|amortiguador|aire acondicionado|suspensi|transmisi|palanca|marcha|alternador|radiador|manguera|diesel|diésel|refacci|taller|descompuest)/i;

function stuClasificarFolio(d) {
    const cat = stuSinAcentos(d.cat || "").toLowerCase();
    if (/fuera/.test(cat)) return { tipo: "fuera", porque: "la categoría del mensaje" };
    if (/siniestro|alcance|percance/.test(cat)) return { tipo: "siniestro", porque: "la categoría del mensaje" };
    if (/falla|taller|mecanic/.test(cat)) return { tipo: "falla", porque: "la categoría del mensaje" };
    if (/informativ/.test(cat)) return { tipo: "informativo", porque: "la categoría del mensaje" };
    const texto = (d.motivo || "") + " " + (d.estatus || "");
    const s = texto.match(FOLIO_PALABRAS_SINIESTRO);
    if (s) return { tipo: "siniestro", porque: `«${s[0].toLowerCase()}»` };
    const f = texto.match(FOLIO_PALABRAS_FALLA);
    if (f) return { tipo: "falla", porque: `«${f[0].toLowerCase()}»` };
    return { tipo: "informativo", porque: "no menciona golpe ni falla" };
}

// --- Lector de la captura del fuera de rol ---
const FOLIO_MESES = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11 };

function stuLeerFueraDeRol(texto) {
    const t = String(texto || "").replace(/\r/g, "");
    const plano = t.replace(/[ \t]+/g, " ");
    const toma = re => {
        const m = plano.match(re);
        return m ? m[1].trim() : "";
    };
    const fecha = "(\\d{1,2}\\s+[a-záéíóú]+\\.?\\s+\\d{4}\\s+\\d{1,2}:\\d{2})";
    const d = {
        solicitud: toma(new RegExp("Fecha\\s+de\\s+solicitud:?\\s*" + fecha, "i")),
        unidad: toma(/Unidad:?\s*(\d{3,5})/i),
        folioTaller: toma(/Folio\s*Taller:?\s*(\d{3,8})/i),
        clave: toma(/Clave\s+del\s+operador:?\s*(\d{3,8})/i),
        proximo: toma(new RegExp("Pr[oó]ximo\\s+turno:?\\s*" + fecha, "i")),
        autorizo: toma(/Autorizado\s+por:?\s*([A-Za-zÁÉÍÓÚÑáéíóúñ]+(?:\s+[A-Za-zÁÉÍÓÚÑáéíóúñ]+){0,3}?)(?=\s+Aviso|\s{2,}|\n|$)/i),
        aviso: toma(/Aviso:?\s*([^\n]+)/i),
        motivo: ""
    };
    const mm = t.match(/Motivo\s+de\s+ingreso\s*\n?([\s\S]*?)(?=Historial\s+de\s+Solicitudes|\n\s*\d{1,2}\s*\n?\s*(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)|$)/i);
    if (mm) {
        d.motivo = mm[1].split("\n").map(x => x.trim()).filter(x => x && !/^[<>‹›]$/.test(x)).join(" ").replace(/\s+/g, " ").trim();
    }
    if (d.aviso) d.aviso = d.aviso.replace(/\s+/g, " ").slice(0, 80);
    return d;
}

function stuFechaTextoAFecha(txt) {
    const m = stuSinAcentos(txt || "").toLowerCase().match(/(\d{1,2})\s+([a-z]+)\.?\s+(\d{4})\s+(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const mes = FOLIO_MESES[m[2].slice(0, 3)];
    if (mes === undefined) return null;
    return new Date(Number(m[3]), mes, Number(m[1]), Number(m[4]), Number(m[5]));
}

// Comprime la foto (máx. 1400 px de ancho, JPEG) para que pese poco en la nube
function stuComprimirImagen(file) {
    return new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onload = () => {
            const img = new Image();
            img.onload = () => {
                const escala = Math.min(1, 1400 / img.width);
                const c = document.createElement("canvas");
                c.width = Math.round(img.width * escala);
                c.height = Math.round(img.height * escala);
                const ctx = c.getContext("2d");
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.drawImage(img, 0, 0, c.width, c.height);
                let q = 0.7;
                let url = c.toDataURL("image/jpeg", q);
                while (url.length > 260000 && q > 0.35) {
                    q -= 0.1;
                    url = c.toDataURL("image/jpeg", q);
                }
                resolve({ url: url, kb: Math.round((url.length * 3) / 4 / 1024), ancho: c.width, alto: c.height });
            };
            img.onerror = () => reject(new Error("No se pudo abrir la imagen"));
            img.src = lector.result;
        };
        lector.onerror = () => reject(new Error("No se pudo leer el archivo"));
        lector.readAsDataURL(file);
    });
}

// Lee el texto de la foto (gratis, en el mismo equipo). Si no hay internet, no pasa nada: la foto se manda igual.
let stuOcrCarga = null;
function stuCargarOcr() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (stuOcrCarga) return stuOcrCarga;
    stuOcrCarga = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
        s.onload = () => (window.Tesseract ? resolve(window.Tesseract) : reject(new Error("Lector no disponible")));
        s.onerror = () => {
            stuOcrCarga = null;
            reject(new Error("Sin conexión para leer la imagen"));
        };
        document.head.appendChild(s);
    });
    return stuOcrCarga;
}

async function stuLeerTextoImagen(url) {
    const T = await stuCargarOcr();
    const r = await T.recognize(url, "spa");
    return (r && r.data && r.data.text) || "";
}

function stuFolioPegar(ev) {
    const items = (ev.clipboardData && ev.clipboardData.items) || [];
    for (let i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf("image") === 0) {
            ev.preventDefault();
            stuFolioImagen(items[i].getAsFile());
            return;
        }
    }
}

function stuFolioTextoCambio() {
    const txt = ((document.getElementById("folioTexto") || {}).value || "").trim();
    if (!txt) {
        stuFolioBorrador = null;
        stuPintarVistaFolio();
        return;
    }
    const d = stuLeerFolioTexto(txt);
    const c = stuClasificarFolio(d);
    stuFolioBorrador = Object.assign({}, d, { tipo: c.tipo, porque: c.porque, texto: txt.slice(0, 2000), foto: null });
    stuPintarVistaFolio();
}

async function stuFolioImagen(file) {
    if (!file) return;
    const vista = document.getElementById("folioVista");
    if (vista) vista.innerHTML = '<div class="ok-leido">Preparando la imagen…</div>';
    try {
        const img = await stuComprimirImagen(file);
        stuFolioBorrador = { tipo: "fuera", porque: "es una captura", foto: img, fuera: {}, unidad: "", clave: "", motivo: "", texto: "", leyendo: true };
        stuPintarVistaFolio();
        try {
            const texto = await stuLeerTextoImagen(img.url);
            const d = stuLeerFueraDeRol(texto);
            if (!stuFolioBorrador || stuFolioBorrador.foto !== img) return;
            stuFolioBorrador.fuera = d;
            stuFolioBorrador.unidad = d.unidad;
            stuFolioBorrador.clave = d.clave;
            stuFolioBorrador.motivo = d.motivo;
            stuFolioBorrador.texto = texto.slice(0, 2000);
            stuFolioBorrador.leyendo = false;
            stuFolioBorrador.leido = true;
        } catch (e) {
            stuFolioBorrador.leyendo = false;
            stuFolioBorrador.errorLectura = e.message || "No se pudo leer la imagen";
        }
        stuPintarVistaFolio();
    } catch (e) {
        if (vista) vista.innerHTML = `<div class="eq-msg">${escHtml(e.message)}</div>`;
    }
}

function stuFolioCambiarTipo(tipo) {
    if (!stuFolioBorrador) return;
    stuFolioBorrador.tipo = tipo;
    stuFolioBorrador.porque = "lo elegiste tú";
    stuPintarVistaFolio();
}

function stuPintarVistaFolio() {
    const vista = document.getElementById("folioVista");
    if (!vista) return;
    const b = stuFolioBorrador;
    if (!b) {
        vista.innerHTML = "";
        return;
    }
    const t = FOLIO_TIPOS[b.tipo];
    const previa = {
        id: "previa",
        tipo: b.tipo,
        unidad: b.unidad,
        folio: b.folio,
        motivo: b.motivo,
        ubicacion: b.ubicacion,
        px: b.px,
        nombre: b.nombre,
        clave: b.clave,
        tel: b.tel,
        foto: false,
        fuera: b.fuera,
        ts: Date.now(),
        por: stuQuienSoy()
    };
    let estadoFoto = "";
    if (b.foto) {
        estadoFoto = b.leyendo
            ? `<div class="ok-leido leyendo">Leyendo la imagen… (unos segundos)</div>`
            : b.leido
              ? `<div class="ok-leido">✓ Imagen leída · foto guardada (${b.foto.kb} KB)</div>`
              : `<div class="ok-leido ojo">No se pudo leer el texto (${escHtml(b.errorLectura || "")}). La foto se manda igual.</div>`;
        estadoFoto = `<img class="folio-mini" src="${b.foto.url}" alt="Captura">` + estadoFoto;
    }
    const faltaUnidad = !b.unidad && !b.leyendo;
    const otros = Object.keys(FOLIO_TIPOS).filter(k => k !== b.tipo).map(k => `<button type="button" class="eq-chip" onclick="stuFolioCambiarTipo('${k}')">${FOLIO_TIPOS[k].nombre}</button>`).join("");
    vista.innerHTML = `${estadoFoto}
      <div class="eq-sec">Así se va a enviar</div>
      ${stuTarjetaFolio(previa, false, true)}
      <div class="folio-clasif">La app lo clasificó como <b>${escHtml(t.nombre.toLowerCase())}</b> por ${escHtml(b.porque || "")}. ¿Es otro? ${otros}</div>
      ${faltaUnidad ? `<div class="folio-clasif ojo">No encontré el número de unidad. Escríbelo: <input type="text" inputmode="numeric" class="input-field folio-uni" maxlength="5" oninput="stuFolioBorrador.unidad=this.value.replace(/\\D/g,'')"></div>` : ""}
      <button type="button" class="btn-primary folio-enviar" style="background:${t.color};" ${b.leyendo ? "disabled" : ""} onclick="stuEnviarFolio()">Enviar folio y avisar a todos</button>`;
}

async function stuEnviarFolio() {
    const b = stuFolioBorrador;
    if (!b || b.leyendo) return;
    if (!stuPuede("folios")) return showAggressiveToast("Solo Torre de Control puede crear folios.");
    if (!b.unidad && !b.motivo && !b.foto) return showAggressiveToast("El mensaje no trae datos para el folio.");
    const id = (stuNubeFolios ? stuNubeFolios.push().key : "f" + Date.now().toString(36)) || "f" + Date.now();
    const t = FOLIO_TIPOS[b.tipo];
    const folio = {
        id: id,
        tipo: b.tipo,
        cat: t.cat,
        folio: b.folio || "",
        unidad: b.unidad || "",
        clave: b.clave || "",
        nombre: b.nombre || "",
        tel: b.tel || "",
        ubicacion: b.ubicacion || "",
        motivo: b.motivo || "",
        px: b.px || "",
        estatus: b.estatus || (b.tipo === "fuera" ? "Fuera de Rol" : "En Rol"),
        ts: Date.now(),
        dia: store.currentDay || "",
        por: stuQuienSoy(),
        texto: b.texto || "",
        foto: !!b.foto,
        fotoKB: b.foto ? b.foto.kb : 0
    };
    if (b.tipo === "fuera") folio.fuera = b.fuera || {};
    stuMarcarFolioVisto(id);
    stuFolios[id] = folio;
    if (b.foto) stuFotosCache[id] = b.foto.url;
    stuFoliosGuardarCache();
    const btn = document.querySelector(".folio-enviar");
    if (btn) {
        btn.disabled = true;
        btn.textContent = "Enviando…";
    }
    try {
        if (stuNubeFolios) {
            if (b.foto) await stuNubeFotos.child(id).set(b.foto.url);
            await stuNubeFolios.child(id).set(JSON.parse(JSON.stringify(folio)));
            showAggressiveToast(`Folio enviado: ${t.nombre}${folio.unidad ? " · U-" + folio.unidad : ""}. Ya se avisó a todos.`);
        } else {
            showAggressiveToast("Sin conexión: el folio quedó guardado solo en este equipo.");
        }
    } catch (e) {
        showAggressiveToast("No se pudo enviar el folio: " + (e.message || e));
    }
    closeSheet();
    stuPintarFranjaFolio();
    refrescarCampanas(true);
    window.render();
}

// Conecta los nodos nuevos de la nube (se llama al conectar Firebase)
function stuIniciarNubeExtra() {
    try {
        if (typeof firebase === "undefined" || !firebase.database) return;
        stuNubeAcceso = firebase.database().ref("operaciones_v6_acceso");
        stuNubeFolios = firebase.database().ref("operaciones_v6_folios");
