// ----- 7C. FECHA REAL DE UN DÍA DEL ROL ("Jueves 12" → 12/nov/2026) -----
const STU_DIAS_SEMANA = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const STU_MESES_LARGO = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const STU_MESES_CORTO = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

function stuFechaDeDia(dia) {
    const d = store.days && store.days[dia];
    if (d && d.fecha) {
        const f = new Date(d.fecha + "T00:00:00");
        if (!isNaN(f)) return f;
    }
    const txt = String((d && d.label) || dia || "");
    const m = txt.match(/(\d{1,2})(?!.*\d)/);
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    if (!m) return hoy;
    const n = Number(m[1]);
    let mejor = null;
    [-1, 0, 1].forEach(dm => {
        const c = new Date(hoy.getFullYear(), hoy.getMonth() + dm, n);
        if (c.getDate() !== n) return;
        if (!mejor || Math.abs(c - hoy) < Math.abs(mejor - hoy)) mejor = c;
    });
    return mejor || hoy;
}

function stuFechaLarga(f) {
    return `${String(f.getDate()).padStart(2, "0")} DE ${STU_MESES_LARGO[f.getMonth()].toUpperCase()} DE ${f.getFullYear()}`;
}

function stuFechaArchivo(f) {
    return `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, "0")}-${String(f.getDate()).padStart(2, "0")}`;
}

function stuFechaConHora(base, hhmm) {
    const p = String(hhmm || "00:00").split(":");
    const f = new Date(base);
    f.setHours(Number(p[0]) || 0, Number(p[1]) || 0, 0, 0);
    return f;
}

function stuEtiquetaDia(dia) {
    const d = store.days && store.days[dia];
    return (d && d.label) || dia || "";
}

// ----- 7D. DUPLICAR DÍA (Supervisión, Jefatura y Desarrollo) -----
function stuCambiosAMano(dia) {
    const d = store.days && store.days[dia];
    const ds = store.state && store.state[dia];
    if (!d || !ds) return 0;
    const base = tabBaseline();
    let n = 0;
    (d.trips || []).forEach(t => {
        const a = resolveTripAssignment(t, ds, base);
        if (String(a.unit || "") !== String(t.u || "") || String(a.op || "") !== String(t.n || "")) n++;
    });
    return n;
}

function stuAbrirDuplicar() {
    if (!stuPuede("duplicar")) {
        showAggressiveToast("Solo Supervisión, Jefatura y Desarrollo (con su PIN) pueden duplicar días.");
        return;
    }
    const dias = Object.keys(store.days || {});
    if (!dias.length) return showAggressiveToast("Primero sube un rol.");
    const opciones = dias.map(k => `<option value="${escHtml(k)}" ${k === store.currentDay ? "selected" : ""}>${escHtml(stuEtiquetaDia(k))} · ${(store.days[k].trips || []).length} corridas</option>`).join("");
    const manana = new Date();
    manana.setDate(manana.getDate() + 1);
    openSheet(`<div class="eq">
        <h2>Duplicar día</h2>
        <div class="eq-sec">Copiar de</div>
        <select id="dupOrigen" class="input-field" onchange="stuDupResumen()">${opciones}</select>
        <div class="eq-sec">Como el día</div>
        <input type="date" id="dupFecha" class="input-field" value="${stuFechaArchivo(manana)}" onchange="stuDupResumen()">
        <div id="dupResumen"></div>
        <button type="button" class="btn-primary" style="background:var(--navy);" onclick="stuDuplicarDia()">Duplicar</button>
        <button type="button" class="btn-outline" onclick="closeSheet()">Cancelar</button>
      </div>`);
    stuDupResumen();
}

function stuDupDestino() {
    const v = ((document.getElementById("dupFecha") || {}).value || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return null;
    const f = new Date(v + "T00:00:00");
    const label = `${STU_DIAS_SEMANA[f.getDay()]} ${f.getDate()}`;
    return { fecha: v, label: label, key: fbKey(label), f: f };
}

function stuDupResumen() {
    const caja = document.getElementById("dupResumen");
    if (!caja) return;
    const origen = (document.getElementById("dupOrigen") || {}).value;
    const dest = stuDupDestino();
    if (!origen || !dest) {
        caja.innerHTML = "";
        return;
    }
    const n = (store.days[origen].trips || []).filter(t => !t.vx).length;
    const cambios = stuCambiosAMano(origen);
    const existe = store.days[dest.key];
    caja.innerHTML = `<div class="dup-lista">
        <div>✓ Las ${n} corridas del rol de ${escHtml(stuEtiquetaDia(origen))}</div>
        <div>✓ ${cambios} cambio${cambios === 1 ? "" : "s"} a mano (unidad y operador), marcados como <span class="flag-copia">Cambio a mano copiado del ${escHtml(stuEtiquetaDia(origen).toLowerCase())}</span></div>
        <div class="no">✗ Salidas marcadas, empalmes resueltos y estados del personal: empiezan limpios</div>
      </div>
      <div class="eq-nota">Se creará <b>${escHtml(dest.label)}</b> (${dest.f.getDate()}/${STU_MESES_CORTO[dest.f.getMonth()]}/${dest.f.getFullYear()}).</div>
      ${existe ? `<div class="eq-nota eq-ojo">Ya existe «${escHtml(dest.label)}». Si continúas, se reemplaza con la copia.</div>` : ""}
      ${dest.key === origen ? `<div class="eq-nota eq-ojo">Elige una fecha distinta al día que vas a copiar.</div>` : ""}`;
}

function stuDuplicarDia() {
    if (!stuPuede("duplicar")) return;
    const origen = (document.getElementById("dupOrigen") || {}).value;
    const dest = stuDupDestino();
    if (!origen || !dest || !store.days[origen]) return showAggressiveToast("Elige el día y la fecha.");
    if (dest.key === origen) return showAggressiveToast("Elige una fecha distinta al día que vas a copiar.");
    const dOrig = store.days[origen];
    const sOrig = store.state && store.state[origen] ? store.state[origen] : {};
    const base = tabBaseline();
    const mapaIds = {};
    const copiados = {};
    const trips = (dOrig.trips || []).filter(t => !t.vx).map((t, i) => { // 4.4: las vueltas extra son de su día
        const nuevo = JSON.parse(JSON.stringify(t));
        nuevo.id = "d_" + dest.key + "_" + i;
        mapaIds[t.id] = nuevo.id;
        const a = resolveTripAssignment(t, sOrig, base);
        if (String(a.unit || "") !== String(t.u || "") || String(a.op || "") !== String(t.n || "")) copiados[nuevo.id] = true;
        return nuevo;
    });
    const copiaDia = JSON.parse(JSON.stringify(dOrig));
    copiaDia.trips = trips;
    copiaDia.label = dest.label;
    copiaDia.key = dest.label;
    copiaDia.fecha = dest.fecha;
    copiaDia.copiadoDe = stuEtiquetaDia(origen);
    const remap = obj => {
        const out = {};
        Object.keys(obj || {}).forEach(k => {
            if (mapaIds[k]) out[mapaIds[k]] = obj[k];
        });
        return out;
    };
    const estado = {
        trips: {},
        unitOverride: JSON.parse(JSON.stringify(sOrig.unitOverride || {})),
        opOverride: JSON.parse(JSON.stringify(sOrig.opOverride || {})),
        tripUnitOverride: remap(sOrig.tripUnitOverride),
        tripOpOverride: remap(sOrig.tripOpOverride),
        unitChanges: [],
        resolvedOverlaps: [],
        resolvedMissing: [],
        copiados: copiados,
        copiadoDe: stuEtiquetaDia(origen)
    };
    store.days[dest.key] = copiaDia;
    store.state = store.state || {};
    store.state[dest.key] = estado;
    // Todos los días cargados, en orden de fecha (para que "desde este día" funcione igual con la copia)
    const orden = Array.from(new Set((Array.isArray(store.diasOrden) ? store.diasOrden : Object.values(store.diasOrden || {})).concat(Object.keys(store.days))))
        .filter(k => store.days[k]);
    orden.sort((a, b) => stuFechaDeDia(a) - stuFechaDeDia(b));
    store.diasOrden = orden;
    const diaAntes = store.currentDay;
    registrarEnHistorial({
        tripTime: "Todo el día",
        route: "Duplicar día",
        scope: `${stuEtiquetaDia(origen)} copiado como ${dest.label} · ${trips.length} corridas · ${Object.keys(copiados).length} cambios a mano`,
        reason: "Duplicar día",
        type: "Rol"
    });
    store.currentDay = dest.key;
    savePatch({
        ["days/" + dest.key]: copiaDia,
        ["state/" + dest.key]: estado,
        diasOrden: orden,
        currentDay: dest.key,
        globalHistory: store.globalHistory
    });
    closeSheet();
    showAggressiveToast(`${stuEtiquetaDia(diaAntes) || "El día"} quedó copiado como ${dest.label}.`);
    window.render();
}

const STU_GRUPOS_PERSONAL = [
    { id: "falta", titulo: "Ausentismo", estados: ["Falta"], color: "#D52B2B", bg: "#FDE2E2", pill: "FALTA" },
    { id: "prestamo", titulo: "Préstamos", estados: ["Préstamo"], color: "#0052CC", bg: "#E6EEFB" },
    { id: "vacaciones", titulo: "Vacaciones", estados: ["Vacaciones"], color: "#0B1A30", bg: "#E6EEFB" },
    { id: "incapacidad", titulo: "Incapacidad", estados: ["Incapacidad"], color: "#E11D2E", bg: "#FDE2E2" },
    { id: "permiso", titulo: "Permisos y capacitación", estados: ["Permiso", "Capacitación"], color: "#6B4226", bg: "#EADCCB" }
];

function stuPlantilla() {
    const vistos = new Set();
    const lista = [];
    Object.keys(store.operadoresDB || {}).forEach(clave => {
        const n = store.operadoresDB[clave];
        if (!n || vistos.has(n)) return;
        vistos.add(n);
        const m = getOpMeta(n, clave);
        if (m.esBaja || m.esTurismo) return;
        lista.push({ nombre: n, clave: clave });
    });
    return lista;
}

function stuIndicadoresPersonal() {
    const plantilla = stuPlantilla();
    const grupos = STU_GRUPOS_PERSONAL.map(g => Object.assign({ nombres: [] }, g));
    plantilla.forEach(p => {
        const r = getReasonForEntity(p.nombre) || getReasonForEntity(p.clave);
        const g = grupos.find(x => x.estados.includes(r));
        if (g) g.nombres.push(p.nombre);
    });
    grupos.forEach(g => g.nombres.sort((a, b) => a.localeCompare(b, "es")));
    const fuera = grupos.reduce((s, g) => s + g.nombres.length, 0);
    const hc = plantilla.length;
    const asistencia = Math.max(0, hc - fuera);
    return { hc: hc, asistencia: asistencia, pct: hc ? (asistencia * 100) / hc : 0, grupos: grupos };
}

function stuAFecha(v) {
    if (v === null || v === undefined || v === "") return null;
    if (v instanceof Date) return isNaN(v) ? null : v;
    if (typeof v === "number" && isFinite(v) && v > 20000 && v < 80000) {
        return new Date(Math.round((v - 25569) * 864e5) + new Date().getTimezoneOffset() * 60000);
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
    if (m) {
        const y = Number(m[3]) < 100 ? 2000 + Number(m[3]) : Number(m[3]);
        return new Date(y, Number(m[2]) - 1, Number(m[1]), Number(m[4] || 0), Number(m[5] || 0));
    }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4] || 0), Number(m[5] || 0));
    return null;
}

function stuFechaCorta(f, conHora) {
    if (!f) return "";
    const t = `${String(f.getDate()).padStart(2, "0")}/${String(f.getMonth() + 1).padStart(2, "0")}/${f.getFullYear()}`;
    return conHora ? `${t} ${String(f.getHours()).padStart(2, "0")}:${String(f.getMinutes()).padStart(2, "0")}` : t;
}

// Unidades en taller con todo lo que se sabe de cada una (seguimiento, Flota y folios)
function stuIndicadoresTaller() {
    const corte = stuFechaDeDia(store.currentDay);
    const ds = getDayState();
    const base = tabBaseline();
    const trips = (store.days[store.currentDay] && store.days[store.currentDay].trips) || [];
    const corridasPorUnidad = {};
    trips.forEach(t => {
        const a = resolveTripAssignment(t, ds, base);
        if (a.unit) corridasPorUnidad[a.unit] = (corridasPorUnidad[a.unit] || 0) + 1;
    });
    const info = store.tallerInfo || {};
    return FLOTA_FIJA.filter(f => isUnidadEnTallerOInhabil(String(f.u))).map(f => {
        const u = String(f.u);
        const ev = stuEventoUnidad(u);
        const i = info[u] || {};
        const texto = String((store.tallerDB || {})[u] || "");
        const partes = texto.split(" · ");
        let estatus = i.estatus || (ev ? ev.estado : partes[0]) || "Taller";
        let motivo = i.falla || (ev ? ev.motivo : partes.slice(1).join(" · ")) || getMotivoUnidad(u) || "";
        let ingreso = stuAFecha(i.ingreso);
        if (!ingreso && ev) ingreso = stuFechaDeDia(ev.desde);
        if (!ingreso && store.tallerDesde && store.tallerDesde[u]) ingreso = stuAFecha(store.tallerDesde[u]);
        const dias = ingreso ? Math.max(1, Math.round((new Date(corte.getFullYear(), corte.getMonth(), corte.getDate()) - new Date(ingreso.getFullYear(), ingreso.getMonth(), ingreso.getDate())) / 864e5) || 1) : null;
        const estF = stuAFecha(estatus);
        if (estF) estatus = "Fecha de entrega " + stuFechaCorta(estF, true);
        return {
            u: u,
            placa: f.p || "",
            ingreso: ingreso,
            motivo: motivo,
            estatus: String(estatus).toUpperCase(),
            comentario: i.comentario || "",
            ubicacion: i.ubicacion || "",
            dias: dias,
            corridas: corridasPorUnidad[u] || 0,
            origen: ev ? "Flota (" + (ev.por || "cambio a mano") + ")" : "Seguimiento"
        };
    }).sort((a, b) => (b.corridas > 0) - (a.corridas > 0) || (b.dias || 0) - (a.dias || 0));
}

function stuKpisDia() {
    const trips = (store.days[store.currentDay] && store.days[store.currentDay].trips) || [];
    let salieron = 0, terminal = 0;
    trips.forEach(t => {
        const s = getTripState(t.id);
        if (s.status === "formado") salieron++;
        else if (s.status === "en_terminal") terminal++;
    });
    const personal = stuIndicadoresPersonal();
    const noDisp = personal.grupos.reduce((s, g) => s + g.nombres.length, 0);
    const delDia = getGlobalHistory().filter(h => h && h.day === store.currentDay && h.type !== "Rol");
    const porArea = {};
    delDia.forEach(h => {
        const a = String(h.por || "Sin registrar").split(" · ")[0];
        porArea[a] = (porArea[a] || 0) + 1;
    });
    return {
        corridas: trips.length,
        salieron: salieron,
        terminal: terminal,
        pendientes: trips.length - salieron - terminal,
        incidencias: (globalAlertsData || []).length,
        taller: FLOTA_FIJA.filter(f => isUnidadEnTallerOInhabil(String(f.u))).length,
        noDisponibles: noDisp,
        folios: stuFoliosDelDia().length,
        cambios: delDia.length,
        porArea: porArea,
        personal: personal
    };
}

// --- Excel con el formato de tu archivo de puntualidad: 1 fila de encabezados, datos desde la fila 2 ---
const XL_FECHA_HORA = "dd/mmm/yyyy hh:mm";
const XL_FECHA = "dd/mmm/yyyy";

function stuHojaPlana(encabezados, filas, anchos) {
    const ws = XLSX.utils.aoa_to_sheet([encabezados].concat(filas), { cellDates: true });
    const rango = XLSX.utils.decode_range(ws["!ref"] || "A1");
    for (let r = 1; r <= rango.e.r; r++) {
        for (let c = 0; c <= rango.e.c; c++) {
            const cel = ws[XLSX.utils.encode_cell({ r: r, c: c })];
            if (cel && cel.t === "d") {
                const v = cel.v;
                cel.z = v && (v.getHours() || v.getMinutes()) ? XL_FECHA_HORA : XL_FECHA;
            }
        }
    }
    ws["!cols"] = (anchos || []).map(w => ({ wch: w }));
    ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(0, rango.e.r), c: rango.e.c } }) };
    return ws;
}

function stuTipoRuta(o, d) {
    const a = normLoc(o), b = normLoc(d);
    if ((a === "CU" || a === "CU2") && (b === "CU" || b === "CU2")) return "INTERNA";
    return b === "CU" || b === "CU2" ? "ENTRADA" : "SALIDA";
}

function stuClaveDe(nombre, pista) {
    if (!nombre) return "";
    const k = Object.keys(store.operadoresDB || {}).find(c => store.operadoresDB[c] === nombre);
    return k || pista || "";

function stuFilasRolDia() {
    const corte = stuFechaDeDia(store.currentDay);
    const ds = getDayState();
    const base = tabBaseline();
    const folios = stuUnidadesConFolio();
    const empalmados = new Set();
    (globalCollisions || []).forEach(c => {
        empalmados.add(c.t1.id);
        empalmados.add(c.t2.id);
    });
    const trips = ((store.days[store.currentDay] && store.days[store.currentDay].trips) || []).slice().sort((a, b) => a.h.localeCompare(b.h));
    return trips.map(t => {
        const a = resolveTripAssignment(t, ds, base);
        const st = getTripState(t.id);
        const ini = stuFechaConHora(corte, t.h);
        const fin = new Date(ini.getTime() + getTripDuration(t) * 60000);
        const cambio = String(a.unit || "") !== String(t.u || "") || String(a.op || "") !== String(t.n || "");
        const obs = [];
        if (a.unit && isUnidadEnTallerOInhabil(a.unit)) obs.push("Unidad en taller: " + getMotivoUnidad(a.unit));
        if (!a.op) obs.push(a.pendiente ? "Operador pendiente" : "Sin operador");
        if (!a.unit) obs.push("Sin unidad");
        if (empalmados.has(t.id)) obs.push("Empalme");
        const seg = stuSeguimientoDice(t, a, base);
        if (seg) obs.push("Seguimiento dice: " + nombreBonito(seg));
        if (t.vx) {
            const xv = vxPorId(t.vxId);
            obs.unshift("Vuelta extra" + (xv ? ` · ${xv.motivo || ""} · creó ${xv.por || ""}` : ""));
        }
        if (a.unit && folios[a.unit]) obs.push("Folio " + FOLIO_TIPOS[folios[a.unit].tipo].nombre.toLowerCase() + (folios[a.unit].folio ? " " + folios[a.unit].folio : ""));
        let detalle = "";
        if (cambio) {
            const h = getGlobalHistory().slice().reverse().find(x => x && x.day === store.currentDay && (x.tripId === t.id || String(x.scope || "").includes(t.h)) && (String(x.newUnit) === String(a.unit) || x.newOp === a.op));
            detalle = h ? `${h.reason || "Cambio"} · ${h.por || "Sin registrar"} · ${fechaHora24(h.time || h.changeAt || Date.now()).slice(-5)}` : "";
            if (ds.copiados && ds.copiados[t.id]) detalle = (detalle ? detalle + " · " : "") + "Cambio a mano copiado del " + String(ds.copiadoDe || "").toLowerCase();
        }
        const estatus = st.status === "formado" ? "Salió" : st.status === "en_terminal" ? "En terminal" : st.hidden ? "Oculta" : "Pendiente";
        return {
            t: t, a: a, ini: ini, fin: fin, cambio: cambio, detalle: detalle, obs: obs.join(" · "), estatus: estatus
        };
    });
}

function stuFilasFlota() {
    const ds = getDayState();
    const base = tabBaseline();
    const trips = (store.days[store.currentDay] && store.days[store.currentDay].trips) || [];
    const porOp = {}, opDeUnidad = {};
    trips.forEach(t => {
        const a = resolveTripAssignment(t, ds, base);
        if (a.op) (porOp[a.op] = porOp[a.op] || []).push(t);
        if (a.unit && a.op && !opDeUnidad[a.unit]) opDeUnidad[a.unit] = a.op;
    });
    const filas = [];
    const usados = new Set();
    FLOTA_FIJA.forEach(f => {
        const u = String(f.u);
        const op = opDeUnidad[u] || base[u] || "";
        if (op) usados.add(op);
        const m = getOpMeta(op);
        const est = isUnidadEnTallerOInhabil(u) ? "Unidad en taller: " + getMotivoUnidad(u) : op ? (m.esTurismo ? "Apoyo Turismo" : m.esBaja ? "Baja" : getReasonForEntity(op) || "Activo") : "Sin operador";
        filas.push([u, stuClaveDe(op), op ? nombreBonito(op) : "", est, m.puntualidad === null ? "" : m.puntualidad, op ? window.stuContarVueltas(porOp[op] || []) : "", m.telEmpresa || "", m.telPersonal || ""]);
    });
    stuPlantilla().forEach(p => {
        if (usados.has(p.nombre)) return;
        const m = getOpMeta(p.nombre, p.clave);
        filas.push(["", p.clave, nombreBonito(p.nombre), getReasonForEntity(p.nombre) || "Sin unidad", m.puntualidad === null ? "" : m.puntualidad, window.stuContarVueltas(porOp[p.nombre] || []), m.telEmpresa || "", m.telPersonal || ""]);
    });
    return filas;
}

let stuLaminaFuentes = null;

function stuCargarFuentesLamina() {

        try {
            if (!document.getElementById("stuFuentesLamina")) {

                l.rel = "stylesheet";

                document.head.appendChild(l);
            }
            const espera = Promise.all([
                document.fonts.load("800 60px Montserrat"),
                document.fonts.load("700 30px 'Open Sans'"),
                document.fonts.load("400 30px 'Open Sans'")
            ]);
            Promise.race([espera, new Promise(r => setTimeout(r, 2500))]).then(() => resolve(true), () => resolve(false));
        } catch (e) {
            resolve(false);
        }
    });
    return stuLaminaFuentes;
}

function stuCargarLogoEr() {
    if (stuLogoEr) return stuLogoEr;

const LAM_TIT = "800 {s}px Montserrat, 'Inter', Arial, sans-serif";
const LAM_TXT = "{w} {s}px 'Open Sans', 'Inter', Arial, sans-serif";
function lamFuente(tipo, s, w) {
    return (tipo === "t" ? LAM_TIT : LAM_TXT).replace("{s}", s).replace("{w}", w || 400);
}

function lamCaja(ctx, x, y, w, h, r, relleno, borde) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (relleno) {
        ctx.fillStyle = relleno;
        ctx.fill();
    }
    if (borde) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = borde;
        ctx.stroke();
    }
}

function lamTexto(ctx, txt, x, y, fuente, color, opciones) {
    const o = opciones || {};
    ctx.font = fuente;
    ctx.fillStyle = color;
    ctx.textAlign = o.align || "left";
    ctx.textBaseline = o.base || "alphabetic";
    if ("letterSpacing" in ctx) ctx.letterSpacing = (o.esp || 0) + "px";
    ctx.fillText(txt, x, y);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    return ctx.measureText(txt).width;
}

// Texto que se acomoda en varias líneas; devuelve la altura usada
function lamParrafo(ctx, txt, x, y, ancho, alto, fuente, color, maxLineas, align) {
    ctx.font = fuente;
    const palabras = String(txt || "").split(/\s+/);
    const lineas = [];
    let actual = "";
    palabras.forEach(p => {
        const prueba = actual ? actual + " " + p : p;
        if (ctx.measureText(prueba).width > ancho && actual) {
            lineas.push(actual);
            actual = p;
        } else actual = prueba;
    });
    if (actual) lineas.push(actual);
    let usar = lineas;
    if (maxLineas && lineas.length > maxLineas) {
        usar = lineas.slice(0, maxLineas);
        let ult = usar[maxLineas - 1];
        while (ctx.measureText(ult + "…").width > ancho && ult.length) ult = ult.slice(0, -1);
        usar[maxLineas - 1] = ult + "…";
    }
    ctx.fillStyle = color;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "alphabetic";
    usar.forEach((l, i) => ctx.fillText(l, align === "center" ? x + ancho / 2 : x, y + i * alto));
    return usar.length * alto;
}

function lamPastilla(ctx, txt, x, y, fondo, color, s) {
    ctx.font = lamFuente("x", s || 21, 700);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "1px";
    const w = ctx.measureText(txt).width + 56;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    const h = (s || 21) * 2.4;
    lamCaja(ctx, x, y, w, h, h / 2, fondo);
    lamTexto(ctx, txt, x + 28, y + h / 2 + 1, lamFuente("x", s || 21, 700), color, { base: "middle", esp: 1 });
    return w;
}

function lamIcono(ctx, nombre, cx, cy, r, fondo, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = fondo;
    ctx.fill();
    const p = { prestamo: "M17 3l4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3", vacaciones: "M12 22V10M12 10c-2-4-6-5-9-3 3 0 6 1 9 3zM12 10c2-4 6-5 9-3-3 0-6 1-9 3zM4 22h16", incapacidad: "M12 2.8a3.2 3.2 0 1 1 0 6.4 3.2 3.2 0 1 1 0-6.4zM5 21v-3a7 7 0 0 1 14 0v3M10 15h4M12 13v4", llave: "M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z", choque: "M7 14l1.2-4.2A2 2 0 0 1 10.1 8.4h6.8a2 2 0 0 1 1.9 1.4L20 14v5h-3v-1H10v1H7zM2 3l2.5 3.5L3 9l3.2-1L7 11l1-3.6 3 .2-2.6-2 1.4-2.8-3 1.3z", permiso: "M8 2v4M16 2v4M3 8h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2zM8 14l3 3 5-5", extra: "M12 3a9 9 0 1 1 0 18 9 9 0 1 1 0-18zM12 8v8M8 12h8" }[nombre];
    if (!p || !window.Path2D) return;
    ctx.save();
    const esc = (r * 1.1) / 24;
    ctx.translate(cx - 12 * esc, cy - 12 * esc);
    ctx.scale(esc, esc);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (nombre === "llave" || nombre === "choque") {
        ctx.fillStyle = color;
        ctx.fill(new window.Path2D(p));
    } else ctx.stroke(new window.Path2D(p));
    ctx.restore();
}

function lamLista(ctx, nombres, x, y, ancho, alto, tam) {
    if (!nombres.length) return;
    const partir = (txt, t) => {
        ctx.font = lamFuente("x", t, 700);
        const palabras = String(txt).toUpperCase().split(/\s+/);
        const lineas = [];
        let actual = "";
        palabras.forEach(p => {
            const prueba = actual ? actual + " " + p : p;
            if (ctx.measureText(prueba).width > ancho - 24 && actual) {
                lineas.push(actual);
                actual = p;
            } else actual = prueba;
        });
        if (actual) lineas.push(actual);
        return lineas.slice(0, 2);
    };
    const medir = (t, lista) => lista.reduce((h, n) => h + partir(n, t).length * t * 1.22 + t * 0.32, 0);
    let t = tam;
    while (medir(t, nombres) > alto && t > 15) t -= 1;
    let lista = nombres;
    if (medir(t, lista) > alto) {
        lista = nombres.slice();
        while (lista.length > 1 && medir(t, lista) + t * 1.5 > alto) lista.pop();
    }
    let yy = y + t;
    lista.forEach(n => {
        const lineas = partir(n, t);
        ctx.fillStyle = LAM.navy;
        ctx.beginPath();
        ctx.arc(x + 4, yy - t * 0.35, Math.max(2.5, t / 7), 0, Math.PI * 2);
        ctx.fill();
        lineas.forEach((l, i) => {
            let txt = l;
            ctx.font = lamFuente("x", t, 700);
            while (ctx.measureText(txt).width > ancho - 22 && txt.length > 3) txt = txt.slice(0, -1);
            lamTexto(ctx, txt + (txt.length < l.length ? "…" : ""), x + 20, yy + i * t * 1.22, lamFuente("x", t, 700), LAM.navy);
        });
        yy += lineas.length * t * 1.22 + t * 0.32;
    });
    if (lista.length < nombres.length) lamTexto(ctx, `+ ${nombres.length - lista.length} más`, x + 20, yy, lamFuente("x", t, 700), LAM.azul);
}

// Arma las láminas (una o varias páginas) y devuelve los canvas
async function stuArmarLaminas(cuales) {
    await stuCargarFuentesLamina();
    const logo = await stuCargarLogoEr();
    const hojas = [];
    const nueva = () => {
        const cv = document.createElement("canvas");
        cv.width = LAM.W;
        cv.height = LAM.H;
        hojas.push(cv);
        return cv.getContext("2d");
    };
    if (cuales.includes("personal")) {
        const ctx = nueva();
        lamDibujarPersonal(ctx, logo, hojas.length);
    }
    if (cuales.includes("taller")) {
        const filas = stuIndicadoresTaller();
        const porHoja = 6;
        const partes = Math.max(1, Math.ceil(filas.length / porHoja));
        for (let i = 0; i < partes; i++) {
            const ctx = nueva();
            lamDibujarTaller(ctx, logo, hojas.length, filas.slice(i * porHoja, (i + 1) * porHoja), filas.length, partes > 1 ? `${i + 1} de ${partes}` : "");
        }
    }
    if (cuales.includes("siniestros")) {
        const lista = stuFoliosDelDia().filter(f => f.tipo === "siniestro").sort((a, b) => (a.ts || 0) - (b.ts || 0));
        const porHoja = 4;
        const partes = Math.max(1, Math.ceil(lista.length / porHoja));
        for (let i = 0; i < partes; i++) {
            const ctx = nueva();
            lamDibujarSiniestros(ctx, logo, hojas.length, lista.slice(i * porHoja, (i + 1) * porHoja), lista.length, partes > 1 ? `${i + 1} de ${partes}` : "");
        }
    }
    return hojas;
}

function stuDescargarBlob(blob, nombre) {
    const a = document.createElement("a");

// PDF sencillo: cada lámina es una página con su imagen JPEG (sin librerías externas)
function stuPdfDeImagenes(jpegs) {
    const enc = new TextEncoder();
    const partes = [];
    const offsets = [];
    let largo = 0;
    const agregar = d => {
        const b = typeof d === "string" ? enc.encode(d) : d;
        partes.push(b);
        largo += b.length;
    };
    const objeto = (n, cuerpo, flujo) => {
        offsets[n] = largo;
        agregar(`${n} 0 obj\n${cuerpo}\n`);
        if (flujo) {
            agregar("stream\n");
            agregar(flujo);
            agregar("\nendstream\n");
        }
        agregar("endobj\n");
    };
    agregar("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    const n = jpegs.length;
    const kids = [];
    for (let i = 0; i < n; i++) kids.push(`${3 + i * 3} 0 R`);
    objeto(1, "<< /Type /Catalog /Pages 2 0 R >>");
    objeto(2, `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${n} >>`);
    jpegs.forEach((j, i) => {
        const pag = 3 + i * 3, img = pag + 1, cont = pag + 2;
        const W = 960, H = 540;
        objeto(pag, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${img} 0 R >> >> /Contents ${cont} 0 R >>`);
        objeto(img, `<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.bytes.length} >>`, j.bytes);
        const dib = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
        objeto(cont, `<< /Length ${dib.length} >>`, dib);
    });
    const total = 3 + n * 3;
    const xref = largo;
    let tabla = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let k = 1; k < total; k++) tabla += String(offsets[k]).padStart(10, "0") + " 00000 n \n";
    agregar(tabla);
    agregar(`trailer\n<< /Size ${total} /Root 1 0 R /Info << /Title (Reporte STU BUAP) /Author (Ing. German Perez Hernandez) >> >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(partes, { type: "application/pdf" });
}

async function stuLaminasPdf() {
    showAggressiveToast("Armando el PDF…");
    try {
        const hojas = await stuArmarLaminas(["personal", "taller", "siniestros"]);
        const jpegs = [];
        for (const cv of hojas) {
            const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
            jpegs.push({ w: cv.width, h: cv.height, bytes: new Uint8Array(await blob.arrayBuffer()) });
        }
        stuDescargarBlob(stuPdfDeImagenes(jpegs), stuNombreArchivoDia("Reporte_STU", "pdf"));
    } catch (e) {
        showAggressiveToast("No se pudo armar el PDF: " + e.message);
    }
}

// ----- 7I. VUELTAS EXTRA (4.4) -----
// Vueltas que no están en el rol ni en el seguimiento. Viven en su propio nodo de la nube
// (operaciones_v6_extras), nunca dentro del rol: subir archivos no las borra.
// En memoria se agregan a las corridas de su día (t.vx = true) para que cuenten en
// empalmes, disponibilidad, tablero y reportes como cualquier corrida.
const VX_COLOR = "#0E7C86";
const VX_MOTIVOS = ["Evento", "Demanda", "Apoyo", "Traslado", "Otro"];
const VX_DIAS_VIGENCIA = 45;
const VX_HORAS_SIN_VER = 36;
let stuExtras = {};
let stuNubeExtras = null;
let stuExtrasVer = 1;
let stuExtrasConocidos = null; // id -> versión conocida
let VXB = null; // borrador del formulario

function stuPuedeExtras() {
    return !!stuAreaVerificada();
}

function vxLista() {
    return Object.values(stuExtras || {}).filter(x => x && x.id && x.h);
}

function vxDeDia(dia) {
    const k = fbKey(dia || store.currentDay || "");
    return vxLista().filter(x => fbKey(x.dia || "") === k);
}

function vxPorId(id) {
    return (stuExtras || {})[id] || null;
}

function vxTripId(id) {
    return "vx_" + id;
}

// ----- Mezcla en memoria con las corridas del rol (no se guarda dentro del rol) -----
function vxMezclar() {
    const dias = store.days || {};
    Object.keys(dias).forEach(k => {
        const dia = dias[k];
        if (!dia || !Array.isArray(dia.trips)) return;
        if (dia.trips._vxVer === stuExtrasVer) return;
        const base = dia.trips.filter(t => !(t && t.vx));
        const mias = vxDeDia(k).filter(x => !x.cancelada).sort((a, b) => String(a.h).localeCompare(String(b.h)));
        mias.forEach(x => {
            const t = { id: vxTripId(x.id), h: x.h, o: x.o, d: x.d, u: String(x.u || ""), k: String(x.k || ""), n: x.n || "", vx: true, vxId: x.id };
            if (x.min) t.vxMin = Number(x.min);
            // Se pone después de la última corrida con la misma hora o antes (sin reordenar el rol)
            let pos = base.length;
            for (let i = 0; i < base.length; i++) {
                if (String(base[i].h) > String(x.h)) {
                    pos = i;
                    break;
                }
            }
            base.splice(pos, 0, t);
        });
        Object.defineProperty(base, "_vxVer", { value: stuExtrasVer, enumerable: false, writable: true });
        dia.trips = base;
    });
}

// Saca las vueltas extra mientras se guarda el rol (nube y caché) y las regresa al terminar
function vxSinExtras(fn) {
    const quitadas = [];
    Object.keys(store.days || {}).forEach(k => {
        const d = store.days[k];
        if (d && Array.isArray(d.trips) && d.trips.some(t => t && t.vx)) {
            quitadas.push([d, d.trips]);
            d.trips = d.trips.filter(t => !(t && t.vx));
        }
    });
    try {
        return fn();
    } finally {
        quitadas.forEach(([d, a]) => (d.trips = a));
    }
}

// ----- Vistas (Enterado) en este equipo -----
function vxVistos() {
    if (window._vxVistos) return window._vxVistos;
    let arr = [];
    try {
        arr = JSON.parse(localStorage.getItem("stu_extras_vistos") || "[]");
    } catch (e) {}
    window._vxVistos = new Set(Array.isArray(arr) ? arr : []);
    return window._vxVistos;
}

function vxMarcarVisto(id) {
    const s = vxVistos();
    s.add(String(id));
    try {
        localStorage.setItem("stu_extras_vistos", JSON.stringify(Array.from(s).slice(-600)));
    } catch (e) {}
}

function vxSinVer() {
    const vistos = vxVistos();
    const limite = Date.now() - VX_HORAS_SIN_VER * 3600 * 1000;
    return vxLista()
        .filter(x => !x.cancelada && !vistos.has(String(x.id)) && Number(x.ts || 0) >= limite)
        .sort((a, b) => Number(b.ts || 0) - Number(a.ts || 0));
}

function vxGuardarCache() {
    try {
        localStorage.setItem("stu_extras_cache", JSON.stringify(stuExtras));
    } catch (e) {}
}

function vxCargarCache() {
    try {
        const c = JSON.parse(localStorage.getItem("stu_extras_cache") || "null");
        if (c && typeof c === "object") stuExtras = c;
    } catch (e) {}
    stuExtrasVer++;
}

// ----- Sonido propio: campanita de 3 tonos que sube -----
function vxSonido() {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [784, 988, 1319].forEach((f, i) => {
            const t0 = ctx.currentTime + i * 0.19;
            [[f, "sine", 0.32], [f * 2, "triangle", 0.07]].forEach(([fr, tipo, vol]) => {
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = tipo;
                osc.frequency.setValueAtTime(fr, t0);
                g.gain.setValueAtTime(0.0001, t0);
                g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i === 2 ? 0.9 : 0.45));
                osc.connect(g);
                g.connect(ctx.destination);
                osc.start(t0);
                osc.stop(t0 + (i === 2 ? 0.95 : 0.5));
            });
        });
        setTimeout(() => {
            try {
                ctx.close();
            } catch (e) {}
        }, 1800);
    } catch (e) {}
}

function vxTextoCorto(x) {
    return `${x.h} · ${formatRouteName(x.o, x.d)}`;
}

function vxAvisarNueva(x) {
    try {
        vxSonido();
        if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 450]);
        mostrarGloboSistema("Vuelta extra · " + vxTextoCorto(x), `U-${x.u} · ${nombreBonito(x.n)} · ${x.motivo || ""}`, "extra_" + x.id);
    } catch (e) {}
}

function vxAvisarCambio(x) {
    try {
        playAlertSound(false);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        const que = x.cancelada ? "Vuelta extra cancelada" : "Vuelta extra modificada";

        if (!document.hidden) showAggressiveToast(`${que}: ${vxTextoCorto(x)}${x.cancelada && x.canceladaMotivo ? " (" + x.canceladaMotivo + ")" : ""}.`);
    } catch (e) {}
}

// ----- Llegan de la nube -----
function vxLlegaron(val) {
    stuExtras = val && typeof val === "object" ? val : {};
    vxGuardarCache();
    const ids = Object.keys(stuExtras);
    if (stuExtrasConocidos === null) {
        stuExtrasConocidos = {};
        ids.forEach(id => (stuExtrasConocidos[id] = Number((stuExtras[id] || {}).v || 1)));
    } else {
        const vistos = vxVistos();
        ids.forEach(id => {
            const x = stuExtras[id];
            if (!x) return;
            const v = Number(x.v || 1);
            if (!(id in stuExtrasConocidos)) {
                stuExtrasConocidos[id] = v;
                if (!x.cancelada && !vistos.has(String(id))) vxAvisarNueva(x);
            } else if (v > stuExtrasConocidos[id]) {
                stuExtrasConocidos[id] = v;
                if (x.porEquipo !== stuDeviceId()) vxAvisarCambio(x);
            }
        });
    }
    vxRefrescar();
}

function vxRefrescar() {
    stuExtrasVer++;
    vxPintarFranja();
    try {
        actualizarAvisosRojos();
        refrescarCampanas(true);
    } catch (e) {}
    window.render();
}

function vxIniciarNube() {
    try {
        if (typeof firebase === "undefined" || !firebase.database) return;
        stuNubeExtras = firebase.database().ref("operaciones_v6_extras");
        stuNubeExtras
            .orderByChild("ts")
            .startAt(Date.now() - VX_DIAS_VIGENCIA * 864e5)
            .on("value", snap => vxLlegaron(snap.val()));
    } catch (e) {
        console.error("Nube vueltas extra:", e);
    }
}

async function vxSubir(x) {
    stuExtras[x.id] = x;
    if (stuExtrasConocidos) stuExtrasConocidos[x.id] = Number(x.v || 1);
    vxGuardarCache();
    if (!stuNubeExtras) return false;
    await stuNubeExtras.child(x.id).set(JSON.parse(JSON.stringify(x)));
    return true;
}

// ----- Franja turquesa en todas las pantallas hasta Enterado -----
function vxPintarFranja() {
    const el = document.getElementById("franjaExtra");
    if (!el) return;
    const lista = vxSinVer();

        el.hidden = true;
        el.innerHTML = "";

        <small>${escHtml([nombreBonito(x.n), x.motivo, x.por].filter(Boolean).join(" · "))}${lista.length > 1 ? ` · +${lista.length - 1} más` : ""}</small></div>
      <button type="button" class="franja-btn" onclick="vxVerFicha('${tabAttr(x.id)}')">Ver</button>
      <button type="button" class="franja-btn vx-ent" onclick="vxEnterado('${tabAttr(x.id)}')">Enterado</button>`;
}

function vxEnterado(id) {

function vxTarjeta(x, conEnterado) {

        ${x.cancelada && x.canceladaMotivo ? `<div class="vx-card-det"><small>Motivo de cancelación: ${escHtml(x.canceladaMotivo)}</small></div>` : ""}

        }</div>

}

function vxHtmlLista() {
    const sinVer = vxSinVer();
    const idsSinVer = new Set(sinVer.map(x => x.id));
    const delDia = vxDeDia().filter(x => !idsSinVer.has(x.id)).sort((a, b) => (a.cancelada ? 1 : 0) - (b.cancelada ? 1 : 0) || String(a.h).localeCompare(String(b.h)));
    const crear = stuPuedeExtras() ? `<button type="button" class="vx-crear-campana" onclick="vxAbrirNueva()">+ Nueva vuelta extra</button>` : "";
    if (!sinVer.length && !delDia.length) return crear + `<div class="camp-vacio">No hay vueltas extra en este día.</div>`;
    return crear + sinVer.map(x => vxTarjeta(x, true)).join("") + delDia.map(x => vxTarjeta(x, true)).join("");
}

// ----- Rutas que ya conoce la app (rol de todos los días + extras escritas antes) -----
function vxRutasConocidas() {
    const mapa = {};
    Object.keys(store.days || {}).forEach(k => {
        const dia = store.days[k];
        (dia && Array.isArray(dia.trips) ? dia.trips : []).forEach(t => {
            if (!t || t.vx || !t.o || !t.d) return;
            const key = normLoc(t.o) + "|" + normLoc(t.d);
            const r = mapa[key] || (mapa[key] = { o: t.o, d: t.d, hoy: 0, total: 0 });
            r.total++;
            if (k === store.currentDay) r.hoy++;
        });
    });
    vxLista().forEach(x => {
        const key = normLoc(x.o) + "|" + normLoc(x.d);
        if (!mapa[key]) mapa[key] = { o: x.o, d: x.d, hoy: 0, total: 0, escrita: true, min: x.min || 0 };
    });
    return Object.values(mapa).sort((a, b) => b.hoy - a.hoy || b.total - a.total);
}

function vxNombresActivos() {
    const claves = {};
    Object.keys(store.operadoresDB || {}).forEach(k => {
        const n = store.operadoresDB[k];
        if (n && !claves[n]) claves[n] = k;
    });
    return Object.keys(claves).filter(n => isOperadorActivo(n)).map(n => ({ n: n, k: claves[n] }));
}

function vxResolverOp(txt) {
    const q = smartNorm(txt || "");
    if (!q) return null;
    const lista = vxNombresActivos();
    const exacto = lista.find(o => smartNorm(o.n) === q || smartNorm(nombreBonito(o.n)) === q || String(o.k) === String(txt).trim());
    if (exacto) return exacto;
    const parecidos = lista.filter(o => q.split(" ").every(p => smartNorm(o.n).indexOf(p) !== -1));
    return parecidos.length === 1 ? parecidos[0] : null;
}

function vxHoraValida(h) {
    const m = String(h || "").trim().match(/^(\d{1,2}):?(\d{2})$/);
    if (!m) return "";
    const hh = Number(m[1]), mm = Number(m[2]);
    if (hh > 23 || mm > 59) return "";
    return String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}

function vxDuracion(b) {
    if (b.min) return Number(b.min);
    return getTripDuration({ o: b.o, d: b.d }) || 0;
}

function vxRutaBuscar(txt) {
    const cont = document.getElementById("vxRutaLista");
    if (!cont) return;
    const q = smartNorm(txt || "");
    if (VXB && VXB.o && !VXB.buscando && txt === formatRouteName(VXB.o, VXB.d)) {
        cont.innerHTML = "";
        return;
    }
    if (VXB) {
        VXB.buscando = true;
        if (!VXB.otra) {
            VXB.o = "";
            VXB.d = "";
        }
    }
    const inp = document.getElementById("vxRuta");
    if (inp) inp.classList.remove("ok");
    const rutas = vxRutasConocidas().filter(r => !q || q.split(" ").every(p => smartNorm(formatRouteName(r.o, r.d)).indexOf(p) !== -1)).slice(0, q ? 8 : 5);
    cont.innerHTML = `<div class="vx-lista">${rutas

function vxHoraCambio(inp) {
    let v = String(inp.value || "").replace(/[^\d:]/g, "");
    if (/^\d{3,4}$/.test(v)) v = v.padStart(4, "0").slice(0, 2) + ":" + v.padStart(4, "0").slice(2);
    if (v !== inp.value && /^\d{2}:\d{2}$/.test(v)) inp.value = v;
    const h = vxHoraValida(inp.value);
    VXB.h = h;
    inp.classList.toggle("ok", !!h);
    if (h) vxSugerencias();
    vxRevisarPintar();
}

// Unidades y operadores libres a la hora de la vuelta
function vxSugerencias() {
    if (!VXB) return;
    const ref = hhmmToMins(VXB.h || minsToHhmm(new Date().getHours() * 60 + new Date().getMinutes()));
    let occ;
    try {
        occ = calcularEstadoFlotaYVentanas(ref);
    } catch (e) {
        occ = { opWindows: [], unitToOp: {} };
    }
    const cu = document.getElementById("vxUnidadChips");
    if (cu) {
        const q = VXB.u;
        const enUso = occ.unitToOp || {};
        const lista = FLOTA_FIJA.map(f => String(f.u))
            .filter(u => !isUnidadEnTallerOInhabil(u))
            .filter(u => (q ? u.indexOf(q) !== -1 : !enUso[u]))
            .sort((a, b) => (enUso[a] ? 1 : 0) - (enUso[b] ? 1 : 0))
            .slice(0, 6);
        cu.innerHTML = lista.map(u => `<button type="button" class="vx-chip ${u === VXB.u ? "on" : ""}" onclick="vxElegirUnidad('${u}')">${u}<small>${enUso[u] ? "la trae " + escHtml(nombreBonito(enUso[u]).split(" ")[0]) : "libre"}</small></button>`).join("");
    }
    const co = document.getElementById("vxOperadorChips");
    if (co) {
        const ventanas = {};
        (occ.opWindows || []).forEach(w => (ventanas[w.nombre] = w));
        const q = smartNorm(VXB.opTexto || "");
        let lista;
        if (q && !VXB.n) {
            lista = vxNombresActivos().filter(o => q.split(" ").every(p => smartNorm(o.n + " " + o.k).indexOf(p) !== -1)).map(o => o.n);
        } else {
            lista = (occ.opWindows || []).filter(w => w.freeNow && isOperadorActivo(w.nombre)).map(w => w.nombre);
        }
        const peso = n => {
            const w = ventanas[n];
            if (!w) return 3;
            if (w.freeNow && (!w.trips || !w.trips.length)) return 0;
            return w.freeNow ? 1 : 2;
        };
        lista = Array.from(new Set(lista)).sort((a, b) => peso(a) - peso(b)).slice(0, 6);
        if (VXB.n && !lista.includes(VXB.n)) lista.unshift(VXB.n);
        co.innerHTML = lista
            .map(n => {
                const w = ventanas[n];
                const tag = !w ? "" : w.freeNow && (!w.trips || !w.trips.length) ? "guardia" : w.freeNow ? "libre hasta " + w.winTo : "en ruta";
                return `<button type="button" class="vx-chip ${n === VXB.n ? "on" : ""}" onclick="vxElegirOp(decodeURIComponent('${tabAttr(n)}'))">${escHtml(nombreBonito(n))}${tag ? `<small>${escHtml(tag)}</small>` : ""}</button>`;
            })
            .join("");
    }
}

// Revisa empalmes del operador y de la unidad contra sus corridas del día
function vxRevisar(b) {
    const msgs = [];
    const ini = hhmmToMins(b.h);
    const dur = vxDuracion(b);
    const fin = ini + dur;
    const ds = getDayState();
    const base = tabBaseline();
    const trips = asgTrips().filter(t => !(b.id && t.id === vxTripId(b.id)));
    const choques = (quien, campo) => {
        const igual = campo === "op" ? (a1, b1) => normTextKey(a1) === normTextKey(b1) : (a1, b1) => String(a1) === String(b1);
        const mias = trips.map(t => ({ t: t, a: resolveTripAssignment(t, ds, base) })).filter(x => quien && x.a[campo] && igual(x.a[campo], quien));
        mias.forEach(({ t }) => {
            const ts = hhmmToMins(t.h);
            const te = ts + getTripDuration(t);
            if (te <= ini) {
                const llega = te + getEmptyTravelTime(t.d, b.o);
                if (llega > ini) msgs.push(`${campo === "op" ? nombreBonito(quien).split(" ")[0] : "U-" + quien} termina ${t.h} ${formatRouteName(t.o, t.d)} y llega a ${tituloBonito(normLoc(b.o))} a las ${minsToHhmm(llega)}.`);
            } else if (ts >= fin) {
                const llega = fin + getEmptyTravelTime(b.d, t.o);
                if (llega > ts) msgs.push(`${campo === "op" ? nombreBonito(quien).split(" ")[0] : "U-" + quien} sale ${t.h} de ${tituloBonito(normLoc(t.o))} y esta vuelta termina ${minsToHhmm(fin)} en ${tituloBonito(normLoc(b.d))}.`);
            } else {
                msgs.push(`${campo === "op" ? nombreBonito(quien).split(" ")[0] : "U-" + quien} va en ${t.h} ${formatRouteName(t.o, t.d)} a esa hora.`);
            }
        });
    };
    if (b.n) choques(b.n, "op");
    if (b.u) choques(b.u, "unit");
    if (b.u && isUnidadEnTallerOInhabil(b.u)) msgs.push(`U-${b.u} está en taller: ${getMotivoUnidad(b.u) || "detenida"}.`);
    const estado = b.n ? getReasonForEntity(b.n) : "";
    if (estado) msgs.push(`${nombreBonito(b.n).split(" ")[0]} está marcado como ${estado} hoy.`);
    return { msgs: Array.from(new Set(msgs)), fin: fin, dur: dur };
}

function vxFaltantes() {
    const f = [];
    if (!VXB.o || !VXB.d) f.push("ruta");
    if (VXB.otra && !(Number(VXB.min) >= 5 && Number(VXB.min) <= 300)) f.push("minutos de la vuelta");
    if (!vxHoraValida(VXB.h)) f.push("hora");
    if (!VXB.u) f.push("unidad");
    if (!VXB.n) f.push("operador");
    if (!VXB.motivo || (VXB.motivo === "Otro" && !String(VXB.motivoOtro || "").trim())) f.push("motivo");
    return f;
}

function vxRevisarPintar() {
    const caja = document.getElementById("vxRevision");
    if (!caja || !VXB) return;
    const falta = vxFaltantes();
    const btn = document.getElementById("vxGuardar");
    if (btn) btn.classList.toggle("apagado", falta.length > 0);
    if (falta.includes("ruta") || falta.includes("hora") || (!VXB.n && !VXB.u)) {
        caja.innerHTML = falta.length ? `<div class="vx-revisa gris">Falta: ${escHtml(falta.join(", "))}.</div>` : "";
        return;
    }
    const r = vxRevisar(VXB);
    const llegada = `Termina ${minsToHhmm(r.fin)} aprox. en ${tituloBonito(normLoc(VXB.d))} (${r.dur} min).`;
    caja.innerHTML = r.msgs.length
        ? `<div class="vx-revisa mal">⚠ ${r.msgs.map(escHtml).join("<br>⚠ ")}<br><small>${escHtml(llegada)} Puedes crearla de todos modos: quedará en Por resolver.</small></div>`
        : `<div class="vx-revisa">✓ Sin empalmes. ${escHtml(llegada)}</div>`;
    if (falta.length) caja.innerHTML += `<div class="vx-revisa gris">Falta: ${escHtml(falta.join(", "))}.</div>`;
}

async function vxGuardar() {
    if (!VXB || !stuPuedeExtras()) return;
    const falta = vxFaltantes();
    if (falta.length) return showAggressiveToast("Falta: " + falta.join(", ") + ".");
    if (!FLOTA_FIJA.some(f => String(f.u) === String(VXB.u)) && !confirm(`La unidad ${VXB.u} no está en la flota. ¿Usarla de todos modos?`)) return;
    const antes = VXB.id ? vxPorId(VXB.id) : null;
    const motivo = VXB.motivo === "Otro" ? String(VXB.motivoOtro).trim() : VXB.motivo;
    const id = antes ? antes.id : (stuNubeExtras ? stuNubeExtras.push().key : "") || "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const x = Object.assign({}, antes || {}, {
        id: id,
        dia: antes ? antes.dia : store.currentDay,
        h: vxHoraValida(VXB.h),
        o: VXB.o,
        d: VXB.d,
        u: String(VXB.u),
        k: String(VXB.k || ""),
        n: VXB.n,
        motivo: motivo,
        v: antes ? Number(antes.v || 1) + 1 : 1,
        porEquipo: stuDeviceId()
    });
    if (VXB.otra && VXB.min) x.min = Number(VXB.min);
    else delete x.min;
    if (antes) {
        x.editadaPor = stuQuienSoy();
        x.editadaTs = Date.now();
    } else {
        x.ts = Date.now();
        x.por = stuQuienSoy();
    }
    vxMarcarVisto(id);
    const btn = document.getElementById("vxGuardar");
    if (btn) {
        btn.disabled = true;
        btn.textContent = "Guardando…";
    }
    let enNube = false;
    try {
        enNube = await vxSubir(x);
    } catch (e) {
        showAggressiveToast("No se pudo subir la vuelta extra: " + (e.message || e));
    }
    vxHistorial(x, antes ? "Vuelta extra modificada" : "Vuelta extra", antes);
    closeSheet();
    vxRefrescar();
    showAggressiveToast(
        (antes ? "Vuelta extra modificada: " : "Vuelta extra creada: ") + `${vxTextoCorto(x)} · U-${x.u}. ` + (enNube ? "Ya se avisó a todos." : "Sin conexión: quedó en este equipo y se enviará al reconectar.")
    );
}

function vxHistorial(x, titulo, antes) {
    try {
        const tripId = vxTripId(x.id);
        registrarEnHistorial({
            day: x.dia,
            tripTime: x.h,
            clave: x.k || "—",
            route: formatRouteName(x.o, x.d),
            scope: "Vuelta extra (no está en el rol)",
            viajes: [x.h + "|" + formatRouteName(x.o, x.d)],
            tripId: tripId,
            oldUnit: antes ? antes.u || "S/U" : "Extra",
            newUnit: x.cancelada ? "Cancelada" : x.u,
            oldOp: antes ? antes.n || "Sin Asignar" : "Vuelta extra",
            newOp: x.cancelada ? "Cancelada" : x.n,
            reason: titulo + " · " + (x.cancelada ? x.canceladaMotivo || "" : x.motivo || ""),
            type: "Extra"
        });
        const ds = getDayState();
        const dKey = fbKey(store.currentDay);
        savePatch({ [`state/${dKey}/unitChanges`]: ds.unitChanges, globalHistory: store.globalHistory });
    } catch (e) {
        console.error("Historial vuelta extra:", e);
    }
}

// ----- Ficha de la vuelta extra -----
function vxVerFicha(id) {
    const x = vxPorId(id);
    if (!x) return showAggressiveToast("Esa vuelta extra ya no existe.");
    const dur = vxDuracion(x);
    const fin = hhmmToMins(x.h) + dur;
    const ent = Object.values(x.enterados || {}).map(e => e && e.q).filter(Boolean);
    const visto = vxVistos().has(String(x.id));
    const puede = stuPuedeExtras();
    const dia = store.days && store.days[x.dia];
    const st = getTripState(vxTripId(x.id));
    const estatus = x.cancelada ? "Cancelada" : st.status === "formado" ? "Salió" : st.status === "en_terminal" ? "En terminal" : "Pendiente";
    openSheet(`<div class="vx-hoja vx-ficha-hoja"><div class="vx-ficha ${x.cancelada ? "cancelada" : ""}">
        <div class="cab"><span class="vx-tag blanco">VUELTA EXTRA${x.cancelada ? " · CANCELADA" : ""}</span><b class="mono">${escHtml(vxTextoCorto(x))}</b><small>${escHtml(dia ? dia.label || x.dia : x.dia || "")} · no está en el rol</small></div>
        <dl>
          <dt>Unidad</dt><dd class="mono">${escHtml(x.u)}</dd>
          <dt>Operador</dt><dd>${escHtml(nombreBonito(x.n))}${x.k ? ` <small>· ${escHtml(x.k)}</small>` : ""}</dd>
          <dt>Motivo</dt><dd>${escHtml(x.motivo || "")}</dd>
          <dt>Llega aprox.</dt><dd class="mono">${escHtml(minsToHhmm(fin))} a ${escHtml(tituloBonito(normLoc(x.d)))} <small>(${dur} min)</small></dd>
          <dt>Estatus</dt><dd>${escHtml(estatus)}</dd>
          <dt>Creó</dt><dd>${escHtml(x.por || "")}${x.ts ? ", " + escHtml(fechaHora24(x.ts).slice(-5)) : ""}</dd>
          ${x.editadaPor ? `<dt>Cambió</dt><dd>${escHtml(x.editadaPor)}, ${escHtml(fechaHora24(x.editadaTs || Date.now()).slice(-5))}</dd>` : ""}
          ${x.cancelada ? `<dt>Canceló</dt><dd>${escHtml(x.canceladaPor || "")} · ${escHtml(x.canceladaMotivo || "")}</dd>` : ""}
          <dt>Enterados</dt><dd>${ent.length ? escHtml(ent.join(", ")) : "<small>Nadie todavía</small>"}</dd>
        </dl></div>
        ${!x.cancelada && !visto ? `<button type="button" class="vx-btn" onclick="vxEnterado('${tabAttr(x.id)}')">Enterado</button>` : ""}
        ${!x.cancelada && puede ? `<button type="button" class="${visto ? "vx-btn" : "vx-btn2"}" onclick="vxAbrirNueva('${tabAttr(x.id)}')">Cambiar ruta, hora, unidad u operador</button>` : ""}
        ${x.n ? `<button type="button" class="vx-btn2" onclick="stuAbrirFichaOperador(decodeURIComponent('${tabAttr(x.n)}'), decodeURIComponent('${tabAttr(x.k || "")}'), decodeURIComponent('${tabAttr(x.u || "")}'))">Ficha del operador (llamar)</button>` : ""}
        ${!x.cancelada && puede ? `<button type="button" class="vx-cancel" onclick="vxPedirCancelar('${tabAttr(x.id)}')">Cancelar vuelta extra</button>` : ""}
        <button type="button" class="vx-btn2" onclick="closeSheet()">Cerrar</button>
      </div>`);
}

function vxPedirCancelar(id) {
    const x = vxPorId(id);
    if (!x) return;
    openSheet(`<div class="vx-hoja">
        <h2><i>×</i>Cancelar vuelta extra</h2>
        <p class="eq-nota"><b>${escHtml(vxTextoCorto(x))}</b> · U-${escHtml(x.u)} · ${escHtml(nombreBonito(x.n))}</p>
        <div class="vx-campo"><label>Motivo de la cancelación <b>*</b></label>
          <textarea id="vxCancelMotivo" class="vx-in" rows="3" maxlength="140" placeholder="Ej. el evento se suspendió"></textarea></div>
        <button type="button" class="vx-cancel fuerte" onclick="vxCancelar('${tabAttr(id)}')">Cancelar la vuelta y avisar a todos</button>
        <button type="button" class="vx-btn2" onclick="vxVerFicha('${tabAttr(id)}')">Regresar</button>
      </div>`);
    setTimeout(() => {
        const t = document.getElementById("vxCancelMotivo");
        if (t) t.focus();
    }, 150);
}

async function vxCancelar(id) {
    const x0 = vxPorId(id);
    if (!x0 || !stuPuedeExtras()) return;
    const motivo = String((document.getElementById("vxCancelMotivo") || {}).value || "").trim();
    if (!motivo) return showAggressiveToast("Escribe el motivo de la cancelación.");
    const x = Object.assign({}, x0, {
        cancelada: true,
        canceladaPor: stuQuienSoy(),
        canceladaMotivo: motivo,
        canceladaTs: Date.now(),
        v: Number(x0.v || 1) + 1,
        porEquipo: stuDeviceId()
    });
    let enNube = false;
    try {
        enNube = await vxSubir(x);
    } catch (e) {
        showAggressiveToast("No se pudo cancelar en la nube: " + (e.message || e));
    }
    vxHistorial(x, "Vuelta extra cancelada", x0);
    closeSheet();
    vxRefrescar();
    showAggressiveToast(`Vuelta extra cancelada: ${vxTextoCorto(x)}. ` + (enNube ? "Ya se avisó a todos." : "Sin conexión: se enviará al reconectar."));
}

// ----- Botones para crear (celular y computadora) -----
function vxPintarBotones() {
    document.body.classList.toggle("puede-extras", stuPuedeExtras());
}

// ----- Para la lámina de Headcount e Incidencias -----
function vxGrupoLamina() {
    const lista = vxDeDia().filter(x => !x.cancelada).sort((a, b) => String(a.h).localeCompare(String(b.h)));
    return { id: "extras", titulo: "Vueltas extra", nombres: lista.map(x => `${x.h} ${formatRouteName(x.o, x.d)}`) };
}


// =============================================================================
// PARTE 3 · ARRANQUE DE LA APP (todo lo que pasa al abrirla, en orden)
// =============================================================================
function aplicarModoPantallaGuardado() {
    // Arranca en modo teléfono, salvo que el usuario haya elegido modo computadora
    if (localStorage.getItem("stu_force_pc_view") !== "1") {
        document.body.classList.remove("pc-view");
        document.body.classList.add("mobile-forced");
    } else {
        document.body.classList.remove("mobile-forced");
        document.body.classList.add("pc-view");
    }
}

function iniciarApp() {
    aplicarModoPantallaGuardado();
    stuAccesoCargarCache();
    stuFoliosCargarCache();
    vxCargarCache(); // 4.4: vueltas extra guardadas en este equipo
    stuSincronizarEstadosCriticos();
    smartCargarGuardado();

    updateClock();

    setInterval(updateClock, 1000);

    if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission().catch(() => {});
    }

    document.getElementById("overlay").addEventListener("click", function(e){
        if(e.target.id === "overlay") closeSheet();
    });

    setInterval(actualizarUrgenciaVisual, 15000);

    // Cada 30 s: las corridas con paloma se van a Ocultas 2 min después de su salida
    let minutoVisto = -1;
    setInterval(function () {
        try {
            const m = new Date().getHours() * 60 + new Date().getMinutes();
            if (m === minutoVisto || document.hidden) return;
            minutoVisto = m;
            if (activeView !== "activas" && activeView !== "ocultas") return;
            const ov = document.getElementById("overlay");
            if (ov && ov.classList.contains("show")) return;
            dibujarVista();
        } catch (e) {}
    }, 30000);

    // La curva de la barra de abajo se acomoda si cambia el tamaño de la pantalla
    window.addEventListener("resize", function () {
        clearTimeout(window._navResize);
        window._navResize = setTimeout(moverCurvaNav, 120);
    });

    document.getElementById("btnOrigen").addEventListener("click", function(){
        let trips = (store.days[store.currentDay] && store.days[store.currentDay].trips) ? store.days[store.currentDay].trips : [];
        let unique = uniqueSorted(trips, "o");
        let top = [], rest = [];
        unique.forEach(o => { if(o === "CU" || o === "CU2") top.push(o); else rest.push(o); });
        crearFiltroSheet("📍 Punto de inicio", top.concat(rest), activeOrigin, v => { activeOrigin = v; render(); });
    });

    document.getElementById("btnDestino").addEventListener("click", function(){
        let trips = (store.days[store.currentDay] && store.days[store.currentDay].trips) ? store.days[store.currentDay].trips : [];
        let unique = uniqueSorted(trips, "d");
        let top = [], rest = [];
        unique.forEach(o => { if(o === "CU" || o === "CU2") top.push(o); else rest.push(o); });
        crearFiltroSheet("🚩 Punto final", top.concat(rest), activeDest, v => { activeDest = v; render(); });
    });

    document.getElementById('search').addEventListener('input', e => {
        if (searchDebounce) clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
            searchTerm = e.target.value.trim().toLowerCase();
            render();
        }, 120);
    });

    document.getElementById("fileAsignacion").addEventListener("change", e => handleExcel(e.target.files[0], 'asignacion', e.target));

    document.getElementById("fileSeguimiento").addEventListener("change", e => handleExcel(e.target.files[0], 'seguimiento', e.target));

    if (loadLocalCache()) {
        setSyncStatus(false, "Caché listo", true);
        render();
    }

    initFirebaseConnection();
    stuPintarFranjaFolio();
    vxPintarFranja();
    stuPintarAutoria();

    // Al tocar un globo de aviso del sistema se abre la campana
    if ('serviceWorker' in navigator && !esApk()) {
        navigator.serviceWorker.addEventListener('message', ev => {
            if (ev.data && ev.data.tipo === 'abrir-campana') abrirCampana(0);
        });
    }

    // En la APK la app ya viene instalada dentro del teléfono: no hace falta el service worker
    if ('serviceWorker' in navigator && !esApk()) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.update();
            }).catch(() => {});
        });
    }

    // Recordar qué secciones dejaste abiertas aunque la pantalla se actualice
    document.addEventListener(
        "toggle",
        function (ev) {
            const el = ev.target;
            if (el && el.classList && el.classList.contains("tb-sec") && el.dataset.sec) {
                window._stuTabAbiertos[el.dataset.sec] = el.open;
            }
        },
        true
    );

    // Actualizar el tablero cada minuto cuando se ve "Ahora" (sin interrumpir si hay una ventana abierta)
    setInterval(function () {
        try {
            if (document.hidden) return;
            if (activeView !== "tablero" || dashSelectedBlock !== "LIVE") return;
            const ov = document.getElementById("overlay");
            if (ov && ov.classList.contains("show")) return;
            window.renderTablero();
        } catch (e) {}
    }, 60000);

    // Si la app vuelve a primer plano y aún no conectó, reintenta de inmediato
    document.addEventListener("visibilitychange", function () {
        if (!document.hidden && !fbYaConectado) {
            fbIntentosSDK = 0;
            window.initFirebaseConnection();
        }
    });

    registrarAvisoVersionNueva();
    prepararBotonAtrasAndroid();
    iniciarNotificacionesPush();
    cambiarVista("activas");
    requestAnimationFrame(moverCurvaNav);
    setTimeout(moverCurvaNav, 400);
}

iniciarApp();
</script>
</body>
</html>
