    let nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    let refMin = dashSelectedBlock === "LIVE" ? nowMin : hhmmToMins(dashSelectedBlock);
    let refLabel = dashSelectedBlock === "LIVE" ? `Tiempo Real (${minsToHhmm(nowMin)})` : `Simulación Bloque ${dashSelectedBlock}`;

    let { opWindows, freeUnits, tallerUnits } = calcularEstadoFlotaYVentanas(refMin);

    let blockTrips = allTrips.filter(t => {
        let tm = hhmmToMins(t.h);
        return tm >= refMin - 5 && tm <= refMin + 60;
    });
    let foraneasInBlock = blockTrips.filter(t => isForaneaTrip(t));
    let guardiasLibres = opWindows.filter(w => w.isGuardia && w.freeNow);
    let opsConVentana = opWindows.filter(w => !w.isGuardia && w.freeNow);

    if (searchTerm) {
        let st = searchTerm.toLowerCase();
        opWindows = opWindows.filter(w => (w.nombre + " " + w.unidad + " " + w.ubicacion + " " + w.statusLabel).toLowerCase().includes(st));
        foraneasInBlock = foraneasInBlock.filter(t => {
            let asg = resolveTripAssignment(t, ds, baselineOp);
            return (t.o + " " + t.d + " " + asg.unit + " " + asg.op + " " + t.h).toLowerCase().includes(st);
        });
    }

    opWindows.sort((a, b) => {
        if (a.freeNow !== b.freeNow) return a.freeNow ? -1 : 1;
        if (a.isGuardia !== b.isGuardia) return a.isGuardia ? -1 : 1;
        return b.freeMins - a.freeMins;
    });

    let blocks = [
        { id: "LIVE", label: `🟢 Ahora (${minsToHhmm(nowMin)})` },
        { id: "05:30", label: "🌅 05:30 Arranque" },
        { id: "06:00", label: "🛡️ 06:00 Con Guardias" },
        { id: "06:30", label: "🚨 06:30 Sin Guardias" },
        { id: "07:00", label: "🕖 07:00 Pico Mañana" },
        { id: "08:00", label: "🕗 08:00" },
        { id: "13:00", label: "🕐 13:00 Tarde" }
    ];

    let pillsHtml = blocks.map(b => `<button type="button" class="block-pill ${dashSelectedBlock===b.id?'active':''}" onclick="seleccionarBloqueTablero('${b.id}')">${b.label}</button>`).join('');

    let foraneasHtml = foraneasInBlock.length ? foraneasInBlock.map(t => {
        let st = getTripState(t.id);
        let asg = resolveTripAssignment(t, ds, baselineOp);
        let uTaller = isUnidadEnTallerOInhabil(asg.unit);
        let opInact = Boolean(asg.op && !isOperadorActivo(asg.op));
        let missing = !asg.unit || !asg.op || uTaller || opInact;
        let statusBadge = st.status === "formado"
            ? `<span style="background:var(--done-bg);color:var(--done);padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;">✓ Formado</span>`
            : (st.status === "en_terminal"
                ? `<span style="background:#e0f2fe;color:var(--accent);padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;">🏠 En Terminal</span>`
                : `<span style="background:var(--pend-bg);color:var(--pend);padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;">⏳ Pendiente</span>`);

        let safeId = encodeURIComponent(t.id);
        let safeU = encodeURIComponent(asg.unit);
        let safeOp = encodeURIComponent(asg.op);
        let safeK = encodeURIComponent(t.k || t.n || '');

        return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1.5px solid ${missing?'var(--bad)':'var(--line)'};background:${missing?'#fff0f0':'var(--surface)'};border-radius:12px;margin-bottom:8px;cursor:pointer;" onclick="abrirModalDesdePendientes(decodeURIComponent('${safeId}'), decodeURIComponent('${safeU}'), decodeURIComponent('${safeOp}'), decodeURIComponent('${safeK}'))">
            <div>
                <span class="mono" style="font-weight:800;font-size:15px;color:var(--accent);">${t.h}</span>
                <b style="font-size:14px;margin-left:6px;">${formatRouteName(t.o, t.d)}</b>
                <div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px;">
                    <b>${asg.unit ? 'U-'+asg.unit : '🚨 S/U'}${uTaller ? ' (🔧 Taller)' : ''}</b> · ${asg.op || '🚨 Sin Operador'} ${asg.op ? renderPuntualidadBadge(asg.op) : ''}
                </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
                ${statusBadge}
                <span style="font-size:11.5px;color:var(--accent);font-weight:800;">⚡ Cubrir</span>
            </div>
        </div>`;
    }).join('') : `<div style="padding:12px;text-align:center;color:gray;font-size:13.5px;">No hay salidas foráneas en los próximos 60 min de este bloque.</div>`;

    let trsDisponibles = opWindows.map(w => {
        let rowClass = w.isGuardia ? "row-disp" : (w.freeNow ? "row-ok" : "row-warn");
        return `
        <tr class="${rowClass}">
            <td><b>${w.nombre}</b> ${renderPuntualidadBadge(w.nombre)}${w.isGuardia ? ' <span style="font-size:10px;background:#00509d;color:white;padding:1px 5px;border-radius:4px;">GUARDIA/APOYO</span>' : ''}</td>
            <td class="mono" style="font-weight:800;">${w.unidad ? 'U-'+w.unidad : 'S/U'}</td>
            <td><b style="color:${w.freeNow?'var(--done)':'var(--pend)'};">${w.winFrom} a ${w.winTo}</b><br><small style="color:var(--ink-soft);">${w.statusLabel}</small></td>
            <td><b>${w.ubicacion}</b><br><small style="color:var(--ink-soft);">Sig: ${w.proxima}</small></td>
        </tr>`;
    }).join('');

    let freeUnitsBadges = freeUnits.length
        ? freeUnits.map(f => `<span style="display:inline-block;background:var(--done-bg);color:var(--done);font-weight:800;font-size:12.5px;padding:5px 9px;border-radius:7px;margin:3px;">U-${f.u}</span>`).join('')
        : `<span style="font-size:13px;color:gray;">Todas las unidades habilitadas tienen operador asignado.</span>`;

    let tallerUnitsBadges = tallerUnits.length
        ? tallerUnits.map(t => `<span style="display:inline-block;background:var(--bad-bg);color:var(--bad);font-weight:800;font-size:12.5px;padding:5px 9px;border-radius:7px;margin:3px;">🔧 U-${t.u} (${t.motivo})</span>`).join('')
        : `<span style="font-size:13px;color:gray;">Sin unidades registradas en Taller.</span>`;

    let html = `
    <div class="dash-wrap">
        <div>
            <div style="font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;">
                🕐 BLOQUE DE MONITOREO (Excluye unidades en Taller, Bajas/Calif. 0 y Apoyo de Turismo):
            </div>
            <div class="dash-block-bar">${pillsHtml}</div>
        </div>

        <div class="dash-kpi-grid">
            <div class="kpi-card" style="border-left:5px solid var(--accent);">
                <div class="kpi-num" style="color:var(--accent);">${ guardiasLibres.length }</div>
                <div class="kpi-label">🛡️ Guardias Activos Libres</div>
            </div>
            <div class="kpi-card" style="border-left:5px solid var(--done);">
                <div class="kpi-num" style="color:var(--done);">${ opsConVentana.length }</div>
                <div class="kpi-label">🟢 Ops con Ventana Libre</div>
            </div>
            <div class="kpi-card" style="border-left:5px solid var(--pend);">
                <div class="kpi-num" style="color:var(--pend);">${ freeUnits.length }</div>
                <div class="kpi-label">🚌 Unidades Libres Reales</div>
            </div>
            <div class="kpi-card" style="border-left:5px solid var(--bad);" onclick="cambiarVista('flota', document.querySelector('[data-view=flota]'))">
                <div class="kpi-num" style="color:var(--bad);">${ tallerUnits.length }</div>
                <div class="kpi-label">🔧 Unidades en Taller</div>
            </div>
        </div>

        <div class="dash-box">
            <h3>
                <span>🛣️ Monitor de Rutas Foráneas (${refLabel})</span>
                <span style="font-size:12px;color:var(--ink-soft);font-weight:600;">Toca para cubrir</span>
            </h3>
            <div style="max-height:280px;overflow-y:auto;">${foraneasHtml}</div>
        </div>

        <div class="dash-box">
            <h3><span>⏱️ Disponibilidad: ¿De qué hora a qué hora están libres?</span></h3>
            <div class="table-container" style="max-height:400px;overflow-y:auto;">
                <table class="excel-table">
                    <thead>
                        <tr>
                            <th>Operador (Punt. AS)</th>
                            <th>Unidad</th>
                            <th>Disponible (De HH:MM a HH:MM)</th>
                            <th>Ubicación / Siguiente</th>
                        </tr>
                    </thead>
                    <tbody>${trsDisponibles}</tbody>
                </table>
            </div>
        </div>

        <div class="dash-box">
            <h3><span>🚌 Unidades Libres en Patio (Descontando Hoja de Taller)</span></h3>
            <div>${freeUnitsBadges}</div>
        </div>

        <div class="dash-box">
            <h3><span>🔧 Unidades Detectadas en Taller (${tallerUnits.length})</span></h3>
            <div>${tallerUnitsBadges}</div>
        </div>
    </div>`;

    document.getElementById("list").innerHTML = html;
}

function render() {
    if(!store.days || !store.days[store.currentDay]) {
        document.getElementById("dayLabel").innerHTML = "Sin datos cargados <span>▼</span>";
        document.getElementById("btnOrigen").innerHTML = ICO.pin + '<span>' + (activeOrigin ? activeOrigin : 'Origen') + '</span>';
        document.getElementById("btnDestino").innerHTML = ICO.flag + '<span>' + (activeDest ? activeDest : 'Destino') + '</span>';
        if(activeView === "flota") { renderFlota(); return; }
        if(activeView === "tablero") { renderTablero(); return; }
        document.getElementById("list").innerHTML = `
          <div style="text-align:center;padding:45px 20px;color:var(--ink-soft);">
            <div style="font-size:40px;margin-bottom:10px;">🚍</div>
            <b style="font-size:16px;color:var(--ink);">Sincronizando rol operativo...</b>
            <p style="font-size:14px;">Si ya subiste tus archivos Excel en tu computadora, toca el botón para descargarlos de la nube, o súbelos desde ⚙️ arriba a la derecha.</p>
            <button type="button" class="btn-primary" style="background:var(--accent);max-width:280px;margin:12px auto;" onclick="forzarSincronizacionNube()">🔄 Sincronizar desde la Nube</button>
          </div>`;
        return;
    }
    document.getElementById("dayLabel").innerHTML = (store.days[store.currentDay].label || store.currentDay) + " <span>▼</span>";
    document.getElementById("btnOrigen").innerHTML = ICO.pin + '<span>' + (activeOrigin ? activeOrigin : 'Origen') + '</span>';
    document.getElementById("btnOrigen").classList.toggle("active", !!activeOrigin);
    document.getElementById("btnDestino").innerHTML = ICO.flag + '<span>' + (activeDest ? activeDest : 'Destino') + '</span>';
    document.getElementById("btnDestino").classList.toggle("active", !!activeDest);

    globalCollisions = obtenerEmpalmesRender(); 
    actualizarBadgePendientes(); 

    if(activeView === "flota") { renderFlota(); return; }
    if(activeView === "tablero") { renderTablero(); return; }

    let trips = store.days[store.currentDay].trips || [];
    let nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    let nowTime = new Date().getTime();
    let visible = [];

    let sortedTrips = [...trips];
    let ds = getDayState();
    
    let baselineOp = {};
    if(store.globalFleet) { store.globalFleet.forEach(g => { if(g && g.u && g.n) baselineOp[String(g.u)] = g.n; }); }

    sortedTrips.forEach(t => {
      let state = getTripState(t.id);
      let isHidden = !!state.hidden;
      if (state.status === "formado" && state.formadoAt && (nowTime - state.formadoAt > 300000)) {
          isHidden = true;
      }

      let skip = false;
      let fOrigin = normLoc(t.o);
      let fDest = normLoc(t.d);

      if (activeOrigin && fOrigin !== activeOrigin) skip = true;
      if (activeDest && fDest !== activeDest) skip = true;
      if (onlyForaneas && !isForaneaTrip(t)) skip = true;
      
      let asg = resolveTripAssignment(t, ds, baselineOp);
      let finalUnit = asg.unit;
      let finalOp = asg.op;

      let isDamagedUnit = isUnidadEnTallerOInhabil(finalUnit);
      let isDamagedOp = Boolean(finalOp && !isOperadorActivo(finalOp));

      if (showRevisar) {
          if((!finalUnit) || (!finalOp) || isDamagedUnit || isDamagedOp || globalCollisions.some(c => c.t2Id === t.id)) {}
          else skip = true;
      }

      if (searchTerm){
          let motU = getMotivoUnidad(finalUnit);
          let hay = (t.o+" a "+t.d+" "+(finalOp||"")+" "+(finalUnit||"")+" "+(t.k||"")+" "+motU).toLowerCase();
          if (hay.indexOf(searchTerm) === -1) skip = true;
      }
      
      if(skip) return;
      if(activeView === "activas" && isHidden) return; 
      if(activeView === "ocultas" && !isHidden) return;
      
      t._finalUnit = finalUnit; t._finalOp = finalOp; t._isDamagedU = isDamagedUnit; t._isDamagedOp = isDamagedOp;
      visible.push(t);
    });
    
    if (!visible.length){ document.getElementById("list").innerHTML = "<div style='text-align:center;padding:40px;color:gray;font-weight:600;'>No hay corridas con este filtro</div>"; return; }

    let groupedTrips = {};
    visible.forEach(t => { 
        var h = t.h.slice(0,2); 
        if(!groupedTrips[h]) groupedTrips[h] = []; 
        groupedTrips[h].push(t); 
    });

    let sortedHours = Object.keys(groupedTrips);
    if (activeView === "ocultas") sortedHours.sort((a, b) => Number(b) - Number(a)); 
    else sortedHours.sort((a, b) => Number(a) - Number(b)); 

    var html = "";
    for (let hour of sortedHours) {
        let tripsInHour = groupedTrips[hour];
        if (activeView === "ocultas") tripsInHour.sort((a,b) => b.h.localeCompare(a.h));
        else tripsInHour.sort((a,b) => a.h.localeCompare(b.h));

        let actionBtn = activeView === 'ocultas' ? `<button type="button" class="hour-toggle restore-btn-block" onclick="restaurarBloque('${hour}')">Restaurar bloque</button>` : `<button type="button" class="hour-toggle" onclick="ocultarBloque('${hour}')">Ocultar bloque</button>`;

        html += `<div class="hour-section"><div class="hour-head"><span class="h mono">${hour}:00</span><span class="c">${tripsInHour.length} salida(s)</span>${actionBtn}</div><div class="trip-grid">`;

        tripsInHour.forEach(t => {
            let state = getTripState(t.id);
            let opName = t._finalOp || "Sin asignar"; let unitName = t._finalUnit || "S/U";
            let routeLabel = formatRouteName(t.o, t.d);
            let foraneaBadge = isForaneaTrip(t) ? `<span class="tag-foranea">FORÁNEA</span>` : '';
            
            let isCollision = globalCollisions.some(c => c.t2Id === t.id);
            let isMissingUnit = !t._finalUnit;
            let isMissingOp = !t._finalOp;

            let hm = t.h.split(":"); let diff = (+hm[0])*60 + (+hm[1]) - nowMin; let urgencyClass = "";
            if(state.status !== "formado" && diff >= 0) { if(diff <= 10) urgencyClass = "urgency-10"; else if(diff <= 20) urgencyClass = "urgency-20"; else if(diff <= 30) urgencyClass = "urgency-30"; }

            let extraClasses = `${urgencyClass} ${(t._isDamagedU || t._isDamagedOp) ? 'trip-damaged' : ''} ${isCollision ? 'trip-collision' : ''} ${(isMissingUnit || isMissingOp) ? 'trip-nounit' : ''}`;
            let reasonStr = "";
            if(t._isDamagedU) {
                reasonStr = `Taller: ${getMotivoUnidad(t._finalUnit) || 'Detenida'}`;
            } else if(t._isDamagedOp) {
                let mOp = getOpMeta(t._finalOp);
                if (mOp.esTurismo) reasonStr = "Apoyo Turismo (No activo)";
                else if (mOp.puntualidad === 0) reasonStr = "Puntualidad 0 / Baja";
                else reasonStr = getReasonForEntity(t._finalOp) || "Inactivo";
            }

            let attrK = String(t.k !== null && t.k !== undefined ? t.k : "").replace(/"/g, '&quot;');
            let attrU = String(t._finalUnit || "").replace(/"/g, '&quot;');
            let attrN = String(opName || "").replace(/"/g, '&quot;');
            let attrOrigU = String(t.u || "").replace(/"/g, '&quot;');

            let opMeta = getOpMeta(t._finalOp);
            let hasTel = Boolean(opMeta && (opMeta.telPersonal || opMeta.telEmpresa));
            let safeOpCall = opName.replace(/'/g, "\\'");
            let safeRouteCall = routeLabel.replace(/'/g, "\\'");

            html += `
              <div class="trip status-${state.status} ${extraClasses}" onclick="tapTrip(event, this)" data-id="${t.id}" data-k="${attrK}" data-origu="${attrOrigU}" data-u="${attrU}" data-n="${attrN}" data-time="${t.h}" data-status="${state.status}">
                <div class="trip-time mono">${t.h}</div>
                <div class="trip-main"><div class="trip-route">${routeLabel}${foraneaBadge}</div>
                  <div class="trip-sub"><span class="unit">${unitName}</span><span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; font-weight:700;">${opName}</span>
                      ${t._finalOp ? renderPuntualidadBadge(t._finalOp) : ''}
                      ${reasonStr ? ` <b style="font-size:11px; margin-left:3px;">[${reasonStr}]</b>` : ''}
                      ${isCollision ? ` <span class="collision-warn">¡EMPALME!</span>` : ''}
                      ${(isMissingUnit || isMissingOp) && !reasonStr ? ` <span style="color:var(--bad); font-weight:bold; font-size:11px; margin-left:4px;">(Falta asignación)</span>` : ''}
                  </div>
                </div>
                <div class="trip-actions">
                  ${activeView === 'ocultas' ? 
                    `<button type="button" class="icon-btn restore-btn" aria-label="Restaurar" onclick="toggleStatus('${t.id}', 'restore', event)">${ICO.restore}</button>` : 
                    `
                    <button type="button" class="icon-btn call-btn ${hasTel ? '' : 'no-phone'}" title="Llamar al operador" onclick="contactarOperador(event, 'call', '${safeOpCall}', '${t.h}', '${safeRouteCall}', '${t._finalUnit}')">${ICO.phone}</button>
                    <button type="button" class="icon-btn msg-btn ${hasTel ? '' : 'no-phone'}" title="Mensaje: ¿Estás positivo?" onclick="contactarOperador(event, 'msg', '${safeOpCall}', '${t.h}', '${safeRouteCall}', '${t._finalUnit}')">${ICO.msg}</button>
                    <button type="button" class="icon-btn hide-btn" aria-label="Ocultar" onclick="toggleStatus('${t.id}', 'hide', event)">${ICO.hide}</button>
                    <button type="button" class="icon-btn terminal-btn ${state.status==='en_terminal'?'on':''}" aria-label="En Terminal" onclick="toggleStatus('${t.id}', 'en_terminal', event)">${ICO.terminal}</button>
                    <button type="button" class="icon-btn formado-btn ${state.status==='formado'?'on':''}" aria-label="Formado" onclick="toggleStatus('${t.id}', 'formado', event)">${ICO.formado}</button>
                    `
                  }
                </div>
              </div>`;
        });
        html += `</div></div>`;
    }
    document.getElementById("list").innerHTML = html; actualizarUrgenciaVisual();
}

function actualizarUrgenciaVisual() {
    let nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    document.querySelectorAll(".trip[data-time]").forEach(card => {
      if(card.classList.contains('trip-damaged') || card.classList.contains('trip-collision') || card.classList.contains('trip-nounit')) return;
      card.classList.remove("urgency-30", "urgency-20", "urgency-10");
      if(card.dataset.status === "formado") return;
      let parts = card.dataset.time.split(":"); let diff = (+parts[0]) * 60 + (+parts[1]) - nowMin;
      if(diff >= 0 && diff <= 10) card.classList.add("urgency-10"); else if(diff > 10 && diff <= 20) card.classList.add("urgency-20"); else if(diff > 20 && diff <= 30) card.classList.add("urgency-30");
    });
}
setInterval(actualizarUrgenciaVisual, 15000);

window.toggleStatus = function(id, action, event) {
    if (event) event.stopPropagation();
    let ds = getDayState();
    let dKey = fbKey(store.currentDay);
    let current = Object.assign({}, getTripState(id));

    if (action === "hide") {
        current.hidden = true;
    } else if (action === "restore") {
        current.hidden = false;
        current.formadoAt = null;
        if (current.status === "formado") {
            current.status = "pendiente";
        }
    } else {
        let newStatus = current.status === action ? "pendiente" : action;
        current.status = newStatus;
        current.formadoAt = newStatus === "formado" ? Date.now() : null;
        if (newStatus !== "formado") current.hidden = false;
    }

    ds.trips[id] = current;
    render();
    savePatch({ [`state/${dKey}/trips/${id}`]: current });
};

window.ocultarBloque = function(hour) {
    let ds = getDayState();
    let dKey = fbKey(store.currentDay);
    let patch = {};
    (store.days[store.currentDay].trips || []).forEach(t => {
        if (t.h.slice(0,2) === hour) {
            let st = Object.assign({}, getTripState(t.id), { hidden: true });
            ds.trips[t.id] = st;
            patch[`state/${dKey}/trips/${t.id}`] = st;
        }
    });
    render();
    savePatch(patch);
};

window.restaurarBloque = function(hour) {
    let ds = getDayState();
    let dKey = fbKey(store.currentDay);
    let patch = {};
    (store.days[store.currentDay].trips || []).forEach(t => {
        if (t.h.slice(0,2) === hour) {
            let st = Object.assign({}, getTripState(t.id), { hidden: false, formadoAt: null });
            if (st.status === "formado") st.status = "pendiente";
            ds.trips[t.id] = st;
            patch[`state/${dKey}/trips/${t.id}`] = st;
        }
    });
    render();
    savePatch(patch);
};

window.tapTrip = function(event, card) {
    if(event.target.closest("button")) return;
    openChangeModal(card);
};

function renderFlota() {
    let ds = getDayState();
    let opsMap = {}; if(store.operadoresDB) Object.keys(store.operadoresDB).forEach(k => opsMap[store.operadoresDB[k]] = k);
    let baselineOp = {}; if(store.globalFleet) { store.globalFleet.forEach(g => { if(g && g.u && g.n) baselineOp[String(g.u)] = g.n; }); }

    let allTrips = (store.days[store.currentDay] && store.days[store.currentDay].trips) ? store.days[store.currentDay].trips : [];
    let opsTrips = {};
    (allTrips || []).forEach(t => {
        let asg = resolveTripAssignment(t, ds, baselineOp);
        if(asg.op) { 
            if(!opsTrips[asg.op]) opsTrips[asg.op] = []; 
            opsTrips[asg.op].push(t); 
        }
    });

    function getVueltas(opName) {
        if (!opName) return 0;
        let viajes = opsTrips[opName] || [];
        if(viajes.length === 0) return 0;
        viajes.sort((a,b) => a.h.localeCompare(b.h));
        let vueltas = 0, i = 0;
        while(i < viajes.length) {
            let cur = viajes[i];
            let next = viajes[i+1];
            let co = normLoc(cur.o), cd = normLoc(cur.d);
            if (next) {
                let no = normLoc(next.o), nd = normLoc(next.d);
                if (co === nd && cd === no) { vueltas++; i += 2; continue; }
            }
            vueltas++; i++;
        }
        return vueltas;
    }

    let unitToOp = {}; let opToUnit = {};
    FLOTA_FIJA.forEach(f => {
        let u = String(f.u);
        if (isUnidadEnTallerOInhabil(u)) return;
        let defaultOp = baselineOp[u] || "";
        let overVal = ds.opOverride[fbKey(u)] !== undefined ? ds.opOverride[fbKey(u)] : ds.opOverride[u];
        let op = overVal !== undefined ? (overVal==="VACIO"?"":overVal) : defaultOp;
        if(op && isOperadorActivo(op)) { unitToOp[u] = op; opToUnit[op] = u; }
    });

    if(ds.unitOverride) {
        Object.keys(ds.unitOverride).forEach(opKey => {
            let u = ds.unitOverride[opKey];
            let actualOpName = store.operadoresDB[opKey] || opKey;
            if (u === "VACIO") {
                if(opToUnit[actualOpName]) {
                    let oldU = opToUnit[actualOpName];
                    if(unitToOp[oldU] === actualOpName) delete unitToOp[oldU];
                    delete opToUnit[actualOpName];
                }
            } else if (u && !isUnidadEnTallerOInhabil(u) && isOperadorActivo(actualOpName)) {
                if(opToUnit[actualOpName]) {
                    let oldU = opToUnit[actualOpName];
                    if(unitToOp[oldU] === actualOpName) delete unitToOp[oldU];
                }
                unitToOp[u] = actualOpName; opToUnit[actualOpName] = u;
            }
        });
    }

    let rows = []; let processedUnits = new Set(); let processedOps = new Set();

    FLOTA_FIJA.forEach(f => {
        let u = String(f.u);
        if(!processedUnits.has(u)) {
            let op = unitToOp[u];
            if(op) { rows.push({ u: u, k: opsMap[op]||f.k||"", n: op }); processedUnits.add(u); processedOps.add(op); }
            else { rows.push({ u: u, k: "", n: "" }); processedUnits.add(u); }
        }
    });

    Object.keys(store.operadoresDB || {}).forEach(clave => {
        let opName = store.operadoresDB[clave];
        if(opName && !processedOps.has(opName)) { rows.push({ u: "", k: clave, n: opName }); processedOps.add(opName); }
    });

    rows.forEach(r => {
        let uReason = getMotivoUnidad(r.u);
        let opMeta = getOpMeta(r.n);
        let opReason = getReasonForEntity(r.n) || getReasonForEntity(r.k);
        r.v = getVueltas(r.n);
        r.p = opMeta.puntualidad !== null ? opMeta.puntualidad : -1;
        r.sortWeight = 1; 
        let opLow = (opReason || "").toLowerCase();
        let nLow = (r.n || "").toLowerCase();
        let isTurismo = opMeta.esTurismo;
        let isBaja = opMeta.esBaja || (opMeta.puntualidad !== null && opMeta.puntualidad === 0);
        let isApoyo = !isTurismo && (opLow.includes("apoyo") || nLow.includes("apoyo"));

        if (isTurismo) {
            r.st = "🚌 Apoyo Turismo (No activo)";
            r.cat = "row-gray";
            r.sortWeight = 3;
        } else if (isBaja) {
            r.st = opMeta.puntualidad === 0 ? "⛔ Puntualidad 0 (No contemplado)" : "⛔ Baja";
            r.cat = "row-baja";
            r.sortWeight = 3;
        } else if(r.u && r.n) {
            r.st = "Asignado"; r.cat = "row-ok";
            if(isApoyo) { r.cat = "row-gray"; r.st = "Asignado (Apoyo)"; } 
            if(uReason) { r.st = `🔧 Taller: ${uReason}`; r.cat = "row-bad"; }
            else if(opReason && !isApoyo) { r.st = `⚠️ Operador: ${opReason}`; r.cat = "row-bad"; }
        } else if(r.u && !r.n) {
            if(uReason) { r.st = `🔧 En Taller (${uReason})`; r.cat = "row-bad"; }
            else { r.st = "Disponible (Sin Op)"; r.cat = "row-disp"; }
        } else if(!r.u && r.n) {
            if (isApoyo) {
                r.st = opReason || "Apoyo"; r.cat = "row-gray"; r.sortWeight = 2; 
            } else if(opReason && ESTADOS_CRITICOS.includes(opReason)) {
                r.st = `Inhábil (${opReason})`; r.cat = "row-bad";
            } else {
                r.st = "Habilitado (Sin unidad)"; r.cat = "row-warn";
            }
        }
    });

    if(searchTerm) {
        let st = searchTerm.toLowerCase();
        rows = rows.filter(x => ((x.u||"")+" "+(x.n||"")+" "+(x.k||"")+" "+(x.st||"")).toLowerCase().includes(st));
    }
    
    if(showRevisar) {
        rows = rows.filter(r => r.cat === "row-bad" || r.cat === "row-warn" || r.cat === "row-disp");
    }

    rows.sort((a,b) => {
        if (a.sortWeight !== b.sortWeight) return a.sortWeight - b.sortWeight;
        let valA = a[flotaSortCol] ?? ""; let valB = b[flotaSortCol] ?? "";
        if(flotaSortCol === 'u' || flotaSortCol === 'k' || flotaSortCol === 'v' || flotaSortCol === 'p') return (Number(valA) - Number(valB)) * flotaSortDir;
        return String(valA).localeCompare(String(valB)) * flotaSortDir;
    });

    let trs = rows.map(r => {
        let safeU = encodeURIComponent(r.u || '');
        let safeK = encodeURIComponent(r.k || '');
        let safeN = encodeURIComponent(r.n || '');
        return `
        <tr class="${r.cat}" onclick="abrirModalFlotaDedicado(decodeURIComponent('${safeU}'), decodeURIComponent('${safeK}'), decodeURIComponent('${safeN}'))">
            <td class="mono" style="font-weight:800;">${r.u ? 'U-'+r.u : '---'}</td>
            <td class="mono">${r.k || '---'}</td>
            <td><b>${r.n || '---'}</b></td>
            <td style="text-align:center;">${r.n ? (renderPuntualidadBadge(r.n) || '—') : '—'}</td>
            <td style="text-align:center; font-weight:800; color:var(--accent); font-size:14px;">${r.v}</td>
            <td>${r.st}</td>
        </tr>`;
    }).join('');

    let html = `
    <div style="padding: 0 12px 14px;">
        <div class="table-container">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th class="${flotaSortCol==='u'?'th-active':''}" onclick="sortFlota('u')">Unidad <span class="sort-arrow">${flotaSortDir===1?'↑':'↓'}</span></th>
                        <th class="${flotaSortCol==='k'?'th-active':''}" onclick="sortFlota('k')">Clave <span class="sort-arrow">${flotaSortDir===1?'↑':'↓'}</span></th>
                        <th class="${flotaSortCol==='n'?'th-active':''}" onclick="sortFlota('n')">Operador <span class="sort-arrow">${flotaSortDir===1?'↑':'↓'}</span></th>
                        <th class="${flotaSortCol==='p'?'th-active':''}" onclick="sortFlota('p')" style="text-align:center;">Punt. AS <span class="sort-arrow">${flotaSortDir===1?'↑':'↓'}</span></th>
                        <th class="${flotaSortCol==='v'?'th-active':''}" onclick="sortFlota('v')" style="text-align:center;">Vueltas <span class="sort-arrow">${flotaSortDir===1?'↑':'↓'}</span></th>
                        <th class="${flotaSortCol==='st'?'th-active':''}" onclick="sortFlota('st')">Disponibilidad <span class="sort-arrow">${flotaSortDir===1?'↑':'↓'}</span></th>
                    </tr>
                </thead>
                <tbody>${trs}</tbody>
            </table>
        </div>
    </div>`;

    document.getElementById("list").innerHTML = html || "<div style='text-align:center;padding:40px;color:gray;'>Flota vacía o sin coincidencias.</div>";
}

window.abrirModalFlotaDedicado = function(u, k, n) {
    window._flotaCtx = { origU: u || "", origK: k || "", origOp: n || "" };
    let trips = (store.days[store.currentDay] && store.days[store.currentDay].trips ? store.days[store.currentDay].trips : []).filter(t => t.n === n || (u && String(t.u) === String(u))).sort((a,b) => a.h.localeCompare(b.h));
    let tripsHtml = trips.length ? trips.map(t => `<div style="padding:4px 0; border-bottom:1px solid #eee; font-size:13px;">${t.h} - ${formatRouteName(t.o, t.d)}</div>`).join('') : 'Sin rol planeado hoy';

    let opOptions = `<option value="VACIO">-- Sin Asignar (Separar) --</option>`;
    if(store.operadoresDB) Object.values(store.operadoresDB).filter(v=>v && isOperadorActivo(v)).sort().forEach(name => opOptions += `<option value="${name}">`);

    let uOptions = `<option value="VACIO">-- Sin Unidad (Separar) --</option>`;
    FLOTA_FIJA.forEach(f => {
        let motT = getMotivoUnidad(f.u);
        uOptions += `<option value="${f.u}" ${String(f.u) === String(u) ? 'selected' : ''}>U-${f.u} [${f.p}]${motT ? ' ⚠️ (Taller: ' + motT + ')' : ''}</option>`;
    });

    let meta = getOpMeta(n);
    let estU = u ? (isUnidadEnTallerOInhabil(u) ? 'Taller' : (getReasonForEntity(u) || 'Activa')) : 'Activa';
    let estOp = n ? (meta.esTurismo ? 'Apoyo Turismo' : (meta.esBaja ? 'Baja' : (getReasonForEntity(n) || getReasonForEntity(k) || 'Activo'))) : 'Activo';

    let selectUStatus = ['Activa', 'Taller', 'Siniestro', 'Falla mecánica', 'Sin diésel'].map(s => `<option value="${s}" ${s===estU?'selected':''}>${s}</option>`).join('');
    let selectOpStatus = ['Activo', 'Falta', 'Permiso', 'Apoyo', 'Apoyo Turismo', 'Incapacidad', 'Baja'].map(s => `<option value="${s}" ${s===estOp?'selected':''}>${s}</option>`).join('');

    openSheet(`
        <h2 style="margin-bottom:8px;">Edición Flota ${u ? `U-${u}` : ''} ${n ? `(${n})` : ''}</h2>
        <div style="margin-bottom: 12px; background: var(--surface-2); padding:10px; border-radius:8px;">
            <strong style="font-size:13px;">Rol / Rutas:</strong><div style="max-height:80px;overflow-y:auto;font-size:13px;">${tripsHtml}</div>
        </div>

        <label style="font-size:13px; font-weight:bold;">1. Unidad Asignada:</label>
        <select id="modalU" class="input-field" style="appearance:auto; padding: 12px; margin-bottom:8px;">${uOptions}</select>
        <label style="font-size:13px; font-weight:bold;">Estatus de Unidad (Taller):</label>
        <select id="modalEstU" class="input-field" style="appearance:auto; padding: 12px;" onchange="if(this.value!=='Activa') document.getElementById('modalOp').value='VACIO'">
          ${selectUStatus}
        </select>

        <label style="font-size:13px; font-weight:bold;">2. Operador Asignado:</label>
        <input type="text" id="modalOp" list="opList" class="input-field" value="${n||''}" placeholder="Buscar o vaciar..." autocomplete="off" style="margin-bottom:8px;">
        <datalist id="opList">${opOptions}</datalist>

        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
            <div>
                <label style="font-size:11.5px; font-weight:bold;">Puntualidad (AS):</label>
                <input type="number" id="modalPunt" class="input-field" min="0" max="10" step="1" value="${meta.puntualidad !== null ? meta.puntualidad : 10}" style="padding:10px;">
            </div>
            <div>
                <label style="font-size:11.5px; font-weight:bold;">📱 Personal (Col G):</label>
                <input type="tel" id="modalTelG" class="input-field" maxlength="10" placeholder="Col G..." value="${meta.telPersonal || ''}" style="padding:10px;">
            </div>
            <div>
                <label style="font-size:11.5px; font-weight:bold;">🏢 Empresa (Col H):</label>
                <input type="tel" id="modalTelH" class="input-field" maxlength="10" placeholder="Col H..." value="${meta.telEmpresa || ''}" style="padding:10px;">
            </div>
        </div>

        <label style="font-size:13px; font-weight:bold;">Estatus de Operador:</label>
        <select id="modalEstOp" class="input-field" style="appearance:auto; padding: 12px;" onchange="if(this.value!=='Activo' && this.value!=='Apoyo') document.getElementById('modalU').value='VACIO'">
          ${selectOpStatus}
        </select>

        <button type="button" class="btn-primary" onclick="guardarFlotaDedicado()">Guardar y Separar Automáticamente</button>
        <button type="button" class="btn-outline" onclick="closeSheet()">Cancelar</button>
    `);
};

window.guardarFlotaDedicado = function() {
    let ctx = window._flotaCtx || {};
    let origU = ctx.origU || "";
    let origOp = ctx.origOp || "";
    let origK = ctx.origK || "";

    let finalU = document.getElementById("modalU").value;
    let finalOp = document.getElementById("modalOp").value.trim();
    let stU = document.getElementById("modalEstU").value;
    let stOp = document.getElementById("modalEstOp").value;
    let puntVal = Number(document.getElementById("modalPunt")?.value);
    let telGVal = cleanPhone10(document.getElementById("modalTelG")?.value || "");
    let telHVal = cleanPhone10(document.getElementById("modalTelH")?.value || "");

    let ds = getDayState();
    let dKey = fbKey(store.currentDay);
    store.unassignedReasons = store.unassignedReasons || {};
    store.operadoresDB = store.operadoresDB || {};
    store.operadoresMeta = store.operadoresMeta || {};
    store.tallerDB = store.tallerDB || {};
    ds.opOverride = ds.opOverride || {}; ds.unitOverride = ds.unitOverride || {};

    if(origU) ds.opOverride[fbKey(origU)] = "VACIO";
    if(origOp) {
        ds.unitOverride[fbKey(origOp)] = "VACIO";
        let oldCode = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === origOp);
        if(oldCode) ds.unitOverride[fbKey(oldCode)] = "VACIO";
    }
    if(origK) ds.unitOverride[fbKey(origK)] = "VACIO";

    if(finalU && finalU !== "VACIO") ds.opOverride[fbKey(finalU)] = "VACIO";
    if(finalOp && finalOp !== "VACIO") {
        ds.unitOverride[fbKey(finalOp)] = "VACIO";
        let opCode = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === finalOp);
        if(opCode) ds.unitOverride[fbKey(opCode)] = "VACIO";
    }

    let checkU = (finalU && finalU !== "VACIO") ? finalU : origU;
    if(checkU) {
        let kU = fbKey(checkU);
        if(stU === "Activa") {
            setReasonForEntity(kU, null);
            delete store.tallerDB[kU];
        } else {
            setReasonForEntity(kU, stU);
            store.tallerDB[kU] = stU;
            finalU = "VACIO";
        }
    }

    let checkOp = (finalOp && finalOp !== "VACIO") ? finalOp : origOp;
    if(checkOp) {
        let kOp = fbKey(checkOp);
        if(!store.operadoresMeta[kOp]) store.operadoresMeta[kOp] = {};
        store.operadoresMeta[kOp].puntualidad = isNaN(puntVal) ? 10 : puntVal;
        store.operadoresMeta[kOp].telPersonal = telGVal;
        store.operadoresMeta[kOp].telEmpresa = telHVal;
        store.operadoresMeta[kOp].tel = telHVal || telGVal;
        store.operadoresMeta[kOp].esTurismo = (stOp === "Apoyo Turismo");
        store.operadoresMeta[kOp].esBaja = (stOp === "Baja" || puntVal === 0);

        let opCode = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === checkOp);
        if(stOp === "Activo") {
            setReasonForEntity(kOp, null);
            if(opCode) setReasonForEntity(opCode, null);
        } else {
            setReasonForEntity(kOp, stOp);
            if(opCode) setReasonForEntity(opCode, stOp);
        }
    }

    if(finalU !== "VACIO" && finalOp !== "" && finalOp !== "VACIO" && isOperadorActivo(finalOp) && !isUnidadEnTallerOInhabil(finalU)) {
        ds.opOverride[fbKey(finalU)] = finalOp;
        ds.unitOverride[fbKey(finalOp)] = finalU;
        let opC = Object.keys(store.operadoresDB).find(k => store.operadoresDB[k] === finalOp);
        if (opC) ds.unitOverride[fbKey(opC)] = finalU;
    }

    let motivosFlota = [];
    if (stU && stU !== "Activa") motivosFlota.push(stU);
    if (stOp && stOp !== "Activo") motivosFlota.push(stOp);
    let reasonText = motivosFlota.length ? motivosFlota.join(" / ") : "Cambio de asignación en Flota";

    registrarEnHistorial({
        tripTime: "Todo el día",
        clave: origK || "—",
        route: "Edición de Flota",
        scope: "Impacta a todas las vueltas planeadas",
        oldUnit: origU || "S/U",
        newUnit: (!finalU || finalU === "VACIO") ? "S/U" : finalU,
        oldOp: origOp || "Sin Asignar",
        newOp: (!finalOp || finalOp === "VACIO") ? "Sin Asignar" : finalOp,
        reason: reasonText,
        type: "Flota"
    });

    closeSheet();
    render();
    savePatch({
        [`state/${dKey}/opOverride`]: ds.opOverride,
        [`state/${dKey}/unitOverride`]: ds.unitOverride,
        [`state/${dKey}/unitChanges`]: ds.unitChanges,
        unassignedReasons: store.unassignedReasons,
        operadoresMeta: store.operadoresMeta,
        tallerDB: store.tallerDB,
        globalHistory: store.globalHistory
    });
};

window.aplicarSugerenciaCobertura = function(op, unit, whyText) {
    const opInput = document.getElementById("newOpInput");
    const uInput = document.getElementById("newUInput");
    const scopeSelect = document.getElementById("scopeSelect");
    if (opInput) opInput.value = op;
    if (uInput && unit) uInput.value = unit;
    if (scopeSelect) scopeSelect.value = "one";
    window._selectedReason = `Cobertura (${whyText.slice(0, 65)}...)`;
    document.querySelectorAll(".reason-chip").forEach(b => {
        b.classList.toggle("sel", b.textContent === "Apoyo" || b.textContent === "Enroque");
    });
};

window.openChangeModal = function(card) {
    let tripId = card.getAttribute("data-id") || "";
    let trip = (store.days?.[store.currentDay]?.trips || []).find(t => String(t.id) === String(tripId));
    let ds = getDayState();
    let baselineOp = {};
    if(store.globalFleet) { store.globalFleet.forEach(g => { if(g && g.u && g.n) baselineOp[String(g.u)] = g.n; }); }

    let oldU = card.getAttribute("data-u") || "";
    let oldOp = card.getAttribute("data-n") || "";
    if (oldOp === "Sin asignar") oldOp = "";

    if (trip) {
        let asg = resolveTripAssignment(trip, ds, baselineOp);
        oldU = asg.unit;
        oldOp = asg.op;
    }

    let fleetKey = card.getAttribute("data-k") || card.getAttribute("data-origu") || (trip ? (trip.k || trip.n || trip.u || "") : "");
    window._changeModalCtx = {
        fleetKey: String(fleetKey || ""),
        tripId: String(tripId || ""),
        oldU: String(oldU || ""),
        oldOp: String(oldOp || "")
    };

    let opOptions = `<option value="VACIO">-- Sin Asignar (Vaciar) --</option>`;
    let allOpNames = new Set();
    if(store.operadoresDB) Object.values(store.operadoresDB).filter(Boolean).forEach(name => { if(isOperadorActivo(name)) allOpNames.add(name); });
    if(store.days && store.days[store.currentDay] && store.days[store.currentDay].trips) {
        store.days[store.currentDay].trips.forEach(t => { if(t.n && isOperadorActivo(t.n)) allOpNames.add(t.n); });
    }
    [...allOpNames].sort((a,b) => {
        let pA = getOpMeta(a).puntualidad ?? 5;
        let pB = getOpMeta(b).puntualidad ?? 5;
        return (pB - pA) || a.localeCompare(b);
    }).forEach(name => {
        let m = getOpMeta(name);
        let labelPunt = m.puntualidad !== null ? `⭐ Puntualidad: ${m.puntualidad}` : "Activo";
        opOptions += `<option value="${String(name).replace(/"/g, '&quot;')}">${labelPunt}</option>`;
    });

    let selectOptions = `<option value="VACIO">-- Sin Asignar (Quitar Carro) --</option>`;
    FLOTA_FIJA.forEach(f => {
        let motTaller = getMotivoUnidad(f.u);
        let tallerWarn = motTaller ? ` ⚠️ [EN TALLER: ${motTaller}]` : '';
        selectOptions += `<option value="${f.u}" ${String(f.u) === String(oldU) ? 'selected' : ''}>U-${f.u} [${f.p}]${tallerWarn}</option>`;
    });

    window._selectedReason = "";
    let reasonsHtml = MOTIVOS_RAPIDOS.map(r => `<button type="button" class="reason-chip" onclick="seleccionarMotivo(this, '${r}')">${r}</button>`).join('');

    let headerInfo = trip ? `
      <div style="background:var(--surface-2);padding:12px;border-radius:12px;margin-bottom:12px;font-size:13.5px;">
        <b>${trip.h}</b> · ${formatRouteName(trip.o, trip.d)} ${isForaneaTrip(trip) ? '<span class="tag-foranea">FORÁNEA</span>' : ''}<br>
        <small style="color:var(--ink-soft);">Clave: ${trip.k || '—'} | Titular actual: ${oldU ? 'U-'+oldU : 'S/U'} · ${oldOp || 'Sin Op'} ${oldOp ? renderPuntualidadBadge(oldOp) : ''}</small>
      </div>` : '';

    let recomendacionesHtml = "";
    if (trip) {
        let candidatos = recomendarCandidatosParaViaje(trip);
        if (candidatos.length > 0) {
            let cardsSug = candidatos.map(c => {
                let safeOp = encodeURIComponent(c.op);
                let safeU = encodeURIComponent(c.unit || '');
                let safeWhy = encodeURIComponent(c.windowText);
                return `
                <div class="cov-card ${c.score>=900?'guardia':''}">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
                        <b style="font-size:14px;color:var(--ink);">${c.op} ${renderPuntualidadBadge(c.op)} ${c.unit ? `<span style="background:var(--surface-2);padding:2px 6px;border-radius:5px;font-size:12px;">U-${c.unit}</span>` : ''}</b>
                        <button type="button" style="background:var(--accent);color:white;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:800;cursor:pointer;" onclick="aplicarSugerenciaCobertura(decodeURIComponent('${safeOp}'), decodeURIComponent('${safeU}'), decodeURIComponent('${safeWhy}'))">⚡ Elegir</button>
                    </div>
                    <div style="font-size:12px;font-weight:800;color:var(--done);margin-top:4px;">${c.badge} · ${c.windowText}</div>
                    <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;"><b>¿Por qué?:</b> ${c.why}</div>
                </div>`;
            }).join('');
            recomendacionesHtml = `
            <div style="margin-bottom:14px;">
                <div style="font-size:12.5px;font-weight:800;color:var(--accent);margin-bottom:6px;">
                    🧠 MEJORES OPCIONES ACTIVAS PARA CUBRIR (Priorizadas por Puntualidad AS):
                </div>
                <div style="max-height:195px;overflow-y:auto;padding-right:2px;">${cardsSug}</div>
            </div>`;
        }
    }

    openSheet(`
      <h2>Asignar / Cubrir en Ruta</h2>
      ${headerInfo}
      ${recomendacionesHtml}
      <label style="font-size:13.5px; font-weight:800;">Unidad (Flota Autorizada - Alerta Taller):</label>
      <select id="newUInput" class="input-field" style="appearance:auto; padding: 12px;">${selectOptions}</select>
      <label style="font-size:13.5px; font-weight:800;">Operador Activo (Excluye Turismo y Puntualidad 0):</label>
      <input type="text" id="newOpInput" list="opList" class="input-field" value="${String(oldOp).replace(/"/g, '&quot;')}" placeholder="Escribe para buscar o vacía..." autocomplete="off">
      <datalist id="opList">${opOptions}</datalist>
      <p style="margin:6px 0 5px; font-weight:800; font-size:13.5px;">Motivo del cambio / cobertura:</p>
      <div class="reason-grid">${reasonsHtml}</div>
      ${(tripId && tripId !== 'null') ? `<label style="font-size:13.5px; font-weight:800;">¿Aplica para?</label><select id="scopeSelect" class="input-field" style="appearance:auto; padding: 12px; margin-top:5px;"><option value="all" selected>Todas las vueltas del día (Recomendado)</option><option value="one">Solo para ESTE horario (Cobertura puntual)</option></select>` : ''}
      <button type="button" class="btn-primary" onclick="procesarCambio()">Guardar Cambios y Notificar</button>
      <button type="button" class="btn-outline" onclick="closeSheet()">Cancelar</button>

window.procesarCambio = function() {

    let oldU = ctx.oldU || "";
    let oldOp = ctx.oldOp || "";

    let newU = document.getElementById("newUInput").value;
    let newOp = document.getElementById("newOpInput").value.trim();
    if(newOp === "") newOp = "VACIO";
    let reason = window._selectedReason || "Reasignación manual";
    let ds = getDayState();
    let dKey = fbKey(store.currentDay);
    let scopeEl = document.getElementById("scopeSelect");
    let scope = (tripId && tripId !== 'null' && scopeEl) ? scopeEl.value : 'all';
    
    if(scope === 'all' && fleetKey) {
        ds.unitOverride[fleetKey] = newU === "" ? "VACIO" : newU;
        ds.opOverride[fleetKey] = newOp === "" ? "VACIO" : newOp;
        if (tripId) {
            delete ds.tripUnitOverride[tripId];
            delete ds.tripOpOverride[tripId];
        }
    } else if (tripId) {
        ds.tripUnitOverride[tripId] = newU === "" ? "VACIO" : newU;
        ds.tripOpOverride[tripId] = newOp === "" ? "VACIO" : newOp;
    }

    let changedTrip = (tripId && tripId !== 'null') ? (store.days[store.currentDay].trips || []).find(x => String(x.id) === String(tripId)) : null;
    registrarEnHistorial({
        tripTime: changedTrip ? changedTrip.h : "N/A",
        clave: changedTrip ? (changedTrip.k || fleetKey || "—") : (fleetKey || "—"),
        route: changedTrip ? formatRouteName(changedTrip.o, changedTrip.d) : "Ruta General",
        scope: scope === "all" ? "Todas las vueltas de este operador" : "Solo este horario",
        tripId: tripId,
        oldUnit: oldU || "S/U",
        newUnit: (!newU || newU === "VACIO") ? "S/U" : newU,
        oldOp: oldOp || "Sin Asignar",
        newOp: (!newOp || newOp === "VACIO") ? "Sin Asignar" : newOp,
        reason: reason,
        type: "Viaje"
    });

    closeSheet();
    render();
    savePatch({
        [`state/${dKey}/unitOverride`]: ds.unitOverride,
        [`state/${dKey}/opOverride`]: ds.opOverride,
        [`state/${dKey}/tripUnitOverride`]: ds.tripUnitOverride,
        [`state/${dKey}/tripOpOverride`]: ds.tripOpOverride,
        [`state/${dKey}/unitChanges`]: ds.unitChanges,
        globalHistory: store.globalHistory
    });
};

window.verVacios = function() {
    let trips = (store.days[store.currentDay] && store.days[store.currentDay].trips) ? store.days[store.currentDay].trips : [];
    let ds = getDayState(); var groups = {};
    let baselineOp = {}; if(store.globalFleet) { store.globalFleet.forEach(g => { if(g && g.u && g.n) baselineOp[String(g.u)] = g.n; }); }

    trips.forEach(t => {
      let asg = resolveTripAssignment(t, ds, baselineOp);
      if(asg.op) { if (!groups[asg.op]) groups[asg.op] = { nombre: asg.op, unidad: asg.unit, trips: [] }; groups[asg.op].trips.push(t); }
    });
    
    var results = [];
    Object.keys(groups).forEach(g => {
      var list = groups[g].trips.slice().sort((a,b) => a.h.localeCompare(b.h));
      for (var i=0; i<list.length-1; i++){
        var cur = list[i], nxt = list[i+1];
        let curDest = normLoc(cur.d), nxtOrig = normLoc(nxt.o);
        if (curDest !== nxtOrig) {
          if(curDest.includes("CU2") || nxtOrig.includes("CU2")) {
              results.push({ nombre: groups[g].nombre, unidad: groups[g].unidad, viajeActual: `${cur.o} a ${cur.d}`, horaActual: cur.h, viajeProximo: `${nxt.o} a ${nxt.d}`, horaProximo: nxt.h, vacioFrom: curDest, vacioTo: nxtOrig });
          }
        }
      }
    });

    var nowMin = new Date().getHours()*60 + new Date().getMinutes();
    var upcoming = results.filter(r => hhmmToMins(r.horaProximo) > nowMin).sort((a,b) => hhmmToMins(a.horaProximo) - hhmmToMins(b.horaProximo));
    
    var upcomingHtml = upcoming.length ? upcoming.map(r => `<div class="avail-row"><div class="avail-top"><span class="avail-name" style="color:var(--pend)">🚎 Vacío: ${r.vacioFrom} ➔ ${r.vacioTo}</span><span class="avail-unit">${r.unidad ? 'U-'+r.unidad : 'S/U'}</span></div><div class="avail-detail" style="font-size:13.5px;"><b>Operador:</b> ${r.nombre} ${renderPuntualidadBadge(r.nombre)}</div><div class="avail-detail" style="margin-top:6px;font-size:13.5px;"><b>Viaje Actual:</b> ${formatRouteName(r.viajeActual.split(' a ')[0], r.viajeActual.split(' a ')[1])} (${r.horaActual})</div><div class="avail-next" style="color:var(--bad);font-size:13.5px;margin-top:3px;"><b>Próximo Viaje:</b> ${formatRouteName(r.viajeProximo.split(' a ')[0], r.viajeProximo.split(' a ')[1])} (${r.horaProximo})</div></div>`).join("") : '<div class="empty"><div class="big" style="padding: 20px; text-align: center; color: gray;">No hay vacíos pendientes para CU2</div></div>';
    openSheet(`<h2>🚎 Traslados en Vacío (Solo CU2)</h2><div class="desc" style="font-size:13.5px; color:gray; margin-bottom:10px;">Vueltas donde el operador termina y debe trasladarse hacia o desde CU2.</div><div style="max-height:60vh;overflow-y:auto;">${upcomingHtml}</div><button type="button" class="btn-outline" onclick="closeSheet()">Cerrar</button>`);
};

function obtenerHistorialFiltrado() {

        if (historySearchTerm) {
            let texto = `${c.day||''} ${c.route||''} ${c.tripTime||''} ${c.clave||''} ${c.oldUnit||''} ${c.newUnit||''} ${c.oldOp||''} ${c.newOp||''} ${c.reason||''}`.toLowerCase();
            if (!texto.includes(historySearchTerm)) return false;
        }
        return true;
    });
}

async function handleExcel(file, type, inputEl) {
    if(!file) return;
    let msgBox = document.getElementById("uploadMsg");
    if(msgBox) msgBox.innerHTML = `<span style="color:var(--pend)">Procesando ${file.name} y subiendo a la nube...</span>`;
    try {
        await ensureXLSXLoaded();
    } catch (err) {
        if(msgBox) msgBox.innerHTML = `<span style="color:var(--bad)">${err.message}</span>`;
        inputEl.value = "";
        return;
    }

    let reader = new FileReader();
    reader.onload = e => {
      try {
        const backupHistory = [...getGlobalHistory()];
        let wb = XLSX.read(e.target.result, {type: 'array'});

        if(type === 'seguimiento') {
            store.operadoresDB = {};
            store.operadoresMeta = {};
            store.tallerDB = {};
            store.globalFleet = [];
            store.unassignedReasons = {};
            
            if(store.state) {
                Object.keys(store.state).forEach(day => {
                    store.state[day].unitOverride = {};
                    store.state[day].opOverride = {};
                    store.state[day].tripUnitOverride = {};
                    store.state[day].tripOpOverride = {};
                });
            }

            let opSheetName = wb.SheetNames.find(n => /OP|DATOS|PLANTILLA|PERSONAL/i.test(n)) || wb.SheetNames[0];
            if(opSheetName) {
                let sheetObj = wb.Sheets[opSheetName];
                let rawData = XLSX.utils.sheet_to_json(sheetObj, {header:1, defval: null});
                let hRow = -1;
                for(let r=0; r<Math.min(rawData.length, 30); r++) {
                    if((rawData[r]||[]).some(c => /NOMBRE OPERADOR|NOMBRE|OPERADOR/i.test(String(c||"")))) { hRow = r; break; }
                }

                if(hRow !== -1) {
                    let headers = rawData[hRow].map(h => String(h||"").toUpperCase().trim());
                    let colNombre = headers.findIndex(h => h.includes("NOMBRE OPERADOR") || h === "NOMBRE" || h.includes("OPERADOR"));
                    let colClave = headers.findIndex(h => h.includes("CLAVE") || h === "ID" || h.includes("NOMINA"));
                    let colUnidad = headers.findIndex(h => h.includes("UNIDAD") || h === "ECON" || h.includes("AUTOBUS"));
                    let colPuntHeader = headers.findIndex(h => h.includes("PUNTUALIDAD") || h.includes("CALIF"));

                    const COL_G_PERSONAL = 6;  // Columna G
                    const COL_H_EMPRESA  = 7;  // Columna H
                    const COL_AS_PUNT    = 44; // Columna AS

                    if(colNombre !== -1) {
                        for(let i=hRow+1; i<rawData.length; i++) {
                            let row = rawData[i] || [];
                            let rawName = row[colNombre];
                            if(!rawName || String(rawName).trim() === "") continue;
                            let opName = String(rawName).replace(/\s+/g, " ").trim();
                            if (/^(NOMBRE|OPERADOR|TOTAL)$/i.test(opName)) continue;
                            
                            let opClave = colClave !== -1 && row[colClave] != null ? String(row[colClave]).trim() : null;
                            let opUnit = colUnidad !== -1 && row[colUnidad] != null ? String(row[colUnidad]).trim() : null;
                            if (opUnit && !isNaN(Number(opUnit))) opUnit = String(Math.round(Number(opUnit)));

                            let cellG = sheetObj[XLSX.utils.encode_cell({r: i, c: COL_G_PERSONAL})];
                            let cellH = sheetObj[XLSX.utils.encode_cell({r: i, c: COL_H_EMPRESA})];
                            let rawTelG = (cellG && cellG.v !== undefined) ? cellG.v : row[COL_G_PERSONAL];
                            let rawTelH = (cellH && cellH.v !== undefined) ? cellH.v : row[COL_H_EMPRESA];

                            let telPersonal = cleanPhone10(rawTelG);
                            let telEmpresa  = cleanPhone10(rawTelH);

                            let cellAS = sheetObj[XLSX.utils.encode_cell({r: i, c: COL_AS_PUNT})];
                            let rawPunt = (cellAS && cellAS.v !== undefined && String(cellAS.v).trim() !== "")
                                ? cellAS.v
                                : ((row[COL_AS_PUNT] !== undefined && row[COL_AS_PUNT] !== null && String(row[COL_AS_PUNT]).trim() !== "")
                                    ? row[COL_AS_PUNT]
                                    : (colPuntHeader !== -1 ? row[colPuntHeader] : null));

                            let puntualidad = null;
                            if (rawPunt !== null && rawPunt !== undefined && String(rawPunt).trim() !== "") {
                                let numP = Number(String(rawPunt).replace(/[^0-9.-]/g, ""));
                                if (!isNaN(numP)) {
                                    if (numP > 10 && numP <= 100) numP = Math.round((numP / 10) * 10) / 10;
                                    puntualidad = numP;
                                }
                            }

                            let rowJoined = row.map(c => String(c || "")).join(" ").toUpperCase();
                            let esTurismo = /TURISMO/i.test(rowJoined);
                            let esBaja = /\bBAJA\b/i.test(rowJoined) || (puntualidad !== null && puntualidad === 0);

                            let safeClave = fbKey(opClave || opName);
                            let safeOpKey = fbKey(opName);
                            store.operadoresDB[safeClave] = opName;

                            store.operadoresMeta[safeOpKey] = {
                                clave: opClave || "",
                                u: opUnit || "",
                                puntualidad: puntualidad,
                                telPersonal: telPersonal,
                                telEmpresa: telEmpresa,
                                tel: telEmpresa || telPersonal || "",
                                esTurismo: esTurismo,
                                esBaja: esBaja
                            };

                            if (esTurismo) {
                                setReasonForEntity(safeOpKey, "Apoyo Turismo");
                            } else if (esBaja) {
                                setReasonForEntity(safeOpKey, "Baja");
                            } else if (/\bAPOYO\b/i.test(rowJoined)) {
                                setReasonForEntity(safeOpKey, "Apoyo");
                            }

                            if (!esTurismo && !esBaja && (opUnit || opName)) {
                                store.globalFleet.push({ u: opUnit || "", k: safeClave, n: opName, estatus: "Activa" });
                            }
                        }
                    }
                }
            }

            wb.SheetNames.forEach(sheetName => {
                if (/TALLER|MANTENIMIENTO|DETENID|FALLA|SINIESTRO|PARQUE|FLOTA|UNIDAD/i.test(sheetName)) {
                    let fData = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval: null});
                    let isDedicatedTallerSheet = /TALLER|MANTENIMIENTO|DETENID|FALLA|SINIESTRO/i.test(sheetName);
                    let hRow = fData.findIndex(row => (row||[]).some(c => /UNIDAD|ECON|AUTOBUS|CARRO|NO\./i.test(String(c||""))));

                    let colUnidad = -1, colMotivo = -1, colEstado = -1;
                    if (hRow !== -1) {
                        let headers = (fData[hRow] || []).map(h => String(h||"").toUpperCase());
                        colUnidad = headers.findIndex(h => /UNIDAD|ECON|AUTOBUS|CARRO|NUM/.test(h));
                        colMotivo = headers.findIndex(h => /MOTIVO|FALLA|CAUSA|TRABAJO|OBSERV|REPARACION|DETALLE/.test(h));
                        colEstado = headers.findIndex(h => /ESTADO|ESTATUS|SITUACION/.test(h));
                    }

                    let startRow = hRow !== -1 ? hRow + 1 : 0;
                    for (let r = startRow; r < fData.length; r++) {
                        let row = fData[r] || [];
                        let foundUnit = null;

                        if (colUnidad !== -1 && row[colUnidad] != null) {
                            let cand = String(row[colUnidad]).replace(/\D/g, "");
                            if (FLOTA_SET.has(cand)) foundUnit = cand;
                        }
                        if (!foundUnit) {
                            for (let c = 0; c < Math.min(row.length, 10); c++) {
                                let cand = String(row[c] || "").replace(/^U-/i, "").trim();
                                if (FLOTA_SET.has(cand)) { foundUnit = cand; break; }
                            }
                        }

                        if (foundUnit) {
                            let mot = colMotivo !== -1 && row[colMotivo] != null ? String(row[colMotivo]).trim() : "";
                            let est = colEstado !== -1 && row[colEstado] != null ? String(row[colEstado]).trim() : "";
                            let rowStr = row.map(x => String(x || "")).join(" ");

                            if (isDedicatedTallerSheet) {
                                if (!/\b(LIBERAD[AO]|OPERANDO|EN RUTA|ACTIVA)\b/i.test(est)) {
                                    let finalMot = mot || est || "Taller";
                                    store.tallerDB[foundUnit] = finalMot;
                                    setReasonForEntity(foundUnit, "Taller");
                                }
                            } else if (/TALLER|SINIESTRO|FALLA|DETENID|CORRALON|MOTOR|CAJA/i.test(rowStr)) {
                                let finalMot = mot || est || "Taller";
                                store.tallerDB[foundUnit] = finalMot;
                                setReasonForEntity(foundUnit, "Taller");
                            }
                        }
                    }
                }
            });

            store.globalHistory = backupHistory;
            let countTaller = Object.keys(store.tallerDB || {}).length;
            let countActivos = Object.values(store.operadoresDB || {}).filter(op => isOperadorActivo(op)).length;
            render();
            saveStore((err) => {
                if (!err && msgBox) {
                    msgBox.innerHTML = `<span style="color:var(--done)">✅ ¡Sincronizado en la nube para todos los celulares! (${countActivos} ops activos y ${countTaller} unidades en Taller).</span>`;
                    setTimeout(closeSheet, 1400);
                }
            });
        } else {
            let result = parseWorkbook(e.target.result);
            if (!result.days.length) throw new Error("No se encontraron horarios en el archivo.");
            
            store.days = {};
            result.days.forEach(function(d){ 
                let safeDayKey = fbKey(d.key);
                store.days[safeDayKey] = { label: d.key, trips: d.trips, fleet: [] }; 
                let oldUnitChanges = (store.state && store.state[safeDayKey] && store.state[safeDayKey].unitChanges) ? store.state[safeDayKey].unitChanges : [];
                store.state[safeDayKey] = { trips: {}, unitOverride: {}, tripUnitOverride: {}, unitChanges: oldUnitChanges, opOverride: {}, tripOpOverride: {}, resolvedOverlaps: [], resolvedMissing: [] }; 
            });
            store.currentDay = fbKey(result.days[0].key);
            store.globalHistory = backupHistory;
            render();
            saveStore((err) => {
                if (!err && msgBox) {
                    msgBox.innerHTML = `<span style="color:var(--done)">✅ ¡Rol sincronizado en la nube! Todos los celulares y APKs ya lo tienen activo.</span>`;
                    setTimeout(closeSheet, 1400);
                }
            });
        }
      } catch (err) {
          if(msgBox) msgBox.innerHTML = `<span style="color:var(--bad)">Error: ${err.message}</span>`;
      }
      inputEl.value = ""; 
    };
    reader.readAsArrayBuffer(file);
}

function parseWorkbook(arrayBuffer){
    var wb = XLSX.read(new Uint8Array(arrayBuffer), {type:'array'});
    var grids = {}, hrCounts = {}, opSheetName = null;
    wb.SheetNames.forEach(function(name){
        var grid = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
        grids[name] = grid;
        var cnt = 0;
        grid.forEach(function(row){ (row||[]).forEach(function(v){ if (v === 'HR') cnt++; }); });
        hrCounts[name] = cnt;
        if (!opSheetName && /operador/i.test(name)) opSheetName = name;
    });
    
    var claveToName = {}, unidadToName = {};
    if (opSheetName && Object.keys(store.operadoresDB || {}).length === 0){
      var opGrid = grids[opSheetName];
      for (var i=1;i<opGrid.length;i++){
        var row = opGrid[i] || [];
        var unidad = row[0], clave = row[1], nombre = row[2];
        var nm = nombre ? String(nombre).replace(/\s+/g,' ').trim() : null;
        var unidadNum = (unidad != null && !isNaN(Number(unidad))) ? Math.round(Number(unidad)) : null;
        var claveNum = (clave != null && !isNaN(Number(clave))) ? Math.round(Number(clave)) : null;
        let finalName = nm || (store.operadoresDB && store.operadoresDB[claveNum] ? store.operadoresDB[claveNum] : null);
        if (claveNum != null) claveToName[claveNum] = finalName;
        if (unidadNum != null) unidadToName[unidadNum] = finalName; 
      }
    }

    var days = [];
    wb.SheetNames.forEach(function(name){
      if (hrCounts[name] < 3) return;
      var grid = grids[name];
      var hrCells = [];
      for (var r=0;r<grid.length;r++) for (var c=0;c<(grid[r]||[]).length;c++) if (grid[r][c] === 'HR') hrCells.push([r,c]);
      var records = [];
      hrCells.forEach(function(hc){
        var r = hc[0], c = hc[1];
        function getVal(ro,co) {
            for(let i=ro-1; i>=Math.max(ro-8,0); i--) {
                for(let j=co-3; j<co+7; j++) {
                    if(grid[i] && typeof grid[i][j] === 'string' && grid[i][j].includes('/')) return grid[i][j];
                }
            }
            return null;
        }
        var label = getVal(r, c);
        var od = label ? label.split('/') : ['Bloque '+c, ''];
        var rr = r+1;
        while (rr < grid.length){
          var hrVal = grid[rr] ? grid[rr][c] : null, busVal = grid[rr] ? grid[rr][c+1] : null, claveVal = grid[rr] ? grid[rr][c+2] : null;
          if (hrVal == null && busVal == null) break;
          
          var hStr = null;
          if (typeof hrVal === 'number' && hrVal >= 0){
            var min = Math.round((hrVal - Math.floor(hrVal))*24*60); 
            hStr = String(Math.floor(min/60)).padStart(2,'0') + ':' + String(min%60).padStart(2,'0'); 
          } else if (typeof hrVal === 'string' && hrVal.trim().includes(':')) {
            var parts = hrVal.trim().split(':');
            if (parts.length >= 2 && !isNaN(parseInt(parts[0])) && !isNaN(parseInt(parts[1]))) {
                hStr = String(parseInt(parts[0])).padStart(2,'0') + ':' + String(parseInt(parts[1])).padStart(2,'0');
            }
          }

          if (hStr != null){
            var busNum = (typeof busVal === 'number') ? Math.round(busVal) : (busVal ? String(busVal).trim() : null); 
            var claveNum2 = (typeof claveVal === 'number') ? Math.round(claveVal) : (claveVal ? String(claveVal).trim() : null);
            var safeClave = claveNum2 != null ? fbKey(claveNum2) : null;
            
            var nameOp = null; 
            if (safeClave != null && store.operadoresDB && store.operadoresDB[safeClave]) nameOp = store.operadoresDB[safeClave]; 
            else if (claveNum2 != null && claveToName[claveNum2] !== undefined) nameOp = claveToName[claveNum2]; 
            else if (busNum != null && unidadToName[busNum] !== undefined) nameOp = unidadToName[busNum];
            
            if (!nameOp && claveNum2 != null) {
                nameOp = String(claveNum2).trim();
            }

            records.push({
                id: 'u'+r+'_'+c+'_'+rr,
                o: (od[0]||'').trim() || "Desconocido",
                d: (od[1]||'').trim() || "Desconocido",
                h: hStr || "00:00",
                u: busNum != null ? String(busNum) : "",
                k: safeClave != null ? String(safeClave) : "",
                n: nameOp || ""
            });
          }
          rr++;
        }
      });
      if (records.length) {
          records.sort((a,b)=>a.h.localeCompare(b.h));
          days.push({ key: name, trips: records });
      }
    });
    return { days: days, fleet: [] }; 
}

if (loadLocalCache()) {
    setSyncStatus(false, "Caché listo", true);
    render();
}
initFirebaseConnection();

// FORZAR AL SERVICE WORKER A DESCARGAR SIEMPRE LA VERSIÓN MÁS NUEVA DE GITHUB
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
            reg.update();
        }).catch(() => {});
    });
}
