# =============================================================================
# GENERAR APK DE "STU BUAP" CON CAPACITOR
# Se ejecuta solo cuando cambias index.html (o a mano desde la pestaña Actions).
# Al terminar, la APK queda en la sección "Releases" del repositorio.
# Secretos (Settings ➜ Secrets and variables ➜ Actions):
#   ANDROID_KEYSTORE_PASSWORD  (obligatorio) una contraseña que tú inventes
#   ANDROID_KEYSTORE_BASE64    (después de la 1ª vez) la llave de firma que genera este proceso
#   GOOGLE_SERVICES_JSON       (para notificaciones) el contenido de google-services.json
# =============================================================================
name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - index.html
      - manifest.json
      - capacitor.config.json
      - package.json
      - "*.png"
      - "*.webp"
      - .github/workflows/generar-apk.yml

permissions:
  contents: write

concurrency:
  group: generar-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1 · Revisar que exista la contraseña de la llave
        env:
          LLAVE_CLAVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$LLAVE_CLAVE" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_PASSWORD. Créalo (guía, paso 5) y vuelve a correr este proceso."
            echo "❌ Falta el secreto **ANDROID_KEYSTORE_PASSWORD**. Créalo (guía, paso 5) y vuelve a correr." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 2 · Descargar el código
        uses: actions/checkout@v4

      - name: 3 · Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4 · Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 5 · Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: 6 · Copiar la app a la carpeta www
        run: |
          rm -rf www && mkdir www
          cp index.html manifest.json www/
          for f in *.png *.webp *.ico *.svg; do [ -f "$f" ] && cp "$f" www/ || true; done
          ls -la www

      - name: 7 · Crear el proyecto Android
        run: npx cap add android

      - name: 8 · Conectar Firebase para notificaciones
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ Notificaciones push: conectadas (google-services.json)." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Falta el secreto **GOOGLE_SERVICES_JSON**: la APK funciona, pero **sin** notificaciones push." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 9 · Permiso de notificaciones y número de versión
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$MAN" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MAN"
          GR=android/app/build.gradle
          sed -i -E "s/versionCode( =)? [0-9]+/versionCode = ${{ github.run_number }}/" "$GR"
          sed -i -E "s/versionName( =)? \"[^\"]*\"/versionName = \"2.0.${{ github.run_number }}\"/" "$GR"
          grep -E "versionCode|versionName" "$GR"

      - name: 10 · Ícono de la app (usa icon-512.png si existe)
        if: hashFiles('icon-512.png') != ''
        continue-on-error: true
        run: |
          mkdir -p assets && cp icon-512.png assets/logo.png
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#00509d' --splashBackgroundColor '#00509d'

      - name: 11 · Pasar la app al proyecto Android
        run: npx cap sync android

      - name: 12 · Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 13 · Firmar la APK
        env:
          LLAVE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LLAVE_CLAVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$LLAVE_B64" ]; then
            printf '%s' "$LLAVE_B64" | base64 -d > firma.jks
            echo "✅ Firmada con tu llave guardada: se instala encima de la versión anterior." >> $GITHUB_STEP_SUMMARY
          else
            keytool -genkeypair -keystore firma.jks -storetype PKCS12 -alias stu -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$LLAVE_CLAVE" -keypass "$LLAVE_CLAVE" -dname "CN=STU BUAP, O=Estrella Roja, C=MX"
            mkdir -p llave && base64 -w0 firma.jks > llave/ANDROID_KEYSTORE_BASE64.txt
            echo "🔑 Primera vez: se creó tu llave de firma. Descarga **llave-de-firma** (abajo) y guárdala como secreto ANDROID_KEYSTORE_BASE64 (guía, paso 8)." >> $GITHUB_STEP_SUMMARY
          fi
          "$BT"/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alineada.apk
          "$BT"/apksigner sign --ks firma.jks --ks-key-alias stu --ks-pass env:LLAVE_CLAVE --key-pass env:LLAVE_CLAVE --out STU-BUAP.apk alineada.apk
          "$BT"/apksigner verify STU-BUAP.apk
          rm -f firma.jks alineada.apk

      - name: 14 · Guardar la llave nueva (solo la primera vez)
        if: hashFiles('llave/ANDROID_KEYSTORE_BASE64.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: llave-de-firma
          path: llave/ANDROID_KEYSTORE_BASE64.txt
          retention-days: 3

      - name: 15 · Publicar la APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: STU BUAP · versión 2.0.${{ github.run_number }}
          body: APK generada automáticamente desde index.html. Descárgala en el teléfono e instálala.
          files: STU-BUAP.apk
